function indicatorByCode(kode){ return INDICATOR_MASTER.find(k=>k.kode===kode); }

/* ---- 5c. FINANCIAL ACTIVITY ADAPTER
   Menerjemahkan Transaksi/Alokasi/MutasiBank/Rekonsiliasi/Dokumen/
   Computed Obligation/ObligasiSekolah/Laporan/PeriodClosing menjadi
   Aktivitas yang bisa dibaca Unified KPI Engine di atas. Dihitung
   ULANG setiap kali (computed view, bukan ledger kedua), di-cache
   sekali per render lewat invalidateAktFeedCache(). ---- */
let __aktFeedCache = null;
function invalidateAktFeedCache(){ __aktFeedCache = null; }
/* hasEvidence: hanya diisi ketika BENAR ADA bukti/dokumen nyata (bukan
   self-reference placeholder) - supaya dimensi Quality (deskripsi+bukti)
   genuinely membedakan indikator yang memang soal kelengkapan bukti
   (BDS03/04/05) dari indikator fakta terkomputasi murni (yang lain). */
function mkAkt(kodeKpi, tanggal, ok, ref, opts){
  opts = opts||{};
  return Object.assign({
    id: 'fin_'+kodeKpi+'_'+(ref&&ref.id||uid('akt')), kodeKpi, tanggal, periode: periodeOfDate(tanggal),
    completionDate: ok ? tanggal : null, nilaiLangsung: ok?100:0,
    deskripsi: opts.deskripsi || (ref&&ref.label) || 'Aktivitas keuangan otomatis',
    bukti: opts.hasEvidence ? [{evidenceType: (ref&&ref.type||'DATA').toUpperCase(), referenceId: ref&&ref.id}] : [],
    checklistInstId: null, berdasarkanSurat:false,
    verificationStatus: opts.manual ? 'PENDING' : 'AUTO_VERIFIED',
    _problem: !ok, _ref: ref
  }, opts.extra||{});
}
/* Anchor tanggal untuk indikator "snapshot per periode" (posisi siswa,
   saldo akun, status laporan/closing) - HARUS memakai tanggal DI DALAM
   periode yang sedang dievaluasi (periodeAktif), BUKAN tanggal kalender
   hari ini - supaya tinjauan periode LAMPAU (Bendahara mengganti
   Periode Aktif ke bulan sebelumnya untuk audit) tetap benar, bukan
   selalu jatuh di bulan kalender nyata sekarang. */
function anchorDateForPeriode(periode){
  const ym = periodeToYearMonth(periode);
  if(!ym) return todayISO();
  return dateToISO(new Date(ym.y, ym.m+1, 0));
}
function monthsBetweenPeriode(p1, p2){
  const a=periodeToYearMonth(p1), b=periodeToYearMonth(p2);
  if(!a||!b) return 0;
  return (b.y-a.y)*12 + (b.m-a.m);
}
function refTransaksi(t, label){ return {type:'transaksi', id:t.id, label: label||(fmtDate(t.tanggal)+' - '+t.jenis+' - '+fmtRp(t.nominal))}; }
function refObligation(o){ return {type:'obligation', id:o.key, label: siswaName(o.siswaId)+' - '+o.komponenNama+' '+o.periode}; }
function refSiswa(s){ return {type:'siswa', id:s.id, label: s.nama}; }
function refDokumen(d){ return {type:'dokumen', id:d.id, label: d.judul}; }
function refRekonsiliasi(r){ return {type:'rekonsiliasi', id:r.id, label: akunNama(r.akunId)+' - '+r.periode}; }
function refAkun(a){ return {type:'akun', id:a.id, label: a.nama}; }
function refMutasi(m){ return {type:'mutasi', id:m.id, label: fmtDate(m.tanggal)+' - '+fmtRp(m.nominal)}; }
function refObligasi(o){ return {type:'obligasi', id:o.id, label: o.uraian}; }
function refPeriode(p){ return {type:'periode', id:p, label:'Periode '+p}; }
function refAnggaran(a){ return {type:'anggaran', id:a.id, label: a.program+' - '+a.periode}; }
function refLaporan(l){ return {type:'laporan', id:l.id, label: 'Laporan '+l.periode}; }

/* requiresEvidence (section 6 BDS05-I04 master prompt): hanya transaksi ARUS
   KAS nyata (PENERIMAAN/PENGELUARAN aktual, bukan TRANSFER internal atau
   Rp0/migration artifact) yang WAJIB punya bukti - Transfer antar akun sendiri
   tidak punya "bukti eksternal" yang relevan untuk diukur di sini. */
function transaksiRequiresEvidence(t){ return t.jenis!=='TRANSFER' && !isMigrationArtifact(t); }
const MUTASI_MENGGANTUNG_BATAS_HARI = 14; // sama dengan ambang dataQualityChecks MUTASI_BANK_LAMA_BELUM_DIPROSES
const BUKTI_TOLERANSI_HARI = 30;
/* RAB (Anggaran) untuk kategori pengeluaran pada suatu periode - dipakai
   BDS03-I03/I04/I05, satu sumber kebenaran supaya ketiganya konsisten. */
function anggaranRabFor(kategori, periode){ return Store.loadAnggaran().find(a=>a.program===kategori && a.periode===periode); }
/* Persetujuan pengeluaran di luar RAB (BDS03-I05): ditandai lewat keterkaitan
   ke ObligasiSekolah (komitmen sekolah yang sudah dicatat statusnya oleh
   Bendahara/Kepala Sekolah) - BUKAN field baru, memakai struktur yang sudah
   ada (section 16/17 master prompt: dilarang membuat ledger baru). */
function pengeluaranPunyaPersetujuan(t){ return Store.loadObligasi().some(o=>o.transaksiId===t.id); }

function financialAktivitasFeed(){
  if(__aktFeedCache) return __aktFeedCache;
  const out = [];
  const periode = Store.loadSettings().periodeAktif;
  const obligations = allObligationsAllSiswa();
  const penerimaan = penerimaanListReal(); // Patch: Rp0/migration artifact TIDAK masuk KPI
  const pengeluaran = pengeluaranListReal();
  const mutasi = Store.loadMutasiBank();
  const rekon = Store.loadRekonsiliasi();
  const dokumen = Store.loadDokumen();
  const akuns = akunList();
  const anggaran = Store.loadAnggaran();
  const laporanAll = Store.loadLaporan();
  const today = todayISO();
  const anchor = anchorDateForPeriode(periode);

  // ===== BDS01 - Penerimaan Siswa: Kewajiban & Pembayaran =====
  obligations.forEach(o=>{
    const tgl = (periodeToYearMonth(o.periode)? dateToISO(new Date(periodeToYearMonth(o.periode).y, periodeToYearMonth(o.periode).m,1)) : today);
    out.push(mkAkt('BDS01-I01', tgl, !o.perluReview, refObligation(o))); // Kewajiban Siswa Akurat: cek konflik keringanan nyata
    // Ekspektasi Penerimaan Siswa Terhitung & Terukur (WAJIB): Expected = Tarif
    // resolve (bruto>0) TERLEPAS dari ada/tidaknya Tagihan Formal snapshot -
    // TIDAK PERNAH NOT_APPLICABLE/0 hanya karena Tagihan Formal belum terbit.
    out.push(mkAkt('BDS01-I02', tgl, Number(o.bruto||0)>0, refObligation(o)));
    // Tunggakan Terukur & Tertelusur: populasi STABIL (semua kewajiban, bukan
    // hanya yang menunggak) supaya bulan dengan tunggakan Rp0 (hasil bagus)
    // tidak jatuh ke "Belum Ada Aktivitas" (kontribusi 0 di Zero Activity Rule).
    // Yang diukur tetap keterlusuran data tunggakan, BUKAN lunas/tidaknya -
    // kewajiban yang sudah lunas otomatis ok (tidak ada yang perlu ditelusuri).
    { const outstanding = sisaObligation(o)>0;
      const traceable = !outstanding || (!!siswaName(o.siswaId) && siswaName(o.siswaId)!=='-' && Number.isFinite(Number(o.netto)) && !!o.periode);
      out.push(mkAkt('BDS01-I05', tgl, traceable, refObligation(o)));
    }
    out.push(mkAkt('BDS01-I06', tgl, !overAllocated(o), refObligation(o))); // Tidak Ada Double Allocation
  });
  penerimaan.filter(t=>t.siswaId).forEach(t=>{
    // Pembayaran Siswa Tercatat Lengkap (ACTUAL RECEIVED saja - kelengkapan record)
    out.push(mkAkt('BDS01-I03', t.tanggal, !!(t.akunId&&t.nominal>0&&t.tanggal), refTransaksi(t)));
    // Pembayaran Siswa Teridentifikasi & Teralokasi Valid (siswa+alokasi penuh+tidak overallocated)
    const alok = alokasiForTransaksi(t.id);
    const touchedKeys = new Set(alok.map(a=>a.komponenId+'|'+a.periode));
    const anyOverAllocated = kewajibanForSiswa(t.siswaId).filter(ob=>touchedKeys.has(ob.komponenId+'|'+ob.periode)).some(overAllocated);
    const validAlokasi = sisaBelumDialokasikan(t.id)<=0.5 && !anyOverAllocated;
    out.push(mkAkt('BDS01-I04', t.tanggal, validAlokasi, refTransaksi(t)));
  });

  // ===== BDS02 - Mutasi Rekening & Rekonsiliasi =====
  mutasi.forEach(m=>{
    out.push(mkAkt('BDS02-I01', m.tanggal, !!(m.tanggal&&Number(m.nominal||0)>0), refMutasi(m))); // Seluruh Mutasi Rekening Tercatat
    const identified = m.status==='DIPROSES' && !!m.transaksiId;
    out.push(mkAkt('BDS02-I02', m.tanggal, identified, refMutasi(m))); // Mutasi Rekening Teridentifikasi
    const ageDays = m.tanggal ? (new Date()-new Date(m.tanggal))/86400000 : 0;
    out.push(mkAkt('BDS02-I03', m.tanggal, identified || ageDays<=MUTASI_MENGGANTUNG_BATAS_HARI, refMutasi(m))); // Tidak Menggantung Lewat Batas Waktu
    // Selisih Rekening Teridentifikasi & Dijelaskan: populasi STABIL (semua
    // mutasi, bukan hanya yang sudah dicocokkan) supaya periode tanpa selisih
    // (hasil bagus) tidak jatuh ke "Belum Ada Aktivitas". Belum dicocokkan
    // (identified=false) sudah jadi tanggung jawab I02/I03 - di sini ok=true
    // trivially supaya tidak dihukum dua kali untuk masalah yang sama.
    { let dijelaskanOk = true, hasEv = false;
      if(identified){
        const trx = transaksiById(m.transaksiId);
        const selisih = trx ? Math.abs(Number(trx.nominal||0)-Number(m.nominal||0)) : 0;
        if(selisih>=1){
          dijelaskanOk = !!(m.keterangan && m.keterangan.trim()) || !!(trx && trx.catatan && trx.catatan.trim());
          hasEv = dijelaskanOk;
        }
      }
      out.push(mkAkt('BDS02-I04', m.tanggal, dijelaskanOk, refMutasi(m), {hasEvidence:hasEv}));
    }
  });
  akuns.filter(a=>a.jenis==='Bank').forEach(a=>{
    const ok = rekon.some(r=>r.akunId===a.id && r.periode===periode && r.status==='SELESAI');
    out.push(mkAkt('BDS02-I05', anchor, ok, refAkun(a), {hasEvidence:ok})); // Rekonsiliasi Bank Selesai
  });

  // ===== BDS03 - Pengeluaran & Pengendalian RAB =====
  pengeluaran.forEach(t=>{
    out.push(mkAkt('BDS03-I01', t.tanggal, !!(t.akunId&&t.nominal>0&&t.tanggal), refTransaksi(t))); // Pengeluaran Tercatat Lengkap
    out.push(mkAkt('BDS03-I02', t.tanggal, !!t.kategori && !!(t.penerima&&t.penerima.trim().length>=3), refTransaksi(t))); // Kategori & Penerima
    const tPeriode = periodeOfDate(t.tanggal);
    const rab = anggaranRabFor(t.kategori, tPeriode);
    const disetujui = pengeluaranPunyaPersetujuan(t);
    // Sesuai RAB Bulanan: STRICT - ok HANYA jika ada RAB yang cocok. Persetujuan
    // TIDAK menggantikan RAB di sini (itu tugas I05) - supaya I03 dan I05 TIDAK
    // menghitung hal yang sama (bug overlap sebelumnya: keduanya pakai !!rab||disetujui).
    out.push(mkAkt('BDS03-I03', t.tanggal, !!rab, refTransaksi(t), {hasEvidence: !!rab}));
    // Di Luar RAB Memiliki Persetujuan: ada RAB -> otomatis ok (bukan masalah
    // indikator ini). Tidak ada RAB -> WAJIB ada persetujuan/komitmen ObligasiSekolah.
    out.push(mkAkt('BDS03-I05', t.tanggal, !!rab || disetujui, refTransaksi(t), {hasEvidence: !!rab||disetujui}));
  });
  { const seen={}; pengeluaran.forEach(t=>{ const k=t.tanggal+'|'+t.penerima+'|'+t.nominal; const dup=!!seen[k]; seen[k]=true; out.push(mkAkt('BDS03-I06', t.tanggal, !dup, refTransaksi(t))); }); } // Tidak Ada Duplikat
  anggaran.forEach(a=>{
    // Realisasi Tidak Melebihi Pagu (populasi PER-BARIS RAB, bukan per-transaksi - hindari inflasi populasi)
    const real = realisasiForProgram(a.program, a.periode);
    const ok = real <= Number(a.nominal||0)+0.5;
    const tglAnchor = anchorDateForPeriode(a.periode) || anchor;
    out.push(mkAkt('BDS03-I04', tglAnchor, ok, refAnggaran(a), {hasEvidence:true}));
  });

  // ===== BDS04 - Pengendalian Kas, Bank & Saldo (anchor: tanggal dalam Periode Aktif) =====
  akuns.forEach(a=>{
    const saldo = akunSaldo(a.id);
    const rekonAkunPeriode = rekon.filter(r=>r.akunId===a.id && r.periode===periode).sort((x,y)=>(y.createdAt||'').localeCompare(x.createdAt||''));
    const rekonTerbaru = rekonAkunPeriode[0];
    // Tidak Ada Saldo Tidak Wajar Tanpa Penjelasan: saldo negatif tidak otomatis
    // kesalahan Bendahara SELAMA sudah ada rekonsiliasi periode ini yang mencatatnya.
    const wajar = saldo>=0 || (rekonTerbaru && !!rekonTerbaru.catatan);
    out.push(mkAkt('BDS04-I01', anchor, wajar, refAkun(a), {hasEvidence: !!(rekonTerbaru&&rekonTerbaru.catatan)}));
    // Saldo Rekening Sesuai Catatan: populasi STABIL (semua akun setiap
    // periode, bukan hanya akun yang kebetulan sudah direkonsiliasi) -
    // ok jika sudah direkonsiliasi DAN selisih=0.
    out.push(mkAkt('BDS04-I02', anchor, !!rekonTerbaru && Number(rekonTerbaru.selisih||0)===0, refAkun(a), {hasEvidence:!!rekonTerbaru}));
    // Selisih Kas/Bank Teridentifikasi & Dijelaskan: populasi STABIL (semua
    // akun) - fokus posisi saldo akhir (beda dari BDS02-I04 yang fokus
    // matching mutasi bank). Belum direkonsiliasi/selisih=0 = tidak ada yang
    // perlu dijelaskan di sini (ok=true, sudah jadi tanggung jawab I02).
    const selisihOk = !rekonTerbaru || Number(rekonTerbaru.selisih||0)===0 || !!rekonTerbaru.catatan;
    out.push(mkAkt('BDS04-I03', anchor, selisihOk, refAkun(a), {hasEvidence: !!(rekonTerbaru&&rekonTerbaru.catatan)}));
    // Saldo Akhir Bulanan Dapat Ditelusuri: seluruh transaksi yang menyentuh akun
    // ini (s/d akhir periode) punya tanggal valid - mendukung rekonstruksi
    // Saldo Awal + Penerimaan - Pengeluaran +/- Transfer = Saldo Akhir.
    const trxAkun = allTransaksi().filter(t=>!isMigrationArtifact(t) && (t.akunId===a.id||t.akunTujuanId===a.id) && t.tanggal && t.tanggal<=anchor);
    const semuaBertanggal = trxAkun.every(t=>!!t.tanggal);
    out.push(mkAkt('BDS04-I04', anchor, semuaBertanggal, refAkun(a)));
  });

  // ===== BDS05 - Bukti & Pertanggungjawaban =====
  penerimaan.forEach(t=>{ const has=!!(t.buktiId&&t.buktiId.length); out.push(mkAkt('BDS05-I01', t.tanggal, has, refTransaksi(t), {hasEvidence:has})); });
  pengeluaran.forEach(t=>{ const has=!!(t.buktiId&&t.buktiId.length); out.push(mkAkt('BDS05-I02', t.tanggal, has, refTransaksi(t), {hasEvidence:has})); });
  dokumen.forEach(d=>out.push(mkAkt('BDS05-I03', d.tanggal||anchor, !d.transaksiId || !!transaksiById(d.transaksiId), refDokumen(d), {hasEvidence:true})));
  allTransaksi().filter(transaksiRequiresEvidence).forEach(t=>{
    const has=!!(t.buktiId&&t.buktiId.length);
    const aging = t.tanggal && (new Date()-new Date(t.tanggal))/86400000>BUKTI_TOLERANSI_HARI;
    out.push(mkAkt('BDS05-I04', t.tanggal, has||!aging, refTransaksi(t), {hasEvidence:has}));
  });
  laporanAll.forEach(l=>{
    const ids = (l.snapshot&&Array.isArray(l.snapshot.transaksiIds)) ? l.snapshot.transaksiIds : [];
    const ok = ids.length>0 && ids.every(id=>!!transaksiById(id));
    out.push(mkAkt('BDS05-I05', (l.tanggalDibuat||anchor).slice(0,10), ok, refLaporan(l), {hasEvidence:ok}));
  });

  // ===== BDS06 - Pelaporan Unit =====
  const laporanMeta = laporanAll.find(l=>l.periode===periode);
  out.push(Object.assign(mkAkt('BDS06-I01', anchor, !!laporanMeta, refPeriode(periode)), {completionDate: laporanMeta? (laporanMeta.tanggalDibuat||anchor).slice(0,10) : null}));
  out.push(Object.assign(mkAkt('BDS06-I02', anchor, !!laporanMeta, refPeriode(periode)), {completionDate: laporanMeta? (laporanMeta.tanggalDibuat||'').slice(0,10) : null}));
  laporanAll.forEach(l=>{
    const asOfL = anchorDateForPeriode(l.periode);
    const snap = l.snapshot||{};
    // Saldo Laporan Sesuai Ledger: deteksi koreksi ledger SETELAH laporan dikirim
    const saldoLedgerSekarang = totalSaldoKas(asOfL)+totalSaldoBank(asOfL);
    const saldoOk = Math.abs(Number(snap.saldoTotal||0)-saldoLedgerSekarang)<0.5;
    out.push(mkAkt('BDS06-I03', (l.tanggalDibuat||asOfL).slice(0,10), saldoOk, refLaporan(l)));
    // RAB vs Realisasi Terlaporkan
    const anggaranPeriodeL = anggaran.filter(a=>a.periode===l.periode);
    const rabOk = anggaranPeriodeL.length===0 || (Array.isArray(snap.anggaranRealisasi) && snap.anggaranRealisasi.length===anggaranPeriodeL.length);
    out.push(mkAkt('BDS06-I04', (l.tanggalDibuat||asOfL).slice(0,10), rabOk, refLaporan(l), {hasEvidence: Array.isArray(snap.anggaranRealisasi)&&snap.anggaranRealisasi.length>0}));
    // Angka Laporan Dapat Ditelusuri ke Ledger (nilai, bukan sekadar keberadaan tautan - beda dari BDS05-I05)
    const idsL = Array.isArray(snap.transaksiIds) ? snap.transaksiIds : [];
    const resolved = idsL.map(transaksiById).filter(Boolean);
    const sumPemasukan = resolved.filter(t=>t.jenis==='PENERIMAAN').reduce((s,t)=>s+Number(t.nominal||0),0);
    const sumPengeluaran = resolved.filter(t=>t.jenis==='PENGELUARAN').reduce((s,t)=>s+Number(t.nominal||0),0);
    const angkaOk = Math.abs(Number(snap.totalPemasukan||0)-sumPemasukan)<0.5 && Math.abs(Number(snap.totalPengeluaran||0)-sumPengeluaran)<0.5;
    out.push(mkAkt('BDS06-I05', (l.tanggalDibuat||asOfL).slice(0,10), angkaOk, refLaporan(l)));
  });

  __aktFeedCache = out;
  return out;
}
/* Traceability generik (section 18): Skor -> Indikator -> Aktivitas
   bermasalah -> data sumber. Berlaku untuk SEMUA 32 indikator tanpa
   logic khusus per indikator, karena setiap Aktivitas dari adapter
   sudah membawa _problem + _ref. */
function indicatorProblemRows(indicatorRow, periode){
  const def = indicatorByCode(indicatorRow.kode) || indicatorRow;
  const win = getMeasurementWindow(def, periode);
  if(!win) return [];
  const startISO=dateToISO(win.start), endISO=dateToISO(win.end);
  return financialAktivitasFeed().filter(a=>a.kodeKpi===def.kode && a._problem && a.tanggal>=startISO && a.tanggal<=endISO).map(a=>a._ref);
}

/* ============================================================
   6b. GENERIC FILTERABLE TABLE (Patch "Filter Wajib Setiap Tabel")
   SATU TABEL = SATU FILTER BAR. Search + select filters + periode + sort,
   real-time, persist di State lintas render, dan Export memakai hasil filter ini.
   ============================================================ */
State.tbl = {};
window.__lastFilteredRows = {};
function ensureTableState(key, defaults){
  if(!State.tbl[key]) State.tbl[key] = Object.assign({search:'', sort:null, dir:1}, defaults||{});
  return State.tbl[key];
}
function tblSet(key, field, value){ ensureTableState(key)[field]=value; renderContent(); }
function tblReset(key, defaults){ State.tbl[key] = Object.assign({search:'', sort:null, dir:1}, defaults||{}); renderContent(); }
function tblSort(key, col){ const st=ensureTableState(key); if(st.sort===col) st.dir*=-1; else { st.sort=col; st.dir=1; } renderContent(); }
function getPath(obj,path){ return path.split('.').reduce((o,k)=>(o==null?o:o[k]), obj); }
function tblApply(rows, key, cfg){
  const st = ensureTableState(key, cfg.defaults);
  let out = rows;
  if(st.search){ const q=st.search.toLowerCase(); out = out.filter(r=>(cfg.searchFields||[]).some(f=>String(getPath(r,f)==null?'':getPath(r,f)).toLowerCase().indexOf(q)>=0)); }
  /* matchMode:'contains' (Patch Master "Filter Komponen"): field bernilai
     array (mis. daftar komponen dalam satu transaksi multi-komponen) dicek
     dengan indexOf, bukan exact-equality - opt-in per kolom, default TETAP
     exact-match seperti sebelumnya supaya semua filter tabel lain yang sudah
     ada tidak berubah perilaku sama sekali. */
  (cfg.selects||[]).forEach(s=>{
    if(!st[s.field]) return;
    if(s.matchMode==='contains') out = out.filter(r=>{ const v=getPath(r,s.field); return Array.isArray(v) ? v.indexOf(st[s.field])>=0 : String(v).indexOf(st[s.field])>=0; });
    else out = out.filter(r=>String(getPath(r,s.field))===String(st[s.field]));
  });
  if(cfg.periodeField && st.periode){ out = out.filter(r=>periodeOfDate(getPath(r,cfg.periodeField))===st.periode); }
  if(cfg.periodeExact && st.periode){ out = out.filter(r=>getPath(r,cfg.periodeExact)===st.periode); }
  if(st.sort){ out = out.slice().sort((a,b)=>{ const av=getPath(a,st.sort), bv=getPath(b,st.sort); if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1; return (av>bv?1:(av<bv?-1:0))*st.dir; }); }
  window.__lastFilteredRows[key] = out;
  return out;
}
/* Global Table Engine (Engine H): getActiveFilters()/removeFilter() di atas
   init()=ensureTableState, setFilter()=tblSet, reset()=tblReset, search
   (built into tblSet 'search'), sort()=tblSort, getFilteredRows()=
   window.__lastFilteredRows, exportFiltered()=filteredOrAll(). Satu engine
   dipakai oleh SEMUA tabel utama - tidak ada filter terpisah per tabel. */
function tblActiveFilters(key, cfg){
  const st = ensureTableState(key, cfg.defaults);
  const chips = [];
  if(st.search) chips.push({field:'search', label:'Cari: "'+st.search+'"'});
  (cfg.selects||[]).forEach(s=>{ if(st[s.field]) chips.push({field:s.field, label:s.label+': '+st[s.field]}); });
  if((cfg.periodeField||cfg.periodeExact) && st.periode) chips.push({field:'periode', label:'Periode: '+st.periode});
  return chips;
}
function tblRemoveFilter(key, field){ tblSet(key, field, ''); }
function tblFilterBar(key, cfg, totalCount, filteredCount){
  const st = ensureTableState(key, cfg.defaults);
  const chips = tblActiveFilters(key, cfg);
  let html = '<div class="filterbar-visible">';
  html += '<div class="filterbar">';
  html += '<div class="field"><label>&#128269; '+esc(cfg.searchLabel||'Cari')+'</label><input type="text" value="'+esc(st.search)+'" oninput="tblSet(\''+key+'\',\'search\',this.value)"></div>';
  (cfg.selects||[]).forEach(s=>{ html += fieldSelectOnchange('tblsel_'+key+'_'+s.field, s.label, [''].concat(s.options), st[s.field]||'', "tblSet('"+key+"','"+s.field+"',this.value)"); });
  if(cfg.periodeField || cfg.periodeExact){ html += fieldSelectOnchange('tblper_'+key, 'Periode', [''].concat(cfg.periodeOptions||[]), st.periode||'', "tblSet('"+key+"','periode',this.value)"); }
  html += '</div>';
  html += '<div class="filter-status-row">';
  if(chips.length){
    html += '<span class="badge blue">'+chips.length+' FILTER AKTIF</span> ';
    html += chips.map(c=>'<span class="chip">'+esc(c.label)+' <a onclick="tblRemoveFilter(\''+key+'\',\''+c.field+'\')">&times;</a></span>').join(' ');
    html += ' <button class="btn sm" onclick="tblReset(\''+key+'\', null)">&times; Reset Semua</button>';
  }
  html += '<div class="small-muted" style="margin-top:4px">'+(chips.length? ('Menampilkan <b>'+filteredCount+'</b> dari '+totalCount+' data') : ('Menampilkan semua '+totalCount+' data'))+(filteredCount===0?' — Tidak ada data sesuai filter.':'')+'</div>';
  html += '</div></div>';
  return html;
}

/* ---- Beranda: SVG chart builders (tanpa library eksternal, tema mengikuti
   CSS variables aplikasi supaya konsisten dengan tabel/badge yang lain) ---- */
function svgLineChart(labels, seriesA, seriesB, opts){
  opts = opts||{};
  const w=680, h=200, padL=42, padR=10, padT=14, padB=24;
  const innerW=w-padL-padR, innerH=h-padT-padB;
  const maxV = Math.max(1, ...seriesA, ...seriesB);
  const x = i => padL + (labels.length<=1?0:i*(innerW/(labels.length-1)));
  const y = v => padT + innerH - (v/maxV*innerH);
  const path = arr => arr.map((v,i)=>(i===0?'M':'L')+round1(x(i))+' '+round1(y(v))).join(' ');
  const gridLines = [0,0.25,0.5,0.75,1].map(f=>{
    const yy = padT+innerH-(f*innerH);
    return '<line x1="'+padL+'" y1="'+yy+'" x2="'+(w-padR)+'" y2="'+yy+'" stroke="var(--border)" stroke-width="1"/>'+
      '<text x="2" y="'+(yy+3)+'" font-size="9" fill="var(--muted)">'+fmtRpShort(maxV*f)+'</text>';
  }).join('');
  const labelsSvg = labels.map((l,i)=> i%Math.ceil(labels.length/9||1)===0 ? '<text x="'+round1(x(i))+'" y="'+(h-6)+'" font-size="9" fill="var(--muted)" text-anchor="middle">'+esc(l)+'</text>' : '').join('');
  const dotsA = seriesA.map((v,i)=>'<circle cx="'+round1(x(i))+'" cy="'+round1(y(v))+'" r="2.5" fill="var(--green)"/>').join('');
  const dotsB = seriesB.map((v,i)=>'<circle cx="'+round1(x(i))+'" cy="'+round1(y(v))+'" r="2.5" fill="var(--red)"/>').join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:200px">'+gridLines+
    '<path d="'+path(seriesA)+'" fill="none" stroke="var(--green)" stroke-width="2"/>'+
    '<path d="'+path(seriesB)+'" fill="none" stroke="var(--red)" stroke-width="2"/>'+
    dotsA+dotsB+labelsSvg+'</svg>';
}
function fmtRpShort(n){ n=Number(n)||0; if(n>=1000000) return round1(n/1000000)+'jt'; if(n>=1000) return round1(n/1000)+'rb'; return String(n); }
function svgDonutChart(segments, totalLabel){
  const total = sum(segments.map(s=>s.value));
  const w=180, cx=90, cy=90, r=60, rInner=36;
  if(!total) return '<div class="empty">Belum ada data</div>';
  let angle = -90;
  const colors = ['var(--primary)','var(--green)','var(--amber)','#8b5cf6','var(--muted)','var(--red)'];
  const arcs = segments.map((s,i)=>{
    const frac = s.value/total;
    const a0 = angle, a1 = angle + frac*360;
    angle = a1;
    const large = (a1-a0)>180 ? 1 : 0;
    const p0 = [cx+r*Math.cos(a0*Math.PI/180), cy+r*Math.sin(a0*Math.PI/180)];
    const p1 = [cx+r*Math.cos(a1*Math.PI/180), cy+r*Math.sin(a1*Math.PI/180)];
    const p0i = [cx+rInner*Math.cos(a0*Math.PI/180), cy+rInner*Math.sin(a0*Math.PI/180)];
    const p1i = [cx+rInner*Math.cos(a1*Math.PI/180), cy+rInner*Math.sin(a1*Math.PI/180)];
    const d = 'M '+p0i[0]+' '+p0i[1]+' L '+p0[0]+' '+p0[1]+' A '+r+' '+r+' 0 '+large+' 1 '+p1[0]+' '+p1[1]+' L '+p1i[0]+' '+p1i[1]+' A '+rInner+' '+rInner+' 0 '+large+' 0 '+p0i[0]+' '+p0i[1]+' Z';
    return '<path d="'+d+'" fill="'+colors[i%colors.length]+'"><title>'+esc(s.label)+': '+fmtRp(s.value)+'</title></path>';
  }).join('');
  const legend = segments.map((s,i)=>'<div style="display:flex;align-items:center;gap:6px;font-size:11.5px;margin-bottom:4px"><span style="width:10px;height:10px;border-radius:2px;background:'+colors[i%colors.length]+';display:inline-block"></span>'+esc(s.label)+' <span class="small-muted">'+fmtRp(s.value)+' ('+round1(s.value/total*100)+'%)</span></div>').join('');
  return '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="0 0 180 180" style="width:160px;height:160px;flex-shrink:0">'+arcs+
    '<text x="90" y="86" text-anchor="middle" font-size="11" fill="var(--muted)">'+esc(totalLabel||'Total')+'</text>'+
    '<text x="90" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">'+fmtRpShort(total)+'</text>'+
    '</svg><div>'+legend+'</div></div>';
}
function svgGauge(score){
  const s = score==null ? 0 : Math.max(0,Math.min(100,score));
  const r=54, cx=64, cy=64, circumference=2*Math.PI*r;
  const offset = circumference*(1-s/100);
  const color = score==null?'var(--muted)':(score>=90?'var(--green)':(score>=70?'var(--primary)':'var(--red)'));
  return '<svg viewBox="0 0 128 128" style="width:128px;height:128px">'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="var(--border)" stroke-width="12"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 '+cx+' '+cy+')"/>'+
    '<text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="26" font-weight="700" fill="var(--text)">'+(score==null?'N/A':score)+'</text>'+
    '</svg>';
}

   sedang aktif diedit) - supaya kewajiban yang sama tidak dialokasikan
   dobel dalam satu transaksi batch (multi-siswa/multi-baris). */
/* "Sudah diambil" oleh ENTRY LAIN (baris/komponen manapun) di draft yang
   sama, KECUALI entry (rowIdx,komponenNama) yang sedang dihitung ulang -
   supaya kewajiban yang sama tidak dialokasikan dobel dalam satu transaksi
   batch (multi-siswa/multi-komponen sekaligus). */
function pwAlreadyTakenFor(obKey, excludeRowIdx, excludeKomponenNama){
  const w = ensurePenerimaanWizard();
  let s = 0;
  w.rows.forEach((r,i)=>{
    Object.keys(r.komponen||{}).forEach(nama=>{
      if(i===excludeRowIdx && nama===excludeKomponenNama) return;
      const entry = r.komponen[nama];
      if(!entry.checked) return;
      (entry.plan||[]).forEach(p=>{ if(p.ob.key===obKey) s += p.nominal; });
    });
  });
  return s;
}
function pwAlreadyPlannedForSiswa(siswaId, excludeRowIdx){
  const w = ensurePenerimaanWizard();
  let s = 0;
  w.rows.forEach((r,i)=>{ if(i===excludeRowIdx) return; if(r.siswaId===siswaId) s += pwRowDialokasikan(r); });
  return s;
}
function pwGreedyFillSorted(obligations, amount, excludeRowIdx, excludeKomponenNama){
  const sorted = sortObligationsChronological(obligations);
  let remaining = amount;
  const plan = [];
  sorted.forEach(ob=>{
    if(remaining<=0.5) return;
    const sisaTersedia = Math.max(0, sisaObligation(ob)-pwAlreadyTakenFor(ob.key, excludeRowIdx, excludeKomponenNama));
    const take = Math.min(remaining, sisaTersedia);
    if(take>0){ plan.push({ob, nominal:take}); remaining -= take; }
  });
  return {plan, sisa:Math.max(0,remaining)};
}
/* Rentang periode INKLUSIF [mulai, sampai] persis (bukan "dari tunggakan
   tertua sampai sampai") - section 7: Agustus 2026->Juni 2027 harus tepat
   11 periode, tidak bergeser ke Juli 2026->Mei 2027. */
function periodeRangeInclusive(mulai, sampai){
  const ymA = periodeToYearMonth(mulai), ymB = periodeToYearMonth(sampai);
  if(!ymA || !ymB) return [];
  const out = []; let y=ymA.y, m=ymA.m; const endVal = ymB.y*12+ymB.m; let guard=0;
  while((y*12+m)<=endVal && guard<300){ out.push(periodeLabelFromYM(y,m)); m++; if(m>11){ m=0; y++; } guard++; }
  return out;
}
/* Default "Mulai Periode" = periode pertama yang masih bertunggakan untuk
   komponen ini (section 7: "sistem menentukan default periode pertama
   yang relevan") - user tetap bebas mengubahnya. */
function pwFirstRelevantPeriode(siswa, komponenNama){
  const unpaid = kewajibanForSiswa(siswa.id).filter(o=>o.komponenNama===komponenNama && sisaObligation(o)>0.5);
  if(!unpaid.length) return Store.loadSettings().periodeAktif;
  return sortObligationsChronological(unpaid)[0].periode;
}
/* Formula alokasi per baris - SAMA PERSIS dengan sumber kewajiban Student
   Profile (kewajibanForSiswa/kewajibanSatuBaris/sisaObligation), TIDAK ADA
   perhitungan kewajiban baru. */
/* Formula alokasi SATU komponen (dari checklist) - SAMA PERSIS dengan sumber
   kewajiban Student Profile (kewajibanForSiswa/kewajibanSatuBaris/
   sisaObligation), TIDAK ADA perhitungan kewajiban baru. rowIdx+komponenNama
   dipakai untuk exclude diri sendiri dari pwAlreadyTakenFor (lihat di atas). */
function pwComputeKomponenPlan(siswa, komponenNama, entry, rowIdx){
  const komp = komponenNama ? komponenByNama(komponenNama) : null;
  if(!komp) return {plan:[], totalNominal:0, dialokasikan:0, sisaKredit:0, incomplete:true, autoNominal:0};
  if(komp.frekuensi==='Bulanan'){
    if(entry.caraBayar==='lunas'){
      const periodeAktif = Store.loadSettings().periodeAktif;
      const obsAll = kewajibanForSiswaSampai(siswa.id, komponenNama, periodeAktif).filter(o=>Math.max(0,sisaObligation(o)-pwAlreadyTakenFor(o.key, rowIdx, komponenNama))>0.5);
      const totalKebutuhan = obsAll.reduce((s,o)=>s+Math.max(0,sisaObligation(o)-pwAlreadyTakenFor(o.key, rowIdx, komponenNama)),0);
      const fill = pwGreedyFillSorted(obsAll, totalKebutuhan, rowIdx, komponenNama);
      return {plan:fill.plan, totalNominal:totalKebutuhan, dialokasikan:totalKebutuhan-fill.sisa, sisaKredit:0, incomplete:false, autoNominal:totalKebutuhan};
    }
    if(entry.caraBayar==='lunasSampai'){
      if(!entry.mulai || !entry.sampai) return {plan:[], totalNominal:0, dialokasikan:0, sisaKredit:0, incomplete:true, autoNominal:0};
      const periods = periodeRangeInclusive(entry.mulai, entry.sampai);
      const obsAll = periods.map(p=>kewajibanSatuBaris(siswa, komp, p)).filter(o=>Math.max(0,sisaObligation(o)-pwAlreadyTakenFor(o.key, rowIdx, komponenNama))>0.5);
      const autoTotal = obsAll.reduce((s,o)=>s+Math.max(0,sisaObligation(o)-pwAlreadyTakenFor(o.key, rowIdx, komponenNama)),0);
      const nominal = (entry.nominal===null||entry.nominal===undefined) ? autoTotal : Number(entry.nominal)||0;
      const fill = pwGreedyFillSorted(obsAll, nominal, rowIdx, komponenNama);
      return {plan:fill.plan, totalNominal:nominal, dialokasikan:nominal-fill.sisa, sisaKredit:fill.sisa, incomplete:false, autoNominal:autoTotal};
    }
    // cicilan: alokasikan ke tunggakan/periode yang relevan, tertua dulu
    const obsAll = kewajibanForSiswa(siswa.id).filter(o=>o.komponenNama===komponenNama).filter(o=>Math.max(0,sisaObligation(o)-pwAlreadyTakenFor(o.key, rowIdx, komponenNama))>0.5);
    const nominal = Number(entry.nominal)||0;
    const fill = pwGreedyFillSorted(obsAll, nominal, rowIdx, komponenNama);
    return {plan:fill.plan, totalNominal:nominal, dialokasikan:fill.plan.reduce((s,p)=>s+p.nominal,0), sisaKredit:fill.sisa, incomplete: !(nominal>0), autoNominal:0};
  }
  // komponen non-bulanan (SekaliBayar/Tahunan) - satu baris kewajiban
  const ob = kewajibanForSiswa(siswa.id).find(o=>o.komponenNama===komponenNama);
  if(!ob) return {plan:[], totalNominal:0, dialokasikan:0, sisaKredit:0, incomplete:false, noObligation:true, autoNominal:0};
  const sisaTersedia = Math.max(0, sisaObligation(ob)-pwAlreadyTakenFor(ob.key, rowIdx, komponenNama));
  if(entry.caraBayar==='lunas') return {plan: sisaTersedia>0.5?[{ob,nominal:sisaTersedia}]:[], totalNominal:sisaTersedia, dialokasikan:sisaTersedia, sisaKredit:0, incomplete:false, autoNominal:sisaTersedia};
  const nominal = Number(entry.nominal)||0;
  const jumlah = Math.max(0, Math.min(nominal, sisaTersedia));
  return {plan: jumlah>0.5?[{ob,nominal:jumlah}]:[], totalNominal:nominal, dialokasikan:jumlah, sisaKredit:Math.max(0,nominal-jumlah), incomplete: !(nominal>0), autoNominal:0};
}
/* Rekompute SEMUA komponen yang dicentang pada baris aktif. Komponen berbeda
   selalu punya komponenId berbeda -> obligation key (siswaId|komponenId|
   periode) TIDAK PERNAH bentrok antar komponen milik siswa yang sama, jadi
   urutan rekompute antar komponen tidak berpengaruh (tidak butuh fixpoint). */
function pwRecomputeActiveRow(){
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  if(!row || !row.siswaId) return;
  const siswa = MasterAPI.students().find(s=>s.id===row.siswaId);
  if(!siswa) return;
  Object.keys(row.komponen||{}).forEach(nama=>{
    const entry = row.komponen[nama];
    if(!entry.checked) return;
    const res = pwComputeKomponenPlan(siswa, nama, entry, w.activeIdx);
    entry.plan = res.plan; entry.totalNominal = res.totalNominal; entry.dialokasikan = res.dialokasikan;
    entry.sisaKredit = res.sisaKredit; entry.incomplete = res.incomplete; entry.noObligation = !!res.noObligation; entry.autoNominal = res.autoNominal||0;
    if(entry.caraBayar==='lunasSampai' && (entry.nominal===null||entry.nominal===undefined)) entry.nominal = res.autoNominal;
  });
}

/* ---- Searchable student picker (section 4): TIDAK PERNAH me-render
   ratusan nama sekaligus - hanya hasil filter (maks 8), case-insensitive,
   cocok ke nama/NIS/NISN/kelas. ---- */
function pwSiswaResultsHtml(query){
  const q = String(query||'').trim().toLowerCase();
  if(!q) return '';
  const results = MasterAPI.students().filter(s=>s.status!=='Nonaktif').filter(s=>
    (s.nama||'').toLowerCase().indexOf(q)>=0 || (s.nis||'').toLowerCase().indexOf(q)>=0 ||
    (s.nisn||'').toLowerCase().indexOf(q)>=0 || (s.kelas||'').toLowerCase().indexOf(q)>=0
  ).slice(0,8);
  if(!results.length) return '<div class="empty" style="padding:8px">Tidak ada siswa cocok.</div>';
  return '<div class="tablewrap" style="max-height:220px;border:1px solid var(--border);border-radius:6px">'+
    results.map(s=>'<div style="padding:7px 10px;cursor:pointer;border-bottom:1px solid var(--border)" onclick="pwPickSiswaForActiveRow(\''+s.id+'\')"><b>'+esc(s.nama)+'</b><div class="small-muted">'+esc(s.kelas||'-')+' &bull; NIS '+esc(s.nis||'-')+'</div></div>').join('')+
    '</div>';
}
function pwSearchSiswa(query){
  const w = ensurePenerimaanWizard();
  w.searchQuery = query;
  const el = document.getElementById('pw_siswa_results');
  if(el) el.innerHTML = pwSiswaResultsHtml(query);
}

}
function pwChangeActiveRowSiswa(){
  pwCaptureDataFields();

}
/* PATCH MASTER BUG11: checklist komponen (bukan "+ Tambah Komponen") - user
   mencentang komponen yang dibayar, baru field cara-bayar/periode/nominal
   komponen itu muncul. Setiap komponen di identifikasi lewat nama (unik per
   unit siswa), bukan index baris. */
function pwToggleKomponen(nama, checked){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  const entry = pwGetKomponenEntry(row, nama);
  entry.checked = !!checked;
  if(!entry.checked){ entry.plan=[]; entry.totalNominal=0; entry.dialokasikan=0; entry.sisaKredit=0; entry.incomplete=true; }
  else pwRecomputeActiveRow();
  pwRerenderModal();
}
function pwSetKomponenCaraBayar(nama, cara){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  const entry = pwGetKomponenEntry(row, nama);
  entry.caraBayar = cara; entry.nominal = null;
  if(cara==='lunasSampai'){
    const siswa = MasterAPI.students().find(s=>s.id===row.siswaId);
    const mulaiDefault = siswa ? pwFirstRelevantPeriode(siswa, nama) : '';
    entry.mulai = mulaiDefault; entry.sampai = mulaiDefault;
  } else { entry.mulai=''; entry.sampai=''; }
  pwRecomputeActiveRow();
  pwRerenderModal();
}
function pwSetKomponenMulai(nama){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  const entry = pwGetKomponenEntry(row, nama);
  entry.mulai = val('pw_mulai_'+pwSlug(nama));
  const ymM = periodeToYearMonth(entry.mulai), ymS = periodeToYearMonth(entry.sampai);
  if(ymM && ymS && (ymS.y*12+ymS.m) < (ymM.y*12+ymM.m)) entry.sampai = entry.mulai;
  entry.nominal = null;
  pwRecomputeActiveRow();
  pwRerenderModal();
}
function pwSetKomponenSampai(nama){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  const entry = pwGetKomponenEntry(row, nama);
  entry.sampai = val('pw_sampai_'+pwSlug(nama));
  entry.nominal = null;
  pwRecomputeActiveRow();
  pwRerenderModal();
}
function pwOnKomponenNominalInput(nama, v){
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];

}
/* Semua bagian UI membaca SATU state yang sama (section 9) - update ini
   melakukan replace innerHTML bertarget (bukan render ulang seluruh
   halaman) supaya fokus pada input Nominal tidak hilang saat mengetik. */
function pwRefreshLiveRegions(){
  const map = {pw_active_preview:pwActiveRowPreviewHtml, pw_daftar_siswa_body:pwDaftarSiswaRowsHtml, pw_rincian_alokasi_body:pwRincianAlokasiRowsHtml, pw_sync_summary:pwSyncSummaryHtml};
  Object.keys(map).forEach(id=>{ const el=document.getElementById(id); if(el) el.innerHTML = map[id](); });
  const btn = document.getElementById('pw_submit_btn');
  if(btn) btn.disabled = !pwCanSubmit().ok;
}
function pwTambahSiswaBaru(){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  w.rows.push(pwBlankRow());
  w.activeIdx = w.rows.length-1;
  w.searchQuery = '';
  pwRerenderModal();
}
function pwSetActiveRow(idx){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  w.activeIdx = idx;
  w.searchQuery = '';
  pwRerenderModal();
}
function pwHapusRow(idx){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  w.rows.splice(idx,1);
  if(!w.rows.length){ w.rows.push(pwBlankRow()); w.activeIdx = 0; }
  else if(w.activeIdx>=w.rows.length) w.activeIdx = w.rows.length-1;
  pwRerenderModal();
}

/* Tunggakan Saat Ini (section 6/11) - BUKAN Expected Penerimaan/Total
   Kewajiban masa depan, murni sisa kewajiban SAMPAI PERIODE AKTIF (sumber
   sama dengan Student Profile: totalSisaSiswa), dikurangi bagian yang
   sudah dipakai baris LAIN di draft yang sama supaya tidak double count. */
/* Tunggakan Saat Ini PER KOMPONEN (section 6/11/12 - posisi harus dipecah
   per komponen, bukan digabung jadi satu angka) - BUKAN Expected Penerimaan/
   Total Kewajiban masa depan, murni sisa kewajiban komponen ini SAMPAI
   PERIODE AKTIF (sumber sama dengan Student Profile: kewajibanForSiswa/
   sisaObligation), dikurangi bagian yang sudah dipakai entry LAIN di draft
   yang sama (row/komponen manapun) supaya tidak double count. */
function pwTunggakanSaatIniKomponen(siswaId, komponenNama, excludeRowIdx){
  const obs = kewajibanForSiswa(siswaId).filter(o=>o.komponenNama===komponenNama);
  return Math.max(0, sum(obs.map(o=>Math.max(0, sisaObligation(o)-pwAlreadyTakenFor(o.key, excludeRowIdx, komponenNama)))));
}
function pwActiveRowPreviewHtml(){
  const w = ensurePenerimaanWizard();
  const row = w.rows[w.activeIdx];
  if(!row || !row.siswaId) return '';
  const checked = pwRowCheckedEntries(row);
  if(!checked.length) return '<p class="small-muted">Centang minimal satu komponen untuk melihat rincian.</p>';
  let html = '';
  checked.forEach(({nama, entry})=>{
    html += '<div style="margin-top:10px;border-top:1px solid #e5e7eb;padding-top:6px"><b>'+esc(nama)+'</b>';
    if(entry.noObligation){
      html += '<p class="small-muted">Tidak ada kewajiban aktif untuk komponen ini.</p>';
    } else if(entry.incomplete){
      html += '<p class="small-muted">Lengkapi cara pembayaran/periode/nominal untuk melihat rincian.</p>';
    } else {
      const tunggakanSaatIni = pwTunggakanSaatIniKomponen(row.siswaId, nama, w.activeIdx);
      const sisaTunggakan = Math.max(0, tunggakanSaatIni - entry.dialokasikan);
      html += '<div class="kv" style="margin-top:4px">'+
        '<div>Tunggakan Saat Ini</div><div>'+fmtRp(tunggakanSaatIni)+'</div>'+
        '<div>Pembayaran Ini</div><div style="color:var(--green)"><b>'+fmtRp(entry.dialokasikan)+'</b></div>'+
        '<div>Sisa Tunggakan</div><div style="color:var(--red)"><b>'+fmtRp(sisaTunggakan)+'</b></div></div>';
      if(entry.plan.length){
        html += '<div class="tablewrap" style="max-height:none;margin-top:4px"><table><thead><tr><th>Periode</th><th>Nominal</th></tr></thead><tbody>'+
          entry.plan.map(p=>'<tr><td>'+esc(p.ob.periode)+'</td><td style="text-align:right">'+fmtRp(p.nominal)+'</td></tr>').join('')+
          '</tbody></table></div>';
      } else html += '<p class="small-muted">Belum ada rincian (nominal 0 atau sudah lunas).</p>';
      if(entry.sisaKredit>0.5) html += '<p class="small-muted">&#9888; Kelebihan '+fmtRp(entry.sisaKredit)+' akan dicatat sebagai <b>OVERPAYMENT/KREDIT siswa</b> untuk komponen ini.</p>';
    }
    html += '</div>';
  });
  return html;
}
function pwRightPanelHtml(){

  const row = w.rows[w.activeIdx];
  let html = '<div class="card"><h3>Cari &amp; Pilih Siswa</h3>';

    html += '<div class="field"><label>&#128269; Ketik nama / NIS / NISN siswa...</label>'+
      '<input type="text" id="pw_siswa_search" placeholder="Ketik nama, NIS, atau NISN..." autocomplete="off" oninput="pwSearchSiswa(this.value)"></div>'+
      '<div id="pw_siswa_results">'+pwSiswaResultsHtml(w.searchQuery)+'</div></div>';
    return html;
  }
  html += '<div class="kv"><div>Nama</div><div><b>'+esc(row.siswaNama)+'</b></div><div>Kelas</div><div>'+esc(row.kelas||'-')+'</div><div>NIS</div><div>'+esc(row.nis||'-')+'</div></div>'+
    '<div style="margin-top:6px"><a class="link small-muted" onclick="pwChangeActiveRowSiswa()">&larr; Ganti Siswa</a></div>';
  const siswaFull = MasterAPI.students().find(s=>s.id===row.siswaId);
  const komponenOpts = komponenSelectableForUnit((siswaFull||{}).unit||'');
  /* PATCH MASTER BUG11: CHECKLIST KOMPONEN - tidak ada "+ Tambah Komponen".
     Setelah siswa dipilih, seluruh komponen yang berlaku untuk unitnya
     langsung ditampilkan sebagai checkbox; user tinggal mencentang yang
     dibayar (bisa lebih dari satu - BUG10: satu transaksi, banyak komponen). */
  html += '<div class="section-title" style="margin-top:10px">Komponen Pembayaran</div>';
  if(!komponenOpts.length) html += '<p class="small-muted">Tidak ada komponen biaya untuk unit '+esc((siswaFull||{}).unit||'-')+'.</p>';
  komponenOpts.forEach(k=>{
    const entry = pwGetKomponenEntry(row, k.nama);
    const cid = pwSlug(k.nama);
    html += '<div style="margin-top:8px;padding-bottom:6px'+(entry.checked?';border-bottom:1px solid #e5e7eb':'')+'">'+
      '<label style="display:flex;gap:6px;align-items:center;font-weight:600"><input type="checkbox" id="pw_chk_'+cid+'" '+(entry.checked?'checked':'')+' onchange="pwToggleKomponen(\''+k.nama+'\', this.checked)"> '+esc(k.nama)+'</label>';
    if(entry.checked){
      const caraOpts = k.frekuensi==='Bulanan' ? ['cicilan','lunasSampai','lunas'] : ['cicilan','lunas'];
      html += '<div style="margin-left:24px">';
      html += fieldSelect('pw_cara_'+cid,'Cara Pembayaran', caraOpts.map(c=>({value:c,label:caraBayarLabel(c)})), entry.caraBayar).replace('id="pw_cara_'+cid+'"','id="pw_cara_'+cid+'" onchange="pwSetKomponenCaraBayar(\''+k.nama+'\', this.value)"');
      if(entry.caraBayar==='lunasSampai'){
        const horizonLabel = periodeAdvance(Store.loadSettings().periodeAktif, 36);
        const periodeOpts = enumeratePeriodesBulananExtended(siswaFull, horizonLabel);
        html += '<div class="grid cols-2">'+
          fieldSelect('pw_mulai_'+cid,'Mulai Periode', periodeOpts.map(p=>({value:p,label:p})), entry.mulai).replace('id="pw_mulai_'+cid+'"','id="pw_mulai_'+cid+'" onchange="pwSetKomponenMulai(\''+k.nama+'\')"')+
          fieldSelect('pw_sampai_'+cid,'Sampai Periode', periodeOpts.map(p=>({value:p,label:p})), entry.sampai).replace('id="pw_sampai_'+cid+'"','id="pw_sampai_'+cid+'" onchange="pwSetKomponenSampai(\''+k.nama+'\')"')+
          '</div>';
      }
      if(entry.caraBayar==='cicilan' || entry.caraBayar==='lunasSampai'){
        html += fieldText('pw_nominal_'+cid,'Nominal Pembayaran', entry.nominal==null?'':entry.nominal, 'number').replace('<input ','<input oninput="pwOnKomponenNominalInput(\''+k.nama+'\', this.value)" ');
      }
      html += '</div>';
    }
    html += '</div>';
  });
  html += '<div id="pw_active_preview">'+pwActiveRowPreviewHtml()+'</div>';
  html += '</div>';
  return html;
}

/* ---- Bagian kiri: Daftar Siswa + Rincian Alokasi + indikator sinkron -
   semuanya fungsi murni dari draftPayment (rows), dipanggil baik saat
   render penuh maupun saat targeted-refresh (pwRefreshLiveRegions). ---- */
function pwDaftarSiswaRowsHtml(){
  const w = ensurePenerimaanWizard();
  const filled = w.rows.map((r,i)=>({r,i})).filter(x=>x.r.siswaId);
  if(!filled.length) return '<tr><td colspan="5" class="empty">Belum ada siswa - cari &amp; pilih siswa di panel kanan.</td></tr>';
  return filled.map(({r,i})=>{
    const checked = pwRowCheckedEntries(r);
    const totalNominal = pwRowTotalNominal(r);
    const sisaKredit = pwRowSisaKredit(r);
    const incomplete = pwRowIncomplete(r);
    const komponenLabel = checked.length ? checked.map(x=>esc(x.nama)+' ('+esc(caraBayarLabel(x.entry.caraBayar))+(x.entry.sampai?(' '+esc(x.entry.mulai)+' s/d '+esc(x.entry.sampai)):'')+')').join(' + ') : '-';
    const statusChip = incomplete ? '<span class="badge amber">Belum lengkap</span>' : (sisaKredit>0.5 ? '<span class="badge blue">+Kredit '+fmtRp(sisaKredit)+'</span>' : '<span class="badge green">Siap</span>');
    return '<tr'+(i===w.activeIdx?' style="background:var(--blue-bg)"':'')+'><td>'+esc(r.siswaNama)+' <span class="small-muted">('+esc(r.kelas||'-')+')</span></td><td>'+komponenLabel+'</td><td>'+fmtRp(totalNominal)+'</td><td>'+statusChip+'</td>'+
      '<td><a class="link" onclick="pwSetActiveRow('+i+')">&#9998;</a> <a class="link" onclick="pwHapusRow('+i+')">&#128465;</a></td></tr>';
  }).join('');
}
function pwRincianAlokasiRowsHtml(){
  const w = ensurePenerimaanWizard();
  const lines = [];
  w.rows.forEach(r=>{
    if(!r.siswaId) return;
    pwRowCheckedEntries(r).forEach(({nama, entry})=>{ if(entry.plan && entry.plan.length) lines.push({r, nama, entry}); });
  });
  if(!lines.length) return '<tr><td colspan="5" class="empty">Belum ada alokasi.</td></tr>';
  return lines.map(({r,nama,entry})=>{
    const rincian = entry.plan.map(p=>esc(p.ob.periode)+' '+fmtRp(p.nominal)).join('<br>');
    return '<tr><td>'+esc(r.siswaNama)+'</td><td>'+esc(nama)+'</td><td>'+esc(caraBayarLabel(entry.caraBayar))+'</td><td>'+rincian+'</td><td>'+fmtRp(entry.dialokasikan)+'</td></tr>';
  }).join('');
}
/* Indikator sinkron (section 10): SELISIH dihitung dari baris yang sudah
   punya siswa - baris "belum lengkap" (mis. Lunas Sampai Periode tanpa
   Sampai Periode dipilih) sengaja membuat selisih>0 supaya bendahara
   diminta melengkapi dulu, bukan celah matematis. Kelebihan bayar
   (overpayment/kredit) DIHITUNG sebagai bagian dari Total Alokasi (section
   8: itu tujuan yang sah), jadi tidak memblokir tombol - hanya diberi
   catatan info terpisah di panel kanan. */
/* PATCH MASTER BUG02/03/06: TOTAL ALOKASI = hanya alokasi yang benar-benar
   cocok dengan kewajiban (yang muncul di Rincian Alokasi) - TIDAK dibaurkan
   dengan kelebihan bayar/kredit (itu field TERPISAH). OVERPAYMENT/KREDIT
   hanya nyata kalau Total Pembayaran > Total Alokasi (bukan sekadar ada
   sisaKredit>0 di satu baris saja). SELISIH murni untuk VALIDASI data
   lengkap/tidaknya (baris "belum lengkap" sengaja membuat selisih>0). */
function pwOverallSummary(){
  const w = ensurePenerimaanWizard();
  const filled = w.rows.filter(r=>r.siswaId);
  const totalPembayaran = sum(filled.map(pwRowTotalNominal));
  const totalAlokasi = sum(filled.map(pwRowDialokasikan));
  const totalKredit = sum(filled.map(pwRowSisaKredit));
  const selisih = round1(totalPembayaran - (totalAlokasi + totalKredit));
  const anyIncomplete = filled.some(pwRowIncomplete);
  const hasAtLeastOne = filled.some(r=>pwRowCheckedEntries(r).length>0);
  const sync = hasAtLeastOne && !anyIncomplete && Math.abs(selisih)<0.5;
  return {totalPembayaran, totalAlokasi, totalKredit, selisih, sync, anyIncomplete, hasAtLeastOne};
}
function pwSyncSummaryHtml(){
  const o = pwOverallSummary();
  let html = '<div class="kv">'+
    '<div>TOTAL PEMBAYARAN</div><div><b>'+fmtRp(o.totalPembayaran)+'</b></div>'+
    '<div>TOTAL ALOKASI</div><div><b>'+fmtRp(o.totalAlokasi)+'</b></div>'+
    (o.totalKredit>0.5 ? ('<div>KELEBIHAN BAYAR / KREDIT</div><div style="color:var(--blue)"><b>'+fmtRp(o.totalKredit)+'</b></div>') : '')+
    '<div>SELISIH</div><div><b>'+fmtRp(Math.abs(o.selisih))+'</b></div>'+
    '</div>';
  if(o.sync) html += '<p style="color:var(--green);font-weight:600;margin-top:6px">&#10003; DATA SINKRON - SIAP DICATAT</p>';
  else if(!o.hasAtLeastOne) html += '<p class="small-muted" style="margin-top:6px">Cari &amp; pilih siswa, lalu centang minimal satu komponen untuk mulai mencatat.</p>';
  else html += '<p style="color:var(--amber);font-weight:600;margin-top:6px">&#9888; DATA BELUM SINKRON'+(o.anyIncomplete?' - lengkapi cara pembayaran semua komponen yang dicentang':'')+'</p>';
  return html;
}
function pwCanSubmit(){
  const o = pwOverallSummary();
  return o.sync ? {ok:true} : {ok:false, reason: o.hasAtLeastOne ? 'Data belum sinkron - lengkapi cara pembayaran semua siswa' : 'Cari dan pilih minimal 1 siswa terlebih dahulu'};
}

/* Nomor resi otomatis (section 17) - dibuat sekali per transaksi BARU
   (bukan saat Edit, resi lama tetap dipertahankan), pakai counter yang
   sudah ada di Settings (docSeqCounters.RESI, bukan struktur baru). */
function generateResiNumber(){
  const s = Store.loadSettings();
  s.docSeqCounters = s.docSeqCounters || {RESI:0, TAGIHAN:0, REKAP:0};
  s.docSeqCounters.RESI = (Number(s.docSeqCounters.RESI)||0) + 1;
  Store.saveSettings(s);
  const d = new Date();
  return 'KWT-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+'-'+String(s.docSeqCounters.RESI).padStart(4,'0');
}
/* Deteksi kemungkinan duplikasi: tanggal+akun+metode+nominal sama persis
   dengan transaksi PENERIMAAN nyata lain. excludeTrxId dipakai saat Edit
   supaya transaksi tidak dianggap duplikat dari dirinya sendiri. */
function pwFindLikelyDuplicate(tanggal, akunId, metode, totalNominal, excludeTrxId){
  return penerimaanListReal().find(t=>t.id!==excludeTrxId && t.tanggal===tanggal && t.akunId===akunId && (t.metode||'Tunai')===metode && Math.abs(Number(t.nominal||0)-totalNominal)<1);
}
function pwClearDupWarning(){ const w=ensurePenerimaanWizard(); w.dupWarning=null; w.confirmDuplicate=false; pwRerenderModal(); }
function pwConfirmDuplicateAndSubmit(){ const w=ensurePenerimaanWizard(); w.confirmDuplicate=true; pwSubmit(); }

/* Panel sukses (section 13) - muncul setelah COMMIT POINT (pwSubmit)
   berhasil, dengan tiga aksi lanjutan langsung ke Detail/Resi. */
function pwShowSuccessPanel(trxId, totalNominal, rowCount){
  let body = '<div style="text-align:center;padding:6px 0"><div style="font-size:32px;color:var(--green)">&#10003;</div><h3 style="margin:6px 0">'+(globalThis.__centralAwaitConfirm?'Penerimaan dikirim ke server - menunggu konfirmasi':'Penerimaan berhasil dicatat')+'</h3><p class="small-muted">'+fmtRp(totalNominal)+' untuk '+rowCount+' siswa</p></div>';
  body += '<div class="modal-actions" style="justify-content:center;flex-wrap:wrap">'+
    '<button class="btn" onclick="closeModal();openDetailPenerimaan(\''+trxId+'\')">&#128065; Detail</button>'+
    '<button class="btn primary" onclick="closeModal();openResiModal(\''+trxId+'\')">&#129534; Lihat Resi / Download</button>'+
    '</div>'+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Tutup</button></div>';
  openModal(body);
}
/* pwSubmit = COMMIT POINT (section 12): Draft -> Validasi -> Transaksi
   Aktual -> Allocation -> Ledger -> posisi siswa/dashboard/KPI (otomatis
   lewat Unified KPI Engine yang sudah ada) -> Resi. Sebelum ini TIDAK ADA
   apapun tersimpan. */
function pwSubmit(){
  pwCaptureDataFields();
  const w = ensurePenerimaanWizard();
  const can = pwCanSubmit();
  if(!can.ok){ toast(can.reason); return; }
  const filled = w.rows.filter(r=>r.siswaId);
  const tanggal = val('pw_tanggal'), akunId = val('pw_akun'), unit = val('pw_unit'), catatan = val('pw_catatan');
  const metode = (typeof document!=='undefined' && document.querySelector && document.querySelector('input[name="pw_metode"]:checked')) ? document.querySelector('input[name="pw_metode"]:checked').value : (w.data.metode||'Tunai');
  const ftNumber = metode==='Transfer Bank' ? val('pw_resi') : '';
  if(!tanggal || !akunId){ toast('Lengkapi Data Pembayaran (tanggal dan akun kas/bank)'); return; }
  if(!unit){ toast('Unit (TK/MI) wajib dipilih'); return; }
  if(metode==='Transfer Bank' && !ftNumber){ toast('No. Resi / Referensi Transfer wajib diisi untuk metode Transfer Bank'); return; }
  const totalNominal = sum(filled.map(pwRowTotalNominal));
  if(!(totalNominal>0)){ toast('Total pembayaran harus lebih dari 0'); return; }

  const dup = pwFindLikelyDuplicate(tanggal, akunId, metode, totalNominal, w.editTrxId);
  if(dup && !w.confirmDuplicate){
    w.dupWarning = 'Transaksi serupa sudah ada: '+fmtDate(dup.tanggal)+' - '+fmtRp(dup.nominal)+' di akun '+esc(akunNama(dup.akunId))+'. Klik "Tetap Simpan" bila ini memang transaksi berbeda.';
    toast('Kemungkinan duplikat terdeteksi - lihat peringatan pada form');
    pwRerenderModal();
    return;
  }

  /* BUG05: caraBayar dibawa serta ke tiap alokasi supaya Edit/Detail/Resi
     membaca MODE YANG SAMA yang dipilih di sini (SATU sumber), tidak
     menebak ulang / berubah sendiri jadi mode lain. */
  const combinedPlan = [];
  filled.forEach(r=>pwRowCheckedEntries(r).forEach(({entry})=>{
    entry.plan.forEach(p=>combinedPlan.push({ob:p.ob, nominal:p.nominal, caraBayar:entry.caraBayar}));
  }));
  if(w.editTrxId && centralIsServerTrx(w.editTrxId)){
    const sid0 = centralResolveTrxId(w.editTrxId);
    try{
      centralPatchTransaksi(sid0, {tanggal:tanggal, metode:metode, akunId:akunId, unit:unit, nominal:totalNominal, siswaId:'', ftNumber:ftNumber||'', catatan:catatan||''});
      alokasiForTransaksi(sid0).forEach(a0=>centralArchiveAlokasi(a0.id, 'diganti saat edit transaksi'));
      auditTrailPush('EDIT_TRANSAKSI_PENERIMAAN', {id:sid0}, {id:sid0, nominal:totalNominal}, 'manual');
      if(combinedPlan.length) createAlokasi(sid0, combinedPlan); else updateTransaksiStatus(sid0, computeTransaksiAllocationStatus(sid0));
    }catch(e){ toast('Gagal memperbarui transaksi: '+e.message); return; }
    State.penerimaanWizard=null; closeModal(); renderContent(); toast('Transaksi diperbarui (alokasi lama diarsipkan, tidak dihapus)'); return;
  }
  let trx;
  if(w.editTrxId){
    /* EDIT: update transaksi yang SAMA (id tidak berubah) + ganti alokasi
       lama dengan yang baru. TIDAK PERNAH membuat transaksi kedua. */
    const arr = Store.loadTransaksi();
    const idx = arr.findIndex(t=>t.id===w.editTrxId);
    if(idx<0){ toast('Transaksi tidak ditemukan (mungkin sudah dihapus)'); State.penerimaanWizard=null; closeModal(); renderContent(); return; }
    const before = deepClone(arr[idx]);
    arr[idx] = Object.assign({}, arr[idx], {tanggal, metode, akunId, unit, nominal:totalNominal, siswaId:null, ftNumber:ftNumber||undefined, catatan:catatan||undefined});
    Store.saveTransaksi(arr);
    trx = arr[idx];
    auditTrailPush('EDIT_TRANSAKSI_PENERIMAAN', before, trx, 'manual');
    const oldAlok = alokasiForTransaksi(trx.id);
    if(oldAlok.length){
      Store.saveAlokasi(Store.loadAlokasi().filter(a=>a.transaksiId!==trx.id));
      auditTrailPush('GANTI_ALOKASI_UNTUK_EDIT', oldAlok, null, 'manual');
    }
    try{
      if(combinedPlan.length) createAlokasi(trx.id, combinedPlan);
      else updateTransaksiStatus(trx.id, computeTransaksiAllocationStatus(trx.id));
    }catch(e){ toast('Transaksi diperbarui tapi alokasi gagal: '+e.message); State.penerimaanWizard=null; closeModal(); renderContent(); return; }
  } else {
    /* BARU: satu Transaksi + satu panggilan createAlokasi (gabungan seluruh
       siswa) - engine yang sama persis dengan alur sebelumnya. */
    try{
      trx = postTransaksi({jenis:'PENERIMAAN', tanggal, sumber:'Pembayaran Siswa', akunId, unit, nominal:totalNominal, metode, status:'TERCATAT', ftNumber:ftNumber||undefined, catatan:catatan||undefined, resiNo:generateResiNumber()});
    }catch(e){ toast('Gagal menyimpan transaksi: '+e.message); return; }
    try{
      if(combinedPlan.length) createAlokasi(trx.id, combinedPlan);
    }catch(e){ toast('Transaksi tersimpan tapi alokasi gagal: '+e.message); State.penerimaanWizard=null; closeModal(); renderContent(); return; }
  }

  const rowCount = filled.length;
  const finish = ()=>{ const trxId=trx.id; State.penerimaanWizard=null; renderContent(); pwShowSuccessPanel(trxId, totalNominal, rowCount); };
  const fileInput = document.getElementById('pw_bukti');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      const dok = Store.loadDokumen();
      const d = {id:uid('dok'), kategori:'Bukti Transfer', transaksiId:trx.id, fileRef:reader.result||'', judul:'Bukti Transfer - '+fmtDate(tanggal), tanggal:todayISO()};
      dok.push(d); Store.saveDokumen(dok);
      const arr = Store.loadTransaksi(); const idx = arr.findIndex(t=>t.id===trx.id);
      if(idx>=0){ arr[idx].buktiId = (arr[idx].buktiId||[]).concat([d.id]); Store.saveTransaksi(arr); }
      auditTrailPush('LAMPIRKAN_BUKTI', null, d, 'manual');
      finish();
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else finish();
}
/* Aksi "Edit" (section 15): buka KEMBALI form Catat Penerimaan yang SAMA,
   terisi penuh dari data transaksi tersimpan - bukan form terpisah. Cara
   Pembayaran per baris direkonstruksi sebagai "Cicilan" dengan `plan` diisi
   APA ADANYA dari Alokasi historis (periode + nominal asli) supaya baris
   yang TIDAK disentuh bendahara tetap presis sama saat disimpan ulang. */
/* Aksi "Edit" (BUG05): cara pembayaran per komponen direkonstruksi dari
   caraBayar YANG TERSIMPAN pada Alokasi (SATU sumber - lihat pwSubmit/
   createAlokasi), BUKAN selalu di-set ulang ke "Cicilan". Transaksi lama
   (sebelum patch ini) tidak punya caraBayar tersimpan - untuk itu saja
   dipakai tebakan aman dari JUMLAH periode (>1 periode = Lunas Sampai
   Periode, 1 periode = Cicilan), sekali saja saat fallback. */
function pwEditTransaksi(trxId){
  const t = transaksiById(trxId);
  if(!t || t.jenis!=='PENERIMAAN'){ toast('Transaksi tidak ditemukan'); return; }
  const alok = alokasiForTransaksi(trxId);
  const groups = {};
  const order = [];
  alok.forEach(a=>{
    const key = a.siswaId+'|'+a.komponenId;
    if(!groups[key]){ groups[key] = {siswaId:a.siswaId, komponenId:a.komponenId, plan:[], caraBayar:null}; order.push(key); }
    groups[key].plan.push({ob:{key:a.siswaId+'|'+a.komponenId+'|'+a.periode, siswaId:a.siswaId, komponenId:a.komponenId, periode:a.periode, netto:a.nominal}, nominal:Number(a.nominal||0)});
    if(!groups[key].caraBayar && a.caraBayar) groups[key].caraBayar = a.caraBayar;
  });
  const bySiswa = {};
  order.forEach(key=>{
    const g = groups[key];
    const komp = komponenById(g.komponenId);
    if(!komp) return;
    const total = sum(g.plan.map(p=>p.nominal));
    const periods = g.plan.map(p=>p.ob.periode).slice().sort();
    const caraBayar = g.caraBayar || (g.plan.length>1 ? 'lunasSampai' : 'cicilan');
    const entry = {checked:true, caraBayar, mulai:periods[0]||'', sampai:periods[periods.length-1]||'', nominal:total,
      plan:g.plan, totalNominal:total, dialokasikan:total, sisaKredit:0, incomplete:false, noObligation:false, autoNominal:total};
    if(!bySiswa[g.siswaId]) bySiswa[g.siswaId] = {};
    bySiswa[g.siswaId][komp.nama] = entry;
  });
  const rows = Object.keys(bySiswa).map(sid=>{
    const siswa = MasterAPI.students().find(s=>s.id===sid);
    return {siswaId:sid, siswaNama:siswa?siswa.nama:'(siswa tidak ditemukan)', kelas:siswa?siswa.kelas:'', nis:siswa?siswa.nis:'', komponen:bySiswa[sid]};
  });
  rows.push(pwBlankRow());
  State.penerimaanWizard = {
    data:{tanggal:t.tanggal, metode:t.metode||'Tunai', akunId:t.akunId, unit:t.unit||'', ftNumber:t.ftNumber||'', catatan:t.catatan||''},
    rows, activeIdx: rows.length-1, searchQuery:'',
    editTrxId:trxId, existingBuktiCount:(t.buktiId||[]).length,
    dupWarning:null, confirmDuplicate:false
  };
  setPage('transaksi'); State.trxTab='penerimaan'; renderShell();
  openModal(renderCatatPenerimaanWizard(), true);
}

/* Patch section 6/10: Aksi rutin per baris HANYA Detail/Resi/Edit - status
   "belum teridentifikasi"/"belum teralokasi"/"overpayment" dll cukup
   ditampilkan sebagai badge Status (statusBadge) dan ditindaklanjuti lewat
   halaman Perlu Tindakan (section 12), bukan tombol "Atur Manual"/"Proses"
   di tabel ini. */
function renderTabPenerimaan(){
  const all = penerimaanList();
  const komponenMasterNames = MasterAPI.components().map(k=>k.nama);
  const cfg = {searchLabel:'Cari siswa/NIS/no.resi/no.referensi/catatan', searchFields:['sumber','catatan','_siswaNama','_nisList','resiNo','ftNumber'],
    selects:[{field:'status', label:'Status', options:['TERCATAT','TERIDENTIFIKASI','SEBAGIAN_TERALOKASI','OVERPAYMENT_CREDIT','TERALOKASI','REKONSILIASI','SELESAI']},
             {field:'_siswaIds', label:'Siswa', options:siswaOptions(), matchMode:'contains'},
             {field:'akunId', label:'Akun', options:akunList().map(a=>({value:a.id,label:a.nama}))},
             {field:'metode', label:'Metode', options:['Tunai','Transfer Bank']},
             {field:'_hasilPembayaran', label:'Hasil Pembayaran', options:[{value:'KURANG_BAYAR',label:'Kurang Bayar'},{value:'LUNAS',label:'Lunas'},{value:'LEBIH_BAYAR',label:'Lebih Bayar'}]},
             {field:'_komponenList', label:'Komponen', options:komponenMasterNames, matchMode:'contains'}],
    periodeField:'tanggal', periodeOptions:trxPeriodeOptions()};
  const withMeta = all.map(t=>{
    const _siswaIds = Array.from(new Set(alokasiForTransaksi(t.id).map(a=>a.siswaId).concat(t.siswaId?[t.siswaId]:[]).filter(Boolean)));
    return Object.assign({
      _siswaNama:transaksiSiswaNames(t), _siswaIds,
      _nisList:_siswaIds.map(sid=>{ const s=MasterAPI.students().find(x=>x.id===sid); return s?s.nis:''; }).filter(Boolean).join(' '),
      _komponenList:transaksiKomponenList(t.id), _hasilPembayaran:hasilPembayaranTransaksi(t.id)
    }, t);
  });
  const rows = tblApply(withMeta, 'trxPenerimaan', cfg).sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||''));

  /* Patch "Form Tersembunyi": halaman Penerimaan HANYA menampilkan tombol +

/* Menghitung rencana alokasi SATU baris komponen (Cicilan/Lunas Sampai/
   Lunas). "Lunas" TIDAK meminta nominal diketik (Bagian 5/7 vs 7-baru) -
   sistem menghitung persis sisa kewajiban sampai periode aktif (Bulanan)
   atau sisa kewajiban satu-kali (SekaliBayar/Tahunan). */
function pfComputeRowPlan(siswa, row){
  const komp = row.komponen ? komponenByNama(row.komponen) : null;
  if(!komp) return {plan:[], totalNominal:0, dialokasikan:0, sisaKredit:0, incomplete:true};
  if(komp.frekuensi==='Bulanan'){
    if(row.caraBayar==='lunas'){
      const periodeAktif = Store.loadSettings().periodeAktif;
      const obs = obligationsInWindow(siswa.id, row.komponen, '', periodeAktif).filter(o=>sisaObligation(o)>0.5);
      const totalKebutuhan = obs.reduce((s,o)=>s+sisaObligation(o),0);
      const fill = greedyFillSorted(obs, totalKebutuhan);
      return {plan:fill.plan, totalNominal:totalKebutuhan, dialokasikan:totalKebutuhan-fill.sisa, sisaKredit:0, incomplete:false};
    }
    if(row.caraBayar==='lunasSampai'){
      if(!row.sampai) return {plan:[], totalNominal:Number(row.nominal)||0, dialokasikan:0, sisaKredit:0, incomplete:true};
      const obs = obligationsInWindow(siswa.id, row.komponen, '', row.sampai).filter(o=>sisaObligation(o)>0.5);
      const fill = greedyFillSorted(obs, Number(row.nominal)||0);
      return {plan:fill.plan, totalNominal:Number(row.nominal)||0, dialokasikan:(Number(row.nominal)||0)-fill.sisa, sisaKredit:fill.sisa, incomplete:false};
    }
    const plan = allocPlanForKomponenGreedy(siswa.id, row.komponen, Number(row.nominal)||0);
    const dialokasikan = plan.reduce((s,p)=>s+p.nominal,0);
    return {plan, totalNominal:Number(row.nominal)||0, dialokasikan, sisaKredit:Math.max(0,(Number(row.nominal)||0)-dialokasikan), incomplete:false};
  }
  const ob = kewajibanForSiswa(siswa.id).find(o=>o.komponenNama===row.komponen);
  if(!ob) return {plan:[], totalNominal:0, dialokasikan:0, sisaKredit:0, incomplete:false, noObligation:true};
  if(row.caraBayar==='lunas'){
    const jumlah = sisaObligation(ob);
    return {plan: jumlah>0.5?[{ob,nominal:jumlah}]:[], totalNominal:jumlah, dialokasikan:jumlah, sisaKredit:0, incomplete:false};
  }
  const nominal = Number(row.nominal)||0;
  const jumlah = Math.max(0, Math.min(nominal, sisaObligation(ob)));
  return {plan: jumlah>0.5?[{ob,nominal:jumlah}]:[], totalNominal:nominal, dialokasikan:jumlah, sisaKredit:Math.max(0,nominal-jumlah), incomplete:false};
}
function pfAggregateFromRows(siswa, rows){
  const results = rows.map(r=>({row:r, res: pfComputeRowPlan(siswa, r)}));
  const totalNominal = results.reduce((s,x)=>s+x.res.totalNominal,0);
  const combinedPlan = [];
  results.forEach(x=>combinedPlan.push.apply(combinedPlan, x.res.plan));
  const dialokasikan = combinedPlan.reduce((s,p)=>s+p.nominal,0);
  const sisaKredit = Math.max(0, totalNominal-dialokasikan);
  const kekurangan = combinedPlan.reduce((s,p)=>s+Math.max(0, sisaObligation(p.ob)-p.nominal),0);
  return {results, totalNominal, combinedPlan, dialokasikan, sisaKredit, kekurangan};
}
function pfRowPreviewHtml(siswa, row){
  if(!row.komponen) return '';
  const res = pfComputeRowPlan(siswa, row);
  if(res.noObligation) return '<p class="small-muted">Tidak ada kewajiban aktif untuk komponen ini (cek Tarif di Pengaturan).</p>';
  if(res.incomplete) return '<p class="small-muted">Pilih periode "Lunas Sampai" untuk melihat rincian.</p>';
  if(!res.totalNominal) return row.caraBayar==='lunas' ? '<p class="small-muted">Sudah lunas, tidak ada kewajiban tersisa untuk komponen ini.</p>' : '';
  const parts = res.plan.map(p=>esc(p.ob.periode)+': '+fmtRp(p.nominal)+' / '+fmtRp(p.ob.netto)).join('<br>');
  return '<p class="small-muted">'+(parts||'-')+(res.sisaKredit>0.5?('<br>Sisa (kredit): '+fmtRp(res.sisaKredit)):'')+'</p>';
}
/* PREVIEW WAJIB (Bagian 12) - format tetap: Siswa/Total Pembayaran/rincian
   per komponen/Total Teralokasi/Sisa Kewajiban atau Lebih Bayar/Hasil. */
function pfPreviewHtml(siswa, agg, kreditInfo){
  let html = '<div class="section-title">Preview Pembayaran</div>';
  if(!agg.totalNominal) return html+'<p class="small-muted">Lengkapi komponen dan nominal untuk melihat preview.</p>';
  html += '<div class="card"><div class="kv"><div>Siswa</div><div><b>'+esc(siswa.nama)+'</b></div><div>Total Pembayaran</div><div><b>'+fmtRp(agg.totalNominal)+'</b></div></div>';
  agg.results.forEach(x=>{
    if(x.res.noObligation){ html += '<div class="section-title" style="margin-top:6px">'+esc(x.row.komponen)+'</div><div class="small-muted">Tidak ada kewajiban aktif.</div>'; return; }
    if(!x.res.totalNominal) return;
    html += '<div class="section-title" style="margin-top:6px">'+esc(x.row.komponen)+'</div>';
    if(x.res.plan.length){
      x.res.plan.forEach(p=>{ html += '<div class="kv"><div>'+esc(p.ob.periode)+'</div><div>'+fmtRp(p.nominal)+' / '+fmtRp(p.ob.netto)+'</div></div>'; });
    } else if(x.res.incomplete){
      html += '<div class="small-muted">Pilih periode "Lunas Sampai".</div>';
    }
  });
  let kekurangan = agg.kekurangan, sisaKredit = agg.sisaKredit, kreditDipakai = 0;
  if(kreditInfo && kreditInfo.total>0.5 && kekurangan>0.5){
    kreditDipakai = Math.min(kekurangan, kreditInfo.total);
    kekurangan = Math.max(0, kekurangan - kreditDipakai);

   (Bagian 4): Cicilan/Lunas Sampai (khusus Bulanan)/Lunas. */
function pfKomponenRowHtml(siswa, komponenListAll, rows, idx){
  const row = rows[idx];
  const usedByOthers = rows.filter((r,i)=>i!==idx).map(r=>r.komponen).filter(Boolean);
  const options = komponenListAll.filter(k=>usedByOthers.indexOf(k.nama)<0);
  if(!row.komponen && options.length) row.komponen = options[0].nama;
  const komp = row.komponen ? komponenByNama(row.komponen) : null;
  let html = '<div class="card" style="margin-bottom:8px">';
  html += '<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">'+
    '<div style="flex:1;min-width:160px">'+fieldSelect('pf_komp_'+idx,'Komponen '+(idx+1), options.map(k=>({value:k.nama,label:k.nama})), row.komponen).replace('id="pf_komp_'+idx+'"','id="pf_komp_'+idx+'" onchange="setPenerimaanFormKomponenRow('+idx+')"')+'</div>'+
    (idx>0 ? '<button class="btn sm" type="button" onclick="hapusKomponenRow('+idx+')" style="margin-bottom:14px">Hapus</button>' : '')+
    '</div>';
  if(komp){
    const caraOpts = komp.frekuensi==='Bulanan' ? [['cicilan','Cicilan'],['lunasSampai','Lunas Sampai'],['lunas','Lunas']] : [['cicilan','Cicilan'],['lunas','Lunas']];
    html += '<div class="field"><label>Bayar Bagaimana?</label><div style="display:flex;gap:12px;flex-wrap:wrap">'+
      caraOpts.map(c=>'<label style="display:flex;gap:4px;align-items:center;font-weight:normal"><input type="radio" name="pf_cara_'+idx+'" value="'+c[0]+'" '+(row.caraBayar===c[0]?'checked':'')+' onchange="setPenerimaanFormCaraBayar('+idx+',\''+c[0]+'\')"> '+c[1]+'</label>').join('')+
      '</div></div>';
    if(row.caraBayar==='lunas'){
      const res = pfComputeRowPlan(siswa, row);
      html += '<p class="small-muted">Berapa? Dihitung otomatis: <b>'+fmtRp(res.totalNominal)+'</b>'+(res.totalNominal<=0.5?' (sudah lunas)':'')+'</p>';
    } else {
      if(row.caraBayar==='lunasSampai'){
        const horizonLabel = periodeAdvance(Store.loadSettings().periodeAktif, 24);
        const periodeOpts = enumeratePeriodesBulananExtended(siswa, horizonLabel);
        html += fieldSelect('pf_sampai_'+idx,'Lunas Sampai', [{value:'',label:'- Pilih periode -'}].concat(periodeOpts.map(p=>({value:p,label:p}))), row.sampai||'').replace('id="pf_sampai_'+idx+'"','id="pf_sampai_'+idx+'" onchange="setPenerimaanFormSampaiRow('+idx+')"');
      }
      html += fieldText('pf_nominal_'+idx,'Berapa? (Nominal)', row.nominal||'', 'number').replace('<input ','<input oninput="updatePenerimaanRowPreview('+idx+')" ');
    }
    html += '<div id="pf_row_preview_'+idx+'">'+pfRowPreviewHtml(siswa, row)+'</div>';
  }
  html += '</div>';
  return html;
}

function submitPenerimaan(){
  const pf = State.penerimaanForm;
  const siswaId = pf.siswaId || null;
  const siswa = siswaId ? MasterAPI.students().find(x=>x.id===siswaId) : null;
  const tanggal = val('pf_tanggal'), sumber = val('pf_sumber'), catatan = val('pf_catatan');
  const unit = val('pf_unit');
  if(!unit){ toast('Unit (TK/MI) wajib dipilih'); return; }
  const agg = siswa ? pfAggregateFromRows(siswa, pf.rows.filter(r=>r.komponen)) : null;
  const nominal = siswa ? agg.totalNominal : numval('pf_nominal_generic');
  if(nominal<=0){ toast('Nominal harus lebih dari 0'); return; }
  /* Patch Master "Kontrol Anti Kebocoran": peringatan transaksi duplikat
     (fingerprint sama seperti dipakai import - Bagian 16e) sebelum simpan,
     TIDAK memblokir keras - bendahara cukup klik Konfirmasi & Simpan sekali
     lagi untuk melanjutkan. */
  if(!pf.confirmDuplicate){
    const dup = findDuplicateTransaksi(tanggal, nominal, {uraian:catatan, sumber});
    if(dup){
      pf.confirmDuplicate = true;
      pf.dupWarning = 'Mirip transaksi yang sudah tercatat: '+fmtDate(dup.tanggal)+' - '+fmtRp(dup.nominal)+' ('+esc(dup.sumber||dup.jenis)+'). Klik "Konfirmasi & Simpan" sekali lagi untuk tetap menyimpan sebagai transaksi baru.';
      openModal(penerimaanFormHtml(), false);
      return;
    }
  }
  let t;
  try{
    t = postTransaksi({jenis:'PENERIMAAN', tanggal, sumber, siswaId, akunId:val('pf_akun'), unit, nominal, metode:val('pf_metode'), status: siswaId?'TERIDENTIFIKASI':'TERCATAT', catatan});
  }catch(e){ toast('Gagal menyimpan: '+e.message); return; }
  let hasil = '';
  if(siswa && agg.combinedPlan.length){
    try{
      createAlokasi(t.id, agg.combinedPlan);
      let sisaKekurangan = agg.kekurangan;
      /* Bagian 16 - Gunakan Kredit Siswa: HANYA jika dicentang & masih ada
         kekurangan SETELAH cash di atas tersimpan (sisaObligation sudah live
         mencerminkan alokasi cash yang baru saja dibuat). Alokasi kredit
         ditulis ke TRANSAKSI LAMA (sumber kredit) via createAlokasi yang
         SAMA - bukan transaksi/penerimaan fiktif baru (Bagian 16/28). */
      if(pf.useKredit && sisaKekurangan>0.5){
        const kredit = siswaKreditInfo(siswa.id);
        const sisaObs = agg.combinedPlan.map(p=>p.ob).filter(ob=>sisaObligation(ob)>0.5);
        for(const src of kredit.sumber){
          if(sisaKekurangan<=0.5) break;
          const ambil = Math.min(src.sisa, sisaKekurangan);
          if(ambil<=0.5) continue;
          const planKredit = greedyFillSorted(sisaObs.filter(ob=>sisaObligation(ob)>0.5), ambil).plan;
          if(planKredit.length){
            createAlokasi(src.trxId, planKredit);
            sisaKekurangan -= planKredit.reduce((s,p)=>s+p.nominal,0);
            auditTrailPush('GUNAKAN_KREDIT_SISWA', null, {dariTransaksiId:src.trxId, keTransaksiId:t.id, siswaId:siswa.id}, 'manual');
          }
        }
      }
      hasil = agg.combinedPlan.length+' alokasi tersimpan'+(agg.sisaKredit>0.5?('. Kelebihan (kredit): '+fmtRp(agg.sisaKredit)):'')+
        (sisaKekurangan>0.5?('. Masih kurang: '+fmtRp(sisaKekurangan)):(agg.kekurangan>0.5?'. Kekurangan tertutup kredit siswa.':''));
    }catch(e){ /* transaksi tetap tersimpan (TERIDENTIFIKASI) - alokasi menyusul manual di Belum Diproses, tidak fatal */ }
  }
  const finish = ()=>{
    closeModal();
    toast('Penerimaan tersimpan'+(hasil?('. '+hasil):(siswa?'. Belum ada kewajiban aktif untuk dialokasikan otomatis - cek Belum Diproses.':'')));
    State.penerimaanForm = null;
    renderContent();
  };
  /* Bukti opsional langsung di form input - kalau bendahara sudah pegang
     buktinya saat input, tidak perlu langkah terpisah "Lampirkan Bukti"
     sesudahnya (tetap tersedia untuk yang belum). */
  const fileInput = document.getElementById('pf_bukti_file');
  if(fileInput && fileInput.files && fileInput.files[0]){
    const reader = new FileReader();
    reader.onload = ()=>{
      const dok = Store.loadDokumen();
      const d = {id:uid('dok'), kategori:'Bukti Pembayaran', transaksiId:t.id, fileRef:reader.result, judul:'Bukti '+t.id, tanggal:todayISO()};
      dok.push(d); Store.saveDokumen(dok);
      const arr = Store.loadTransaksi(); const idx = arr.findIndex(x=>x.id===t.id);
      arr[idx].buktiId = (arr[idx].buktiId||[]).concat([d.id]);
      Store.saveTransaksi(arr);
      auditTrailPush('LAMPIRKAN_BUKTI', null, d, 'input-manual');
      finish();
    };
    reader.readAsDataURL(fileInput.files[0]);
  } else finish();
}

/* Riwayat perubahan (section 8 patch) untuk satu Transaksi - mencari semua
   entri AuditTrail yang menyebut transaksi ini, baik sebagai transaksi itu
   sendiri (TAMBAH/EDIT) maupun lewat transaksiId pada payload alokasi/bukti. */
function transaksiAuditTrail(trxId){
