/* ---- 16g. Per-type validators & committers ---- */
/* Import Siswa Massal (Phase khusus): status memakai kosakata literal
   BARU/SUDAH_ADA/DUPLIKAT/PERLU_KONFIRMASI/ERROR. Duplikat NISN dicek DUA arah:
   (1) dalam Master Siswa yang sudah ada (lewat matchSiswaByFields), dan
   (2) DALAM BATCH file yang sama (dua baris ber-NISN sama di file Excel/CSV
   itu sendiri) - keduanya wajib per Phase Validasi. Nama sama tapi NISN
   beda TIDAK PERNAH otomatis dianggap siswa yang sama (matchSiswaByFields
   sendiri sudah menegakkan ini via AMBIGUOUS, bukan auto-MATCH). */
function classifySiswaBatch(rows, headerMap){
  const nisnSeenInBatch = {};
  return rows.map((row,i)=>{
    const get = fieldGetterFor(row, headerMap);
    const nama = get('namaSiswa');
    const unit = get('unit')||inferUnitFromSheet(row._sheetName);
    const kelas = get('kelas');
    const nisn = get('nisn')||get('nis');
    const jk = get('jenisKelamin');
    if(!nama) return {status:'ERROR', reason:'Nama Kosong', nama, nisn, unit, kelas, jk};
    if(nisn){
      if(nisnSeenInBatch[nisn]!==undefined) return {status:'DUPLIKAT', reason:'NISN "'+nisn+'" duplikat dalam file (baris '+(nisnSeenInBatch[nisn]+1)+' &amp; '+(i+1)+')', nama, nisn, unit, kelas, jk};
      nisnSeenInBatch[nisn] = i;
    }
    const match = matchSiswaByFields(nisn, nama, kelas, unit);
    if(match.status==='MATCH') return {status:'SUDAH_ADA', reason:'Cocok dengan siswa terdaftar: '+siswaName(match.siswaId), nama, nisn, unit, kelas, jk, existingId:match.siswaId};
    if(match.status==='AMBIGUOUS') return {status:'PERLU_KONFIRMASI', reason:'Mirip dengan '+match.candidates.length+' siswa terdaftar: '+match.candidates.map(c=>c.nama).join(', '), candidates:match.candidates, nama, nisn, unit, kelas, jk};
    return {status:'BARU', reason:'Siswa baru', nama, nisn, unit, kelas, jk};
  });
}
function commitSiswaRow(get, extra, res){
  if(!centralMasterWriteActive()){ toast('GAGAL: ' + centralNotReadyText_()); return; } // [P0-B] tanpa simpan lokal
  if(centralMasterWriteActive()){
    const s0 = Store.loadSettings(), id0 = uid('siswa');
    const rec0 = {nama:get('namaSiswa'), nis:get('nis'), nisn:get('nisn'), unit:get('unit') || (res&&res.unit) || '', kelas:get('kelas'), tahunAjaran:get('tahunAjaran')||s0.tahunAjaranAktif,
      jenisKelamin:get('jenisKelamin'), tanggalMasuk:get('tanggalMasuk'), status:get('status')||'Aktif', namaWali:get('namaWali')||get('namaAyah')||get('namaIbu'), kontakWali:get('kontakWali')};
    if(get('alamat')) rec0.alamat = get('alamat');
    centralMasterQueue_('siswa', id0, rec0);
    auditTrailPush('MATCH_STUDENT', null, {siswaId:id0, nama:rec0.nama, hasil:'NEW'}, 'import-wizard');
    return id0;
  }
  const s = Store.loadSettings();
  const arr = Store.loadSiswa();
  const unit = get('unit') || (res&&res.unit) || '';
  const rec = {id:uid('siswa'), nama:get('namaSiswa'), nis:get('nis'), nisn:get('nisn'), unit:unit, kelas:get('kelas'),
    tahunAjaran:get('tahunAjaran')||s.tahunAjaranAktif, jenisKelamin:get('jenisKelamin'), tanggalMasuk:get('tanggalMasuk'),
    status:get('status')||'Aktif', namaWali:get('namaWali')||get('namaAyah')||get('namaIbu'), kontakWali:get('kontakWali'), alamat:get('alamat'),
    _extra: Object.keys(extra).length?extra:undefined};
  arr.push(rec); Store.saveSiswa(arr);
  auditTrailPush('MATCH_STUDENT', null, {siswaId:rec.id, nama:rec.nama, hasil:'NEW'}, 'import-wizard');

}
/* Update in-place: siswaId TIDAK berubah, sehingga seluruh Transaksi/Alokasi/
   Tarif/Keringanan yang sudah tertaut ke siswa ini tetap valid. Hanya field
   yang ADA nilainya di baris import yang menimpa - field kosong tidak
   menimpa data lama (supaya import parsial tidak mengosongkan data valid). */
function updateSiswaRow(siswaId, get, extra, res){
  if(!centralMasterWriteActive()){ toast('GAGAL: ' + centralNotReadyText_()); return; } // [P0-B] tanpa simpan lokal
  if(centralMasterWriteActive()){
    const cur0 = MasterAPI.students().find(x=>x.id===siswaId); if(!cur0) return;
    const upd0 = {}, setIf0 = (f, v)=>{ if(v) upd0[f] = v; };
    setIf0('nama', get('namaSiswa')); setIf0('nis', get('nis')); setIf0('nisn', get('nisn')); setIf0('unit', get('unit')||(res&&res.unit)); setIf0('kelas', get('kelas'));
    setIf0('jenisKelamin', get('jenisKelamin')); setIf0('tanggalMasuk', get('tanggalMasuk')); setIf0('status', get('status'));
    setIf0('namaWali', get('namaWali')||get('namaAyah')||get('namaIbu')); setIf0('kontakWali', get('kontakWali')); setIf0('alamat', get('alamat'));
    if(Object.keys(upd0).length) centralMasterQueue_('siswa', siswaId, upd0);
    auditTrailPush('UPDATE_STUDENT', cur0, Object.assign({}, cur0, upd0), 'import-wizard');
    return;
  }
  const arr = Store.loadSiswa();
  const idx = arr.findIndex(x=>x.id===siswaId);
  if(idx<0) return;
  const before = deepClone(arr[idx]);
  const upd = arr[idx];
  const setIf = (field, val)=>{ if(val) upd[field]=val; };
  setIf('nama', get('namaSiswa')); setIf('nis', get('nis')); setIf('nisn', get('nisn'));
  setIf('unit', get('unit')||(res&&res.unit)); setIf('kelas', get('kelas')); setIf('jenisKelamin', get('jenisKelamin'));
  setIf('tanggalMasuk', get('tanggalMasuk')); setIf('status', get('status'));
  setIf('namaWali', get('namaWali')||get('namaAyah')||get('namaIbu')); setIf('kontakWali', get('kontakWali')); setIf('alamat', get('alamat'));
  if(Object.keys(extra).length) upd._extra = Object.assign({}, upd._extra||{}, extra);
  arr[idx] = upd;
  Store.saveSiswa(arr);
  auditTrailPush('UPDATE_STUDENT', before, upd, 'import-wizard');
}
function validatePenerimaanRow(get, rawRow, headerMap){
  const tanggal = normalizeDateValue(get('tanggal'));
  if(!tanggal) return {status:'INVALID', reason:'Tanggal kosong/tidak valid'};
  const cash = numFromStr(get('cash')), transfer = numFromStr(get('transfer'));
  let nominal = numFromStr(get('nominal'));
  if(!nominal) nominal = cash+transfer;
  else if((cash||transfer) && Math.abs(nominal-(cash+transfer))>1) return {status:'HOLD', reason:'Nominal ('+fmtRp(nominal)+') tidak sama dengan Cash+Transfer ('+fmtRp(cash+transfer)+')'};
  const nama = get('namaSiswa');
  let match = {status:'UNKNOWN'};
  if(nama) match = matchSiswaByFields(get('nis')||get('nisn'), nama, get('kelas'), get('unit'));
  if(match.status==='AMBIGUOUS') return {status:'AMBIGUOUS', reason:'Siswa "'+nama+'" cocok dengan '+match.candidates.length+' siswa terdaftar', candidates:match.candidates};
  const dup = findDuplicateTransaksi(tanggal, nominal, {namaPengirim:get('namaPengirim'), ftNumber:get('ftNumber'), uraian:get('uraian')});
  if(dup) return {status:'DUPLICATE', reason:'Mirip transaksi '+fmtDate(dup.tanggal)+' - '+fmtRp(dup.nominal)+' yang sudah ada', existingId:dup.id};
  const unit = resolveUnitForImportRow(get, rawRow, match.siswaId||null);
  if(!unit) return {status:'HOLD', reason:'Unit (TK/MI) tidak diketahui - isi kolom Unit di file, atau namai sheet persis "TK"/"MI", atau pastikan siswa berhasil dikenali'};
  return {status:'VALID', reason: nama? ('Siswa: '+nama+(match.status==='MATCH'?' (cocok)':' (belum teridentifikasi)')) : 'Penerimaan umum', nominal, siswaId:match.siswaId||null, unit, tanggal};
}
/* Alokasi greedy per-komponen (dipakai bersama oleh commitPenerimaanRow dan
   commitMutasiBankRow - Phase 5/6/7 diperluas): satu kolom komponen bisa
   menutup LEBIH DARI SATU kewajiban tertua (mis. pembayaran 2 bulan sekaligus
   di 1 kolom SPP), bukan cuma kewajiban tertua yang pertama ditemukan.
   greedyFillSorted/sortObligationsChronological (Allocation Planner) adalah
   primitif urutan-kronologis + greedy-fill yang SAMA dipakai recommendAllocation
   (Engine 3) dan mode Rentang Periode/Otomatis - tidak diduplikasi di sini. */
function allocPlanForKomponenGreedy(siswaId, komponenNama, amount){
  const outstanding = kewajibanForSiswa(siswaId).filter(ob=>ob.komponenNama===komponenNama && sisaObligation(ob)-cartPendingFor(ob.key)>0);
  return greedyFillSorted(outstanding, amount).plan;
}
function buildAllocListFromKomponenColumns(siswaId, headerMap, rawRow){
  const kompCols = komponenColumnCandidates(Object.keys(headerMap));
  const allocList = [];
  kompCols.forEach(kc=>{
    const val = numFromStr(rawRow[kc.header]);
    if(val>0 && komponenByNama(kc.komponenNama)){
      allocList.push.apply(allocList, allocPlanForKomponenGreedy(siswaId, kc.komponenNama, val));
    }
  });
  return allocList;
}
/* Patch "Input & Import Pemasukan": import massal harus mengalokasikan
   OTOMATIS sama seperti input satuan/Quick Alokasi, bukan cuma kalau file
   punya kolom lebar per-komponen (SPP/Biaya Awal/dst masing2 kolomnya
   sendiri). Kalau file itu tidak ada, tapi ada SATU kolom "Komponen" berisi
   nama komponen (mis. "SPP"), tetap dialokasikan greedy oldest-first ke
   komponen itu untuk SELURUH nominal baris. Kalau kedua sinyal itu TIDAK ADA
   sama sekali (tidak tahu ini untuk komponen apa), SENGAJA dibiarkan kosong -
   baris itu tetap tersimpan sebagai transaksi tapi menunggu di Belum
   Diproses (Perlu Dilengkapi), bukan ditebak sembarang komponen. */
function buildAllocListForRow(siswaId, headerMap, rawRow, get, nominal){
  const fromColumns = buildAllocListFromKomponenColumns(siswaId, headerMap, rawRow);
  if(fromColumns.length) return fromColumns;
  const komponenNama = get('komponen');
  if(komponenNama && komponenByNama(komponenNama)) return allocPlanForKomponenGreedy(siswaId, komponenNama, nominal);
  return [];
}

/* ============================================================
   16i. IMPORT RKAT / RAB / LPJ (PATCH MASTER section 23-31).
   RKAT/RAB = PLANNED/BUDGET, LPJ = REALIZATION - TIDAK PERNAH otomatis
   membuat Transaksi Pengeluaran aktual (section 23/25/27). RAB SENGAJA
   ditulis ke koleksi Anggaran yang SUDAH ADA (bukan tabel baru) supaya tetap
   satu sumber "planned budget" dengan tab RAB/Realisasi/Sisa yang sudah ada
   di Anggaran & Komitmen - hanya ditandai source:'RAB_IMPORT' + metadata
   asal file (section 30) untuk audit. RKAT/LPJ memang berbeda konsep (bukan
   dana yang sudah disetujui/dibelanjakan) sehingga punya koleksi sendiri. ---- */
function sourceMetaFor(rawRow){
  const s = State.importSession;
  return {sourceFile:(s.rawFiles||[]).map(f=>f.name).join(', ')||'-', sourceSheet:rawRow._sheetName||'-', sourceRow: JSON.stringify(rawRow),
    importBatchId: s.batchId, importDate:new Date().toISOString(), importUser:Store.loadSettings().namaBendahara||'Bendahara'};
}
function rkatFingerprintKey(tahun, unit, program, uraian, pagu){ return [tahun||'', unit||'', program||'', String(uraian||'').toLowerCase(), Number(pagu||0)].join('|'); }
function findDuplicateRkat(tahun, unit, program, uraian, pagu){
  const fp = rkatFingerprintKey(tahun, unit, program, uraian, pagu);
  return Store.loadRkat().find(r=>rkatFingerprintKey(r.tahun, r.unit, r.program, r.uraian, r.pagu)===fp);
}
function validateRkatRow(get){
  const uraian = get('uraian') || get('kegiatan') || get('program');
  if(!uraian) return {status:'INVALID', reason:'Uraian/Kegiatan kosong'};
  const pagu = numFromStr(get('pagu')) || numFromStr(get('nominal'));
  if(!pagu) return {status:'INVALID', reason:'Pagu kosong'};
  const tahun = get('tahun') || (get('tahunAjaran')?String(get('tahunAjaran')).split('/')[0]:'');
  const dup = findDuplicateRkat(tahun, get('unit'), get('program'), uraian, pagu);
  if(dup) return {status:'DUPLICATE', reason:'Mirip RKAT yang sudah ada: '+uraian+' ('+fmtRp(pagu)+')'};
  return {status:'VALID', reason:uraian+' - '+fmtRp(pagu), tahun, pagu, uraian};
}
function commitRkatRow(get, extra, res, rawRow){

function rabFingerprintKey(periode, unit, kategori, uraian, nominal){ return [periode||'', unit||'', kategori||'', String(uraian||'').toLowerCase(), Number(nominal||0)].join('|'); }
function findDuplicateRab(periode, unit, kategori, uraian, nominal){
  const fp = rabFingerprintKey(periode, unit, kategori, uraian, nominal);

function validateRabRow(get){

function importQueuePending(){ return Store.loadImportQueue().filter(q=>!q.resolved); }
function importQueueByType(t){ return importQueuePending().filter(q=>q.type===t); }
function openImportQueueResolver(id){
  const q = Store.loadImportQueue().find(x=>x.id===id);
  if(!q) return;
  const get = fieldGetterFor(q.row, q.headerMap);
  let body = '<h3>Selesaikan Item Import: '+esc(q.type)+'</h3>'+
    '<p class="small-muted">'+esc(q.reason)+'</p>'+
    '<div class="kv">'+Object.keys(q.row).map(h=>'<div>'+esc(h)+'</div><div>'+esc(q.row[h])+'</div>').join('')+'</div>';
  if(q.type==='AMBIGUOUS' && q.candidates){
    body += '<div class="section-title">Pilih Siswa yang Benar</div>'+
      fieldSelect('impq_siswa','Siswa', [{value:'',label:'- Pilih -'}].concat(q.candidates.map(c=>({value:c.id,label:c.nama+' - '+(c.kelas||'-')}))), '')+
      '<div class="modal-actions"><button class="btn" onclick="closeModal()">Nanti</button><button class="btn primary" onclick="resolveImportQueueAmbiguous(\''+id+'\')">Gunakan Siswa Ini</button><button class="btn" onclick="resolveImportQueueAsNew(\''+id+'\')">Anggap Siswa Baru</button></div>';
  } else if(q.type==='DUPLICATE'){
    body += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Nanti</button>'+
      '<button class="btn" onclick="resolveImportQueueUseOld(\''+id+'\')">Gunakan Data Lama</button>'+
      '<button class="btn primary" onclick="resolveImportQueueAsNew(\''+id+'\')">Import Sebagai Transaksi Baru</button>'+
      '<button class="btn danger" onclick="resolveImportQueueCancel(\''+id+'\')">Batalkan</button></div>';
  } else { // HOLD
    body += '<div class="modal-actions"><button class="btn" onclick="closeModal()">Nanti</button>'+
      '<button class="btn primary" onclick="resolveImportQueueAsNew(\''+id+'\')">Import Apa Adanya</button>'+
      '<button class="btn danger" onclick="resolveImportQueueCancel(\''+id+'\')">Batalkan</button></div>';
  }
  openModal(body, true);
}
function markImportQueueResolved(id){
  const arr = Store.loadImportQueue();
  const idx = arr.findIndex(q=>q.id===id);
  if(idx>=0){ arr[idx].resolved = true; Store.saveImportQueue(arr); }
}
function resolveImportQueueAmbiguous(id){
  const q = Store.loadImportQueue().find(x=>x.id===id);
  const siswaId = val('impq_siswa');
  if(!siswaId){ toast('Pilih siswa terlebih dahulu'); return; }
  const get = fieldGetterFor(q.row, q.headerMap);
  const extra = extraColumnsFor(q.row, q.headerMap);
  const committerMap = {siswa:commitSiswaRow, penerimaan:commitPenerimaanRow, mutasibank:commitMutasiBankRow, pengeluaran:commitPengeluaranRow};
  const res = {siswaId, tanggal:normalizeDateValue(get('tanggal')), nominal:numFromStr(get('nominal'))||(numFromStr(get('cash'))+numFromStr(get('transfer')))};
  committerMap[q.importType](get, extra, res, q.row, q.headerMap);
  auditTrailPush('MATCH_STUDENT', null, {importQueueId:id, siswaId, hasil:'AMBIGUOUS_RESOLVED'}, 'import-resolver');
  markImportQueueResolved(id); closeModal(); toast('Item diimport dengan siswa terpilih'); renderContent();
}
function resolveImportQueueAsNew(id){
  const q = Store.loadImportQueue().find(x=>x.id===id);
  const get = fieldGetterFor(q.row, q.headerMap);
  const extra = extraColumnsFor(q.row, q.headerMap);
  const committerMap = {siswa:commitSiswaRow, penerimaan:commitPenerimaanRow, mutasibank:commitMutasiBankRow, pengeluaran:commitPengeluaranRow};
  const nominal = numFromStr(get('nominal'))||(numFromStr(get('cash'))+numFromStr(get('transfer')))||(numFromStr(get('qty'))*numFromStr(get('hargaSatuan'))-numFromStr(get('diskon')));
  const res = {siswaId:null, tanggal:normalizeDateValue(get('tanggal')), nominal};
  committerMap[q.importType](get, extra, res, q.row, q.headerMap);
  markImportQueueResolved(id); closeModal(); toast('Diimport sebagai data baru'); renderContent();
}
function resolveImportQueueUseOld(id){
  auditTrailPush('ARCHIVE_DUPLICATE', null, {importQueueId:id, keputusan:'GUNAKAN_DATA_LAMA'}, 'import-resolver');
  markImportQueueResolved(id); closeModal(); toast('Baris ini diabaikan, data lama dipertahankan'); renderContent();
}
function resolveImportQueueCancel(id){
  markImportQueueResolved(id); closeModal(); toast('Item dibatalkan'); renderContent();
}

/* ============================================================
   15b. CENTRAL AUTH + MASTER DATA + MASTER API
   Google Account Authorization + Central Master Data READ-ONLY
   (Fase 3B-4 Step 5) + MasterAPI (Master Data Centralization).

   CentralMasterData = runtime cache hasil baca server (MasterDataRead.gs
   lewat ServerBridge), hilang saat reload. Satu salinan read-only di
   localStorage key BARU 'centralMasterDataCache' (terpisah dari key Store).

   MasterAPI (di bawah) = SATU-SATUNYA pintu BACA master data untuk UI:
   server dulu (CentralMasterData.ready), fallback ke Store lokal HANYA
   selama masa transisi. Store.loadX()/saveX() TETAP murni localStorage
   (dipakai jalur WRITE/import/seed/backup) - Store TIDAK PERNAH membaca
   CentralMasterData, dan MasterAPI TIDAK PERNAH menulis ke Store/server.
   ============================================================ */
const CentralAuth = { checked:false, authorized:false, email:'', role:null, unit:null, code:null, message:'' };
const CentralMasterData = { ready:false, loadedAt:null, students:null, guardians:null, components:null, tariffs:null, accounts:null, incomeCategories:null, expenseCategories:null, subcategories:null, academicYears:null, settings:null };
/* MasterAPI - READ ONLY. Mengembalikan salinan array (slice) sehingga
   pemanggil yang mengubah urutan/isi array tidak merusak cache. Nilai dari
   Sheets dinormalisasi ke tipe yang dipakai kode lama (string untuk id/nis/
   kelas/unit/dst, number untuk nominal/saldo) - hanya tampilan runtime,
   tidak pernah ditulis balik ke server maupun ke Store. */
const MasterAPI = (function(){
  const cache = {};
  const str = v => (v===null || v===undefined) ? '' : String(v);
  const num = v => { const n = Number(v); return isFinite(n) ? n : 0; };
  const normSiswa = r => Object.assign({}, r, {id:str(r.id), nama:str(r.nama), nis:str(r.nis), nisn:str(r.nisn), kelas:str(r.kelas), unit:str(r.unit),
    tahunAjaran:str(r.tahunAjaran), jenisKelamin:str(r.jenisKelamin), waliId:str(r.waliId), namaWali:str(r.namaWali), kontakWali:str(r.kontakWali),
    tanggalMasuk:str(r.tanggalMasuk), tanggalKeluar:str(r.tanggalKeluar), status:str(r.status)||'Aktif'});
  const normGuardian = r => Object.assign({}, r, {id:str(r.waliId), waliId:str(r.waliId), namaWali:str(r.namaWali), kontakWali:str(r.kontakWali)});
  const normKomponen = r => Object.assign({}, r, {id:str(r.id), nama:str(r.nama), unit:str(r.unit), frekuensi:str(r.frekuensi), status:str(r.status), aliasOf:str(r.aliasOf), sasaran:str(r.sasaran), basisTarif:str(r.basisTarif), menggantikan:str(r.menggantikan)});
  const normTarif = r => Object.assign({}, r, {id:str(r.id), komponenId:str(r.komponenId), unit:str(r.unit), kelas:str(r.kelas), tahunAjaran:str(r.tahunAjaran), nominal:num(r.nominal), status:str(r.status)});
  const normAkun = r => Object.assign({}, r, {id:str(r.id), nama:str(r.nama), jenis:str(r.jenis), saldoAwal:num(r.saldoAwal), status:str(r.status)});
  const normKategori = r => Object.assign({}, r, {id:str(r.id), kode:str(r.kode), kategori:str(r.kategori), status:str(r.status)});
  const normSub = r => Object.assign({}, r, {id:str(r.id), kategoriId:str(r.kategoriId), nama:str(r.nama), status:str(r.status)});
  const normTA = r => Object.assign({}, r, {id:str(r.id), label:str(r.label), status:str(r.status)});
  function fromServer(key, normalize){
    if(!(CentralMasterData.ready && Array.isArray(CentralMasterData[key]))) return null;
    const src = CentralMasterData[key];
    if(!cache[key] || cache[key].src !== src) cache[key] = {src:src, rows:src.map(normalize)};
    return cache[key].rows.slice();
  }
  return {
    students(){ return centralMasterOverlay_('siswa', fromServer('students', normSiswa)) || Store.loadSiswa(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    guardians(){ return fromServer('guardians', normGuardian) || Store.loadWali(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    components(){ return centralMasterOverlay_('komponen', fromServer('components', normKomponen)) || (Store.loadSettings().komponenBiayaList||[]); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    tariffs(){ return centralMasterOverlay_('tarif', fromServer('tariffs', normTarif)) || Store.loadTarif(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    accounts(){ return centralMasterOverlay_('akun', fromServer('accounts', normAkun)) || (Store.loadSettings().akunKasBankList||[]); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    incomeCategories(){ return centralMasterOverlay_('kategoriPenerimaan', fromServer('incomeCategories', normKategori)) || Store.loadKategoriPenerimaanMaster(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    expenseCategories(){ return centralMasterOverlay_('kategoriPengeluaran', fromServer('expenseCategories', normKategori)) || Store.loadKategoriPengeluaranMaster(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    subcategories(){ return centralMasterOverlay_('subkategori', fromServer('subcategories', normSub)) || Store.loadSubkategoriMaster(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    academicYears(){ return centralMasterOverlay_('tahunAjaran', fromServer('academicYears', normTA)) || Store.loadTahunAjaranMaster(); }, // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
    /* Tampilan BACA saja: pengaturan lokal (penuh) ditimpa key milik server. JANGAN
       diteruskan ke Store.saveSettings() - server baru memuat sebagian key. */
    settings(){
      const local = Store.loadSettings(); // TEMPORARY FALLBACK — REMOVE AFTER MASTER READ MIGRATION
      const srv = CentralMasterData.ready ? CentralMasterData.settings : null;
      return (srv && typeof srv === 'object') ? Object.assign({}, local, srv) : local;
    }
  };
})();
function kategoriPenerimaanNames(){ return MasterAPI.incomeCategories().filter(k=>k.status!=='Nonaktif').map(k=>k.kategori); }
function kategoriPengeluaranNames(){ return MasterAPI.expenseCategories().filter(k=>k.status!=='Nonaktif').map(k=>k.kategori); }
function masterSiswaRead(){ return MasterAPI.students(); }

/* ---- FCC core (identik dengan server) ---- */
/* FINANCIAL CONTROL CORE - kode IDENTIK dipakai di klien (Bendahara_V2.html) dan server (FinanceEngine.gs).
   Murni: tidak menyentuh DOM, Store, Sheets. Input = data mentah (baris sheet/objek lokal); output = struktur hasil.
   Definisi (ditulis eksplisit supaya tidak ada interpretasi diam-diam):
   ACTUAL      = transaksi aktual non-arsip (PENERIMAAN/PENGELUARAN) + saldo awal akun -> Actual Cash Position.
   COMMITTED   = komitmen berstatus COMMITTED (disetujui) dan INCURRED (terjadi, belum dibayar).
   PLANNED     = RAB/anggaran periode (08) dan pagu RKAT tahun periode (18).
   EXPECTED    = komitmen berstatus EXPECTED.
   MISSING     = RAB periode tanpa realisasi dan tanpa komitmen (biaya yang diharapkan tapi belum tercatat) + kategori data kosong.
   Completeness = persentase kategori data yang LENGKAP pada periode. Bila < 100 hasil BUKAN "surplus". */
var FCC_BULAN_ = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
function fccPeriodeOfDate_(tanggal) {
  var m = /^(\d{4})-(\d{2})/.exec(String(tanggal || ''));
  if (!m) return '';
  var mi = Number(m[2]) - 1;
  return (mi >= 0 && mi < 12) ? (FCC_BULAN_[mi] + ' ' + m[1]) : '';
}
function fccNum_(v) { var n = Number(v); return isFinite(n) ? n : 0; }
function fccCompute_(periode, D) {
  D = D || {};
  var alive = function (r) { return !r.archivedAt; };
  var trx = (D.transaksi || []).filter(alive), akun = (D.akun || []).filter(function (a) { return a.status !== 'Nonaktif'; });
  var ang = (D.anggaran || []).filter(alive), kom = (D.komitmen || []).filter(alive), rkat = (D.rkat || []).filter(alive), rekon = (D.rekonsiliasi || []).filter(alive);
  var inc = trx.filter(function (t) { return t.jenis === 'PENERIMAAN'; }), exp = trx.filter(function (t) { return t.jenis === 'PENGELUARAN'; });
  var inP = function (t) { return fccPeriodeOfDate_(t.tanggal) === periode; };
  var sum = function (arr, f) { return arr.reduce(function (s, x) { return s + fccNum_(f(x)); }, 0); };
  var nominal = function (x) { return x.nominal; };
  var cashByAccount = akun.map(function (a) {
    var masuk = sum(inc.filter(function (t) { return t.akunId === a.id; }), nominal), keluar = sum(exp.filter(function (t) { return t.akunId === a.id; }), nominal);
    return { akunId: a.id, nama: a.nama, jenis: a.jenis, saldo: fccNum_(a.saldoAwal) + masuk - keluar };
  });
  var cashPosition = sum(cashByAccount, function (c) { return c.saldo; });
  var byStatus = function (s) { return sum(kom.filter(function (o) { return o.status === s; }), nominal); };
  var committed = byStatus('COMMITTED'), incurred = byStatus('INCURRED'), expectedCost = byStatus('EXPECTED');
  var rabRows = ang.filter(function (a) { return a.periode === periode; });
  var year = (/\d{4}/.exec(String(periode || '')) || [''])[0];
  var rkatPagu = sum(rkat.filter(function (r) { return String(r.tahun) === year; }), function (r) { return r.pagu; });
  var missing = rabRows.filter(function (a) {
    var real = sum(exp.filter(function (t) { return t.kategori === a.program && inP(t); }), nominal);
    var kt = sum(kom.filter(function (o) { return o.rabId === a.id && (o.status === 'COMMITTED' || o.status === 'INCURRED'); }), nominal);
    return real + kt === 0;
  }).map(function (a) { return { id: a.id, program: a.program, nominal: fccNum_(a.nominal) }; });
  var cats = [
    ['Penerimaan', inc.length > 0, inc.some(inP)], ['Pengeluaran', exp.length > 0, exp.some(inP)],
    ['Anggaran/RAB', ang.length > 0, rabRows.length > 0], ['Rekonsiliasi', rekon.length > 0, rekon.some(function (r) { return r.periode === periode; })],
    ['Obligasi', kom.length > 0, kom.some(function (o) { return fccPeriodeOfDate_(o.tanggal) === periode; })]
  ];
  var checklist = cats.map(function (c) { return { kategori: c[0], status: c[2] ? 'LENGKAP' : (c[1] ? 'BELUM TERCATAT' : 'DATA BELUM TERSEDIA') }; });
  var pct = Math.round(checklist.filter(function (c) { return c.status === 'LENGKAP'; }).length / checklist.length * 100);
  var warnings = [];
  if (pct < 100) warnings.push('Data keuangan baru ' + pct + '% lengkap pada periode ini - angka di bawah adalah posisi AKTUAL, bukan surplus.');
  if (missing.length) warnings.push(missing.length + ' item RAB belum punya realisasi/komitmen (biaya yang diharapkan belum tercatat).');

  const upd = r=>{ r._syncError = centralErrText(res); r._syncAttempts = (r._syncAttempts || 0) + 1; if(permanent || r._syncAttempts >= 3) r._syncBlocked = true; };
  if(kind === 'trx'){ const arr = Store.loadTransaksi(); const i = arr.findIndex(x=>x.id===id); if(i>=0){ upd(arr[i]); Store.saveTransaksi(arr); } }
  else { const arr = Store.loadAlokasi(); const i = arr.findIndex(x=>x.id===id); if(i>=0){ upd(arr[i]); Store.saveAlokasi(arr); } }
  CentralSync.lastError = centralErrText(res);
  centralResultNote_(false, centralErrText(res));
}
function centralMarkTrxSynced_(t, serverId, sentAlk){
  const map = centralSyncMapGet(); map[t.id] = serverId; lsSet(lsKey('centralSyncMap'), map);
  const arr = Store.loadTransaksi(); const i = arr.findIndex(x=>x.id===t.id);
  if(i>=0){ arr[i]._synced = true; delete arr[i]._pendingSync; delete arr[i]._syncError; Store.saveTransaksi(arr); }
  centralResultNote_(true);
  const sentIds = new Set(sentAlk.map(a=>a.id));
  const al = Store.loadAlokasi(); let ch = false;
  al.forEach(a=>{ if(sentIds.has(a.id)){ a._synced = true; delete a._pendingSync; delete a._syncError; ch = true; } });
  if(ch) Store.saveAlokasi(al);
  [['dokumen', Store.loadDokumen, Store.saveDokumen], ['mutasiBank', Store.loadMutasiBank, Store.saveMutasiBank], ['lpj', Store.loadLpj, Store.saveLpj]].forEach(function(p){
    const rows = p[1].call(Store); let c = false;
    rows.forEach(r=>{ if(r.transaksiId === t.id){ r.transaksiId = serverId; c = true; } });
    if(c) p[2].call(Store, rows);
  });
  auditTrailPush('SYNC_TRANSAKSI_KE_SERVER', null, {localId:t.id, serverId:serverId}, 'central-sync');
}
function centralPushTrx_(t){
  if(t._syncBlocked) return Promise.resolve(false);
  const alk = Store.loadAlokasi().filter(a=>a.transaksiId===t.id && !a._synced);
  const payload = buildBridgePayloadFromTransaksi_(t);
  payload.clientRequestId = 'ui_' + t.id;
  if(t.jenis === 'PENERIMAAN' && alk.length){
    payload.allocations = alk.map(a=>({siswaId:a.siswaId, komponenId:a.komponenId, periode:a.periode||undefined, nominal:a.nominal, caraBayar:a.caraBayar||undefined, tagihanId:a.tagihanId||undefined}));
    const sis = new Set(alk.map(a=>a.siswaId));
    if(sis.size > 1) payload.siswaId = undefined; else if(!payload.siswaId) payload.siswaId = alk[0].siswaId;
  }
  const call = t.jenis === 'PENERIMAAN' ? ServerBridge.opCreateIncome : ServerBridge.opCreateExpense;
  return call(JSON.parse(JSON.stringify(payload))).then(function(res){
    if(res && res.ok && res.data && res.data.id){ centralMarkTrxSynced_(t, res.data.id, alk); return true; }
    centralMarkError_('trx', t.id, res); return false;
  });
}
function centralPushAlk_(a){
  if(a._syncBlocked) return Promise.resolve(false);
  const sid = centralResolveTrxId(a.transaksiId);
  if(!centralIsServerTrx(sid)) return Promise.resolve(false);
  const p = {transaksiId:sid, siswaId:a.siswaId, komponenId:a.komponenId, periode:a.periode||undefined, nominal:a.nominal, caraBayar:a.caraBayar||undefined, tagihanId:a.tagihanId||undefined, clientRequestId:'ui_' + a.id};
  return ServerBridge.opCreateAllocation(JSON.parse(JSON.stringify(p))).then(function(res){
    if(res && res.ok){
      const al = Store.loadAlokasi(); const i = al.findIndex(x=>x.id===a.id);
      if(i>=0){ al[i]._synced = true; delete al[i]._pendingSync; delete al[i]._syncError; Store.saveAlokasi(al); }
      centralResultNote_(true);
      return true;
    }
    centralMarkError_('alk', a.id, res); return false;
  });
}
function centralPushPatch_(id){
  const ov = centralOverlayGet(); const patch = ov[id];
  if(!patch || patch._pushed || patch._blocked) return Promise.resolve(false);
  const body = Object.assign({}, patch); delete body._pushed; delete body._blocked; delete body._error; delete body._expect; delete body._crid;
  const req = Object.assign({id:id}, body); // [P1-B/F] idempotensi + ekspektasi nilai (konflik terdeteksi server)
  if(patch._crid) req.clientRequestId = 'ui_' + patch._crid;
  if(patch._expect){ const ex = {}; Object.keys(body).forEach(k=>{ if(Object.prototype.hasOwnProperty.call(patch._expect, k)) ex[k] = patch._expect[k]; }); if(Object.keys(ex).length) req._expect = ex; }
  return ServerBridge.opUpdateTransaction(JSON.parse(JSON.stringify(req))).then(function(res){
    if(res && res.ok){ const o2 = centralOverlayGet(); if(o2[id]){ o2[id]._pushed = true; lsSet(lsKey('centralTrxOverlay'), o2); } centralResultNote_(true); return true; }
    CentralSync.lastError = centralErrText(res);
    centralResultNote_(false, centralErrText(res));
    // galat permanen (mis. TRANSACTION_ARCHIVED, validasi): tahan perubahan ini (tidak diulang tanpa henti) dan tampilkan di hitungan "gagal sinkron"
    if(!(res && CENTRAL_RETRYABLE_[res.code])){ const o3 = centralOverlayGet(); if(o3[id]){ o3[id]._blocked = true; o3[id]._error = centralErrText(res); lsSet(lsKey('centralTrxOverlay'), o3); } }
    return false;
  });
}
function centralCleanOverlay_(){
  if(!centralOpLoaded_('transaksi')) return;
  const ov = centralOverlayGet(); let ch = false;
  Object.keys(ov).forEach(k=>{ if(ov[k]._pushed){ delete ov[k]; ch = true; } });
  if(ch) lsSet(lsKey('centralTrxOverlay'), ov);
}
function centralPushTrxBatch_(list){
  if(!ServerBridge.opCreateTxBatch) return list.reduce((p,t)=>p.then(()=>centralPushTrx_(t)), Promise.resolve(false));
  const items = list.map(t=>{
    const alk = Store.loadAlokasi().filter(a=>a.transaksiId===t.id && !a._synced);
    const payload = buildBridgePayloadFromTransaksi_(t);
    payload.clientRequestId = 'ui_' + t.id;
    if(t.jenis === 'PENERIMAAN' && alk.length){
      payload.allocations = alk.map(a=>({siswaId:a.siswaId, komponenId:a.komponenId, periode:a.periode||undefined, nominal:a.nominal, caraBayar:a.caraBayar||undefined, tagihanId:a.tagihanId||undefined}));
      const sis = new Set(alk.map(a=>a.siswaId));
      if(sis.size > 1) payload.siswaId = undefined; else if(!payload.siswaId) payload.siswaId = alk[0].siswaId;
    }
    return {t:t, alk:alk, item:{kind:t.jenis === 'PENERIMAAN' ? 'income' : 'expense', payload:payload}};
  });
  return ServerBridge.opCreateTxBatch(JSON.parse(JSON.stringify(items.map(x=>x.item)))).then(function(res){
    if(!res || !res.ok || !res.data){ items.forEach(x=>centralMarkError_('trx', x.t.id, res)); return false; }
    let any = false;
    res.data.results.forEach(function(r, i){
      const x = items[i]; if(!x) return;
      if(r && r.ok && r.id){ centralMarkTrxSynced_(x.t, r.id, x.alk); any = true; }
      else centralMarkError_('trx', x.t.id, r || {code:'SERVER_ERROR', message:'tidak ada hasil'});
    });
    return any;
  });
}
/* [P0-B] Pencatatan & pelaporan hasil sinkron transaksi/alokasi/patch/arsip. */
function centralResultNote_(ok, err){ const r = CentralSync.result || (CentralSync.result = {ok:0, fail:0, err:''}); if(ok) r.ok++; else { r.fail++; if(err && !r.err) r.err = String(err); } }
function centralReportResult_(){
  const r = CentralSync.result || {ok:0, fail:0, err:''};
  if(!r.ok && !r.fail) return;
  globalThis.__centralAwaitConfirm = false;
  if(r.fail) toast('GAGAL menyimpan ' + r.fail + ' perubahan ke server: ' + (r.err || 'galat tidak diketahui') + '. Perubahan itu TIDAK dihitung sebagai transaksi resmi; periksa lalu coba lagi lewat tautan "tertunda".');
  else toast('Tersimpan di server (' + r.ok + ' perubahan dikonfirmasi).');
}
/* [P0-B] Alasan penulisan ditolak di klien bila server belum siap. */
function centralNotReadyText_(){
  if(typeof ServerBridge === 'undefined') return 'Server tidak terhubung (aplikasi tidak dibuka dari Apps Script) - data TIDAK disimpan.';
  if(!CentralAuth.authorized) return 'Akun belum terotorisasi (' + (CentralAuth.code || 'AUTH_REQUIRED') + ') - data TIDAK disimpan.';
  return 'Data server belum termuat atau gagal dimuat - data TIDAK disimpan. Coba lagi setelah data termuat.';
}
function centralSyncActive_(){ return centralTxWriteActive() || ccWriteActive_(); }
function centralAfterRefresh(fn){ CentralSync.after.push(fn); }
function centralRunSync(manual){
  if(!centralSyncActive_()) return Promise.resolve(false);
  if(CentralSync.running){ CentralSync.again = true; return Promise.resolve(false); }
  if(manual){
    const t = Store.loadTransaksi(); let c = false; t.forEach(x=>{ if(x._pendingSync && x._syncBlocked){ delete x._syncBlocked; x._syncAttempts = 0; c = true; } });
    if(c) Store.saveTransaksi(t);
    const a = Store.loadAlokasi(); c = false; a.forEach(x=>{ if(x._pendingSync && x._syncBlocked){ delete x._syncBlocked; x._syncAttempts = 0; c = true; } });
    if(c) Store.saveAlokasi(a);
    centralUnblockExtra_();
  }
  CentralSync.running = true; CentralSync.lastError = null; CentralSync.result = {ok:0, fail:0, err:''}; // [P0-B] CentralSync.refresh = new Set(); CentralSync.after = []; CentralSync.afterMaster = [];
  const jobs = [];
  centralMasterJobs_().forEach(j=>jobs.push(j));
  if(centralTxWriteActive()){
    const pt = centralPendingTrx_().filter(t=>!t._syncBlocked);
    for(let i = 0; i < pt.length; i += 20){ const chunk = pt.slice(i, i + 20); jobs.push(()=>centralPushTrxBatch_(chunk)); }
    Object.keys(centralOverlayGet()).forEach(id=>jobs.push(()=>centralPushPatch_(id)));
    centralArchiveJobs_().forEach(j=>jobs.push(j));
    centralPendingAlk_().forEach(a=>jobs.push(()=>centralPushAlk_(a)));
  }
  centralCollectionJobs_().forEach(j=>jobs.push(j));
  centralSettingsJobs_().forEach(j=>jobs.push(j));
  centralAuditJobs_().forEach(j=>jobs.push(j));
  let changed = false, chain = Promise.resolve();
  jobs.forEach(job=>{ chain = chain.then(job).then(function(r){ if(r) changed = true; }, function(e){ CentralSync.lastError = String((e && e.message) || e); }); });
  return chain.then(function(){
    CentralSync.lastRunAt = new Date().toISOString();
    if(changed){ CentralSync.refresh.add('transaksi'); CentralSync.refresh.add('alokasi'); }
    const keys = Array.from(CentralSync.refresh);
    return keys.length ? loadOperationalData(keys) : Promise.resolve();
  }).then(function(){
    CentralSync.after.forEach(fn=>{ try{ fn(); }catch(e){ console.error('after-refresh gagal:', e); } });
    centralCleanOverlay_(); centralCleanArchive_();
    return CentralSync.masterDirty ? loadCentralMasterData({skipOperational:true}) : null;
  }).then(function(){
    CentralSync.afterMaster.forEach(fn=>{ try{ fn(); }catch(e){ console.error('after-master gagal:', e); } });
    CentralSync.afterMaster = [];
    CentralSync.masterDirty = false; CentralSync.running = false;
    centralReportResult_(); // [P0-B]
    renderAuthStatusBadge();
    if(changed) centralRerenderIfIdle();
    if(CentralSync.again){ CentralSync.again = false; centralScheduleSync(); }
    return changed;
  });
}
/* Ubah atribut transaksi. Baris lokal murni -> ubah lokal (perilaku lama).
   Baris yang ada di server -> overlay tertunda lalu opUpdateTransaction. */
function centralPatchTransaksi(trxId, patch){
  const id = centralResolveTrxId(trxId);
  const arr = Store.loadTransaksi(); const li = arr.findIndex(t=>t.id===trxId);
  const serverSide = centralIsServerTrx(id);
  if(li >= 0 && !serverSide){
    const before = deepClone(arr[li]); Object.assign(arr[li], patch); Store.saveTransaksi(arr);
    return {before:before, after:arr[li]};
  }
  if(!serverSide || !centralTxWriteActive()) throw new Error('Transaksi tidak ditemukan');
  const cur = transaksiById(id); const before = deepClone(cur);
  const ov = centralOverlayGet(); const prev = ov[id] || {};
  /* [P1-F] _expect = nilai server yang DILIHAT sebelum field diubah (hanya diambil saat field pertama kali diubah);
     _crid = id permintaan (idempotensi) yang baru setiap kali isi patch berubah. */
  const expect = prev._pushed ? {} : Object.assign({}, prev._expect || {});
  Object.keys(patch).forEach(function(k){ if(!Object.prototype.hasOwnProperty.call(expect, k)) expect[k] = (cur[k] === undefined || cur[k] === null) ? '' : cur[k]; });
  ov[id] = Object.assign({}, prev, patch, {_expect:expect, _crid:uid('pt')}); delete ov[id]._pushed;
  lsSet(lsKey('centralTrxOverlay'), ov);
  globalThis.__centralAwaitConfirm = true; // [P0-B]
  centralScheduleSync();
  return {before:before, after:Object.assign({}, cur, patch)};
}

/* ---- WRITE (master): lewat server (validasi + lock + audit di server) ---- */
function centralMasterSave(key, id, data, okMsg){
  const rec = {};
  (MASTER_WRITE_FIELDS[key] || []).forEach(f=>{ if(data[f] !== undefined) rec[f] = data[f]; });
  if(id) rec.id = id;
  toast('Menyimpan ke Google Sheets...');
  return ServerBridge.opMasterUpsert(key, JSON.parse(JSON.stringify(rec))).then(function(res){
    if(!res || !res.ok){ toast('Gagal menyimpan: ' + centralErrText(res)); return false; }
    closeModal(); toast(okMsg + (res.auditWarning ? ' (peringatan: audit aktor gagal)' : ''));
    return loadCentralMasterData({skipOperational:true}).then(function(){ renderContent(); return true; });
  });
}
function centralMasterToggle(key, id, list, onMsg, offMsg){
  const cur = list.find(x=>x.id===id); if(!cur) return;
  const next = cur.status === 'Nonaktif' ? 'Aktif' : 'Nonaktif';

}

/* ---- konversi baris sheet <-> objek lokal ---- */
function ccFromRow_(name, r){
  const c = CC_[name];
  if(c.custom === 'tagihan'){
    if(!ccStr_(r.tagihanId)) return null;
    let pot = []; const ps = ccStr_(r.potongan);
    if(ps.charAt(0) === '['){ try{ pot = JSON.parse(ps); }catch(e){} }
    const k = komponenById(ccStr_(r.komponenId));
    return {id:ccStr_(r.id), siswaId:ccStr_(r.siswaId), komponen:k ? k.nama : ccStr_(r.komponenId), periode:ccStr_(r.periode), tagihanBruto:Number(r.bruto)||0, potongan:pot,
      tagihanNetto:Number(r.netto)||0, jatuhTempo:ccStr_(r.jatuhTempo), tahunAjaran:ccStr_(r.tahunAjaran), _computedAt:ccStr_(r.computedAt),
      kelas:ccStr_(r.kelas), unit:ccStr_(r.unit), tarifId:ccStr_(r.tarifId), tarifSatuan:(r.tarifSatuan === '' || r.tarifSatuan === undefined || r.tarifSatuan === null) ? null : Number(r.tarifSatuan), jumlahHari:(r.jumlahHari === '' || r.jumlahHari === undefined || r.jumlahHari === null) ? null : Number(r.jumlahHari)};
  }
  if(c.custom === 'importQueue'){
    try{ const p = JSON.parse(ccStr_(r.payload)); if(p && typeof p === 'object'){ p.id = ccStr_(r.id); return p; } }catch(e){}
    return {id:ccStr_(r.id), type:ccStr_(r.type), resolved:ccStr_(r.status) === 'RESOLVED'};
  }
  const o = Object.assign({}, r);
  delete o.archivedAt; delete o.archivedBy; delete o.archiveReason;
  (c.num || []).forEach(f=>{ if(o[f] !== undefined && o[f] !== '' && isFinite(Number(o[f]))) o[f] = Number(o[f]); });
  (c.nul || []).forEach(f=>{ if(o[f] === '') o[f] = null; });
  (c.json || []).forEach(f=>{ if(typeof o[f] === 'string' && o[f]){ try{ o[f] = JSON.parse(o[f]); }catch(e){} } });
  return o;
}
function ccToRow_(name, o, live){
  const c = CC_[name], dropped = [];
  live = live || [];
  if(c.custom === 'tagihan'){
    const k = komponenByNama(o.komponen);
    const row = {id:o.id, siswaId:o.siswaId, komponenId:k ? k.id : ccStr_(o.komponenId), periode:o.periode, bruto:Number(o.tagihanBruto)||0, potongan:JSON.stringify(o.potongan || []),
      netto:Number(o.tagihanNetto)||0, tagihanId:o.id, computedAt:o._computedAt || new Date().toISOString(), jatuhTempo:ccStr_(o.jatuhTempo), tahunAjaran:ccStr_(o.tahunAjaran)};
    // field tarif/hari yang dipakai: ikut ditulis bila kolomnya ada; bila ada nilai tapi kolom belum ada -> dropped (operasi diblokir sampai migrasi aditif, tidak hilang diam-diam)
    [['kelas', ccStr_(o.kelas)], ['unit', ccStr_(o.unit)], ['tarifId', ccStr_(o.tarifId)], ['tarifSatuan', o.tarifSatuan === null || o.tarifSatuan === undefined ? '' : Number(o.tarifSatuan)], ['jumlahHari', o.jumlahHari === null || o.jumlahHari === undefined ? '' : Number(o.jumlahHari)]].forEach(function(kv){
      if(live.length && live.indexOf(kv[0]) === -1){ if(kv[1] !== '') dropped.push(kv[0]); } else row[kv[0]] = kv[1];
    });
    return {row:row, dropped:dropped};
  }
  if(c.custom === 'importQueue'){
    return {row:{id:o.id, pairKey:ccStr_(o.pairKey), trxId1:ccStr_(o.trxId1), trxId2:ccStr_(o.trxId2), status:o.resolved ? 'RESOLVED' : 'PENDING', decidedAt:ccStr_(o.resolvedAt), decidedBy:'', type:ccStr_(o.type), payload:JSON.stringify(o)}, dropped:[]};
  }
  const row = {};
  Object.keys(o).forEach(function(k){
    if(k.charAt(0) === '_') return;
    if(live.length && live.indexOf(k) === -1){ dropped.push(k); return; }
    let v = o[k];
    if(v === null || v === undefined) v = '';
    else if((c.num || []).indexOf(k) !== -1 && v !== '' && isFinite(Number(v))) v = Number(v);
    else if(typeof v === 'object') v = JSON.stringify(v);
    row[k] = v;
  });
  return {row:row, dropped:dropped};
}

/* ---- tampilan = server + tertunda + legacy lokal ---- */
function ccSrv_(name){
  const st = ccState_(name), m = CC_MEM.memo[name];
  if(m && m.src === st.rows) return m;
  const objs = [], ids = new Set(), arch = new Set(), byId = new Map();
  st.rows.forEach(function(r){
    const id = ccStr_(r.id); if(!id) return;
    ids.add(id);
    if(ccStr_(r.archivedAt)){ arch.add(id); return; }
    const o = ccFromRow_(name, r); if(!o) return;

function ccPush_(name){

/* ---- data lokal lama: scan / migrasi / bersihkan (eksplisit, tidak otomatis) ---- */
function centralLegacyScan(){
  const rep = {rows:{}, transaksi:{pending:0, legacy:0, onServer:0, baru:0, dupKandidat:0}, alokasi:{legacy:0, baru:0}, masters:{}};
  Object.keys(CC_).forEach(function(name){
    if(!ccActive_(name)) return;
    const local = CC_ORIG_[name].load().filter(o=>o && o.id), m = ccSrv_(name), live = ccState_(name).headers || [];
    let same = 0, diff = 0, only = 0;
    local.forEach(function(o){
      if(m.ids.has(o.id)){ const so = m.byId.get(o.id); if(!so || JSON.stringify(ccToRow_(name, so, live).row) === JSON.stringify(ccToRow_(name, o, live).row)) same++; else diff++; }
      else only++;
    });
    rep.rows[name] = {local:local.length, same:same, diff:diff, baru:only};
  });
  if(centralOpLoaded_('transaksi')){
    const srv = OperationalAPI.transaksi().filter(t=>OperationalAPI.isServerTrx(t.id)), ids = new Set(srv.map(t=>t.id));
    const sig = t=>[t.jenis, t.tanggal, Number(t.nominal), t.akunId, t.siswaId || ''].join('|'), sigs = new Set(srv.map(sig));
    const map = centralSyncMapGet();
    Store.loadTransaksi().forEach(function(t){
      if(t._synced || map[t.id]) return;
      if(t.jenis !== 'PENERIMAAN' && t.jenis !== 'PENGELUARAN') return;
      if(t._pendingSync){ rep.transaksi.pending++; return; }
      if(ids.has(t.id)){ rep.transaksi.onServer++; return; }
      rep.transaksi.legacy++; rep.transaksi.baru++;
      if(sigs.has(sig(t))) rep.transaksi.dupKandidat++;
    });
    const aIds = new Set(OperationalAPI.alokasi().map(a=>a.id));
    Store.loadAlokasi().forEach(a=>{ if(a._synced || a._pendingSync) return; rep.alokasi.legacy++; if(!aIds.has(a.id)) rep.alokasi.baru++; });
  }
  const rawSet = lsGet(lsKey('settings'), {});
  const mm = [['siswa', 'students', Store.loadSiswa()], ['komponen', 'components', rawSet.komponenBiayaList || []], ['tarif', 'tariffs', Store.loadTarif()], ['akun', 'accounts', rawSet.akunKasBankList || []],
    ['kategoriPenerimaan', 'incomeCategories', Store.loadKategoriPenerimaanMaster()], ['kategoriPengeluaran', 'expenseCategories', Store.loadKategoriPengeluaranMaster()],
    ['subkategori', 'subcategories', Store.loadSubkategoriMaster()], ['tahunAjaran', 'academicYears', Store.loadTahunAjaranMaster()]];
  mm.forEach(function(x){
    if(!CentralMasterData.ready) return;
    const srvIds = new Set((CentralMasterData[x[1]] || []).map(r=>String(r.id !== undefined ? r.id : r.waliId)));
    const loc = (x[2] || []).filter(r=>r && r.id);
    rep.masters[x[0]] = {local:loc.length, onServer:loc.filter(r=>srvIds.has(String(r.id))).length, baru:loc.filter(r=>!srvIds.has(String(r.id))).length};
  });
  CC_MEM.legacy = rep; return rep;
}
function centralLegacyMigrate(opts){
  opts = opts || {};
  const rep = centralLegacyScan(), done = {rows:0, transaksi:0, alokasi:0, masters:0, dupDilewati:0};
  Object.keys(CC_).forEach(function(name){
    if(!ccActive_(name)) return;
    const local = CC_ORIG_[name].load().filter(o=>o && o.id), m = ccSrv_(name);
    const only = local.filter(o=>!m.ids.has(o.id));
    if(only.length){ ccSave_(name, ccView_(name), true); done.rows += only.length; } // ccSave_ mempromosikan baris lokal baru menjadi operasi tertunda
  });
  if(centralOpLoaded_('transaksi')){
    const srv = OperationalAPI.transaksi().filter(t=>OperationalAPI.isServerTrx(t.id)), ids = new Set(srv.map(t=>t.id));
    const sig = t=>[t.jenis, t.tanggal, Number(t.nominal), t.akunId, t.siswaId || ''].join('|'), sigs = new Set(srv.map(sig));
    const map = centralSyncMapGet(), arr = Store.loadTransaksi(), flagged = new Set();
    arr.forEach(function(t){
      if(t._synced || map[t.id] || t._pendingSync || ids.has(t.id)) return;
      if(t.jenis !== 'PENERIMAAN' && t.jenis !== 'PENGELUARAN') return;
      if(sigs.has(sig(t)) && !opts.includeDup){ done.dupDilewati++; return; }
      t._pendingSync = true; flagged.add(t.id); done.transaksi++;
    });
    Store.saveTransaksi(arr);
    const al = Store.loadAlokasi(); al.forEach(a=>{ if(flagged.has(a.transaksiId) && !a._synced){ a._pendingSync = true; done.alokasi++; } }); Store.saveAlokasi(al);
  }
  if(CentralMasterData.ready){
    const rawSet = lsGet(lsKey('settings'), {});
    const mm = [['siswa', 'students', Store.loadSiswa()], ['komponen', 'components', rawSet.komponenBiayaList || []], ['tarif', 'tariffs', Store.loadTarif()], ['akun', 'accounts', rawSet.akunKasBankList || []],
      ['kategoriPenerimaan', 'incomeCategories', Store.loadKategoriPenerimaanMaster()], ['kategoriPengeluaran', 'expenseCategories', Store.loadKategoriPengeluaranMaster()],
      ['subkategori', 'subcategories', Store.loadSubkategoriMaster()], ['tahunAjaran', 'academicYears', Store.loadTahunAjaranMaster()]];
    mm.forEach(function(x){
      const srvIds = new Set((CentralMasterData[x[1]] || []).map(r=>String(r.id)));
      (x[2] || []).forEach(function(r){ if(r && r.id && !srvIds.has(String(r.id))){ centralMasterQueue_(x[0], String(r.id), r); done.masters++; } });
    });
  }
  auditTrailPush('MIGRASI_DATA_LOKAL_KE_PUSAT', null, {scan:rep, hasil:done}, 'central-migrate');
  centralScheduleSync();
  return {scan:rep, done:done};
}
function centralLegacyClean(){
  const removed = {rows:0, transaksi:0, alokasi:0, masters:0};
  Object.keys(CC_).forEach(function(name){
    if(!ccActive_(name)) return;
    const local = CC_ORIG_[name].load(), m = ccSrv_(name), pend = ccPend_(name);
    const keepRows = local.filter(o=>!(o && o.id && m.ids.has(o.id) && !pend[o.id]));
    removed.rows += local.length - keepRows.length;
    if(keepRows.length !== local.length) CC_ORIG_[name].save(keepRows);
  });
  if(centralOpLoaded_('transaksi')){
    const map = centralSyncMapGet(), ids = new Set(OperationalAPI.transaksi().filter(t=>OperationalAPI.isServerTrx(t.id)).map(t=>t.id));
    const t0 = Store.loadTransaksi(), t1 = t0.filter(t=>!((t._synced && map[t.id]) || (ids.has(t.id) && !t._pendingSync)));
    removed.transaksi = t0.length - t1.length; if(t1.length !== t0.length) Store.saveTransaksi(t1);
    const a0 = Store.loadAlokasi(), aIds = new Set(OperationalAPI.alokasi().filter(a=>OperationalAPI.isServerAlokasi(a.id)).map(a=>a.id));
    const a1 = a0.filter(a=>!(a._synced || (aIds.has(a.id) && !a._pendingSync)));
    removed.alokasi = a0.length - a1.length; if(a1.length !== a0.length) Store.saveAlokasi(a1);
  }
  if(CentralMasterData.ready){
    const sets = [['siswa', 'students', Store.loadSiswa, Store.saveSiswa], ['tarif', 'tariffs', Store.loadTarif, Store.saveTarif], ['kategoriPenerimaan', 'incomeCategories', Store.loadKategoriPenerimaanMaster, Store.saveKategoriPenerimaanMaster],
      ['kategoriPengeluaran', 'expenseCategories', Store.loadKategoriPengeluaranMaster, Store.saveKategoriPengeluaranMaster], ['subkategori', 'subcategories', Store.loadSubkategoriMaster, Store.saveSubkategoriMaster], ['tahunAjaran', 'academicYears', Store.loadTahunAjaranMaster, Store.saveTahunAjaranMaster]];
    sets.forEach(function(x){
      const srvIds = new Set((CentralMasterData[x[1]] || []).map(r=>String(r.id))), pend = ccMasterPend_(x[0]);
      const l0 = x[2].call(Store), l1 = l0.filter(r=>!(r && srvIds.has(String(r.id)) && !pend[r.id]));
      removed.masters += l0.length - l1.length; if(l1.length !== l0.length) x[3].call(Store, l1);
    });
  }
  auditTrailPush('BERSIHKAN_SALINAN_LOKAL', null, removed, 'central-migrate');
  return removed;
}

/* ---- kewajiban: verifikasi server vs klien, snapshot ---- */
function centralVerifyObligations(periode){
  /* Tanpa argumen: bandingkan periode aktif + SEMUA kewajiban non-bulanan (Tahun Ajaran / SekaliBayar) supaya tarif tahunan, biaya masuk,
     katering per hari, klasifikasi, dan riwayat beku ikut diverifikasi klien vs server. Dengan argumen: satu periode saja. */
  const aktif = Store.loadSettings().periodeAktif, scope = periode ? (p=>p === periode) : (p=>p === aktif || !fccIsMonthLabel_(p));
  if(!ServerBridge || !ServerBridge.opObligations) return Promise.resolve({ok:false, message:'opObligations belum tersedia'});
  return ServerBridge.opObligations(periode ? {periode:periode} : {}).then(function(res){
    if(!res || !res.ok) return {ok:false, message:centralErrText(res)};
    const cli = {};
    allObligationsAllSiswa(periode || undefined).filter(ob=>scope(ob.periode)).forEach(ob=>{ cli[ob.key] = {bruto:Number(ob.bruto) || 0, netto:Number(ob.netto) || 0, terbayar:alokasiTerbayar(ob), sisa:sisaObligation(ob), hari:ob.jumlahHari === undefined ? null : ob.jumlahHari}; });
    const diffs = [], srvKeys = new Set(); let nSrv = 0;
    res.data.rows.filter(r=>scope(r.periode)).forEach(function(r){
      nSrv++; srvKeys.add(r.key); const c = cli[r.key];
      if(!c) diffs.push({key:r.key, jenis:'HANYA_DI_SERVER'});
      else {
        ['bruto', 'netto', 'terbayar', 'sisa'].forEach(f=>{ if(Math.abs(c[f] - r[f]) > 0.5) diffs.push({key:r.key, jenis:'BEDA_' + f, klien:c[f], server:r[f]}); });
        if((c.hari === null ? null : Number(c.hari)) !== (r.jumlahHari === null || r.jumlahHari === undefined ? null : Number(r.jumlahHari))) diffs.push({key:r.key, jenis:'BEDA_jumlahHari', klien:c.hari, server:r.jumlahHari});
      }
    });
    Object.keys(cli).forEach(k=>{ if(!srvKeys.has(k)) diffs.push({key:k, jenis:'HANYA_DI_KLIEN'}); });
    return {ok:true, periode:periode || (aktif + ' + semua non-bulanan'), jumlahServer:nSrv, jumlahKlien:Object.keys(cli).length, diffs:diffs, totalsServer:res.data.totals};
  });
}
function centralSnapshotKpi(periode){
  periode = periode || Store.loadSettings().periodeAktif;
  const summary = kpiIndukSummary(periode), now = new Date().toISOString(), safe = periode.replace(/[^A-Za-z0-9]+/g, '_');
  if(summary.dataUnavailable) throw new Error('KPI ' + KPI_DATA_UNAVAILABLE_ + ' (' + summary.alasan.join('; ') + ') - snapshot TIDAK disimpan.'); // [P0-D] tidak menyimpan skor palsu
  const arr = Store.loadKpiSnapshot();
  summary.rows.forEach(function(r){
    const row = {id:'kpi_' + safe + '_' + r.kode, periode:periode, kpiKode:r.kode, indikatorKode:'', skor:r.skor == null ? '' : r.skor, status:r.status, computedAt:now};
    const i = arr.findIndex(x=>x.id === row.id);
    if(i >= 0){ if(arr[i].skor === row.skor && arr[i].status === row.status) return; arr[i] = row; } else arr.push(row);
  });
  Store.saveKpiSnapshot(arr);
  auditTrailPush('SNAPSHOT_KPI', null, {periode:periode, jumlah:summary.rows.length}, 'manual');
  return summary.rows.length;
}

function centralFccVerify(){
  const out = document.getElementById('fccVerifyOut'); if(out) out.textContent = 'Memeriksa…';

}

function freezeObligationsFor_(opts){
  opts = opts || {};
  const komSet = opts.komponenIds ? new Set(opts.komponenIds) : null, idSet = opts.siswaIds ? new Set(opts.siswaIds) : null, perSet = opts.periods ? new Set(opts.periods) : null;
  const arr = Store.loadTagihan(); let n = 0;
  MasterAPI.students().forEach(function(s){
    if(idSet && !idSet.has(s.id)) return;
    if(!opts.onlyWithAllocations && (s.status || 'Aktif') !== 'Aktif') return;
    kewajibanForSiswa(s.id).forEach(function(ob){
      if(ob.tagihanId || !(ob.bruto > 0)) return;
      if(komSet && !komSet.has(ob.komponenId)) return;
      if(perSet && !perSet.has(ob.periode)) return;
      if(opts.onlyWithAllocations && !(alokasiTerbayar(ob) > 0)) return;
      arr.push(tagihanSnapshotRow_(ob, s)); n++;
    });
  });
  if(n) Store.saveTagihan(arr);
  return n;
}

function tarifAudit_(){
  const out = {hariKosong:[], belumDiklasifikasi:0, tanpaTarifSpp:[], jumlahSiswa:0};
  const ta = Store.loadSettings().tahunAjaranAktif, aktif = parsePeriodeLabel(Store.loadSettings().periodeAktif), months = tpMonthsOfTa_(ta);
  const hari = Store.loadCateringHari() || {};
  const hasKat = MasterAPI.components().some(k=>k.basisTarif === 'PER_HARI_TERJADWAL' && k.status !== 'Nonaktif');
  if(hasKat){
    months.forEach(function(m){ const pm = parsePeriodeLabel(m); if(pm.year > aktif.year || (pm.year === aktif.year && pm.monthIdx > aktif.monthIdx)) return; if(hari['MI|' + m] === undefined) out.hariKosong.push(m); });
  }
  const sasaran = MasterAPI.components().filter(k=>k.sasaran && k.sasaran !== 'SEMUA' && k.status !== 'Nonaktif');
  const cls = Store.loadPendaftaranStatus() || [];
  MasterAPI.students().filter(s=>(s.status || 'Aktif') === 'Aktif').forEach(function(s){
    out.jumlahSiswa++;
    const punya = sasaran.some(k=>!k.unit || k.unit === s.unit);
    if(punya && !cls.some(x=>x.siswaId === s.id && x.tahunAjaran === (s.tahunAjaran || ta))) out.belumDiklasifikasi++;
    const spp = MasterAPI.components().find(k=>k.id === 'kmp_spp');
    if(spp && tarifFor('kmp_spp', s.unit, tingkatFromKelas(s.kelas), s.tahunAjaran || ta) <= 0) out.tanpaTarifSpp.push(s.nama + ' (' + s.unit + ' ' + s.kelas + ')');
  });
  return out;
}

function anggaranValidate_(d){
  if(!d.program) return 'Program/Uraian wajib diisi';
  if(!d.periode) return 'Periode wajib diisi';
  if(!(Number(d.nominal) > 0)) return 'Nominal harus lebih dari 0';
  if(d.unit !== 'TK' && d.unit !== 'MI') return 'Unit (TK/MI) wajib dipilih';
  if(d.jenis === 'PEMASUKAN'){
    const k = MasterAPI.components().find(x=>x.id === d.komponenId);
    if(!k) return 'Anggaran PEMASUKAN wajib terhubung ke komponen penerimaan';
    if(k.unit && k.unit !== d.unit) return 'Komponen ' + k.nama + ' hanya berlaku untuk unit ' + k.unit;
    if(d.kategori || d.subkategori) return 'Anggaran PEMASUKAN tidak memakai kategori/subkategori pengeluaran';
  } else {
    const kt = MasterAPI.expenseCategories().find(x=>x.kategori === d.kategori);
    if(!kt) return 'Anggaran PENGELUARAN wajib terhubung ke kategori pengeluaran';
    if(d.subkategori){ const sk = MasterAPI.subcategories().find(x=>x.nama === d.subkategori && x.kategoriId === kt.id); if(!sk) return 'Subkategori bukan milik kategori ' + d.kategori; }
    if(d.komponenId) return 'Anggaran PENGELUARAN tidak memakai komponen penerimaan';
  }
  return '';
}

/* ---- validasi alokasi: total per kewajiban dalam satu permintaan tidak boleh melebihi sisa; kewajiban harus ada ---- */
function validateAllocationBatch(list){
  const grup = new Map(), cache = {};
  for(let i = 0; i < list.length; i++){
    const l = list[i];
    if(!l.nominal || l.nominal <= 0) continue;
    const sid = l.ob.siswaId;
    if(!cache[sid]) cache[sid] = kewajibanForSiswa(sid);
    const cur = cache[sid].find(o=>o.key === l.ob.key);
    if(!cur) return {ok:false, msg:'Kewajiban ' + esc(l.ob.komponenNama) + ' ' + esc(l.ob.periode) + ' tidak ditemukan (tarif/periode/klasifikasi tidak berlaku)'};
    const g = grup.get(cur.key) || {ob:cur, total:0};
    g.total += Number(l.nominal); grup.set(cur.key, g);
  }
  for(const g of grup.values()){
    const sisa = sisaObligation(g.ob);
    if(g.total > sisa + 0.5) return {ok:false, msg:'Total alokasi (' + fmtRp(g.total) + ') melebihi sisa kewajiban ' + esc(g.ob.komponenNama) + ' ' + esc(g.ob.periode) + ' (' + fmtRp(sisa) + ')'};
  }
  return {ok:true};
}

  const siswaAktif = MasterAPI.students().filter(s=>(s.status||'Aktif')==='Aktif' && (!komponen.unit||s.unit===komponen.unit) && komponenSasaranOk(s, komponen));
  const existing = Store.loadTagihan();
  let dibuat=0, sudahAda=0, tanpaTarif=0, hariKosong=0, digantikan=0;
  siswaAktif.forEach(s=>{
    if(existing.some(t=>t.siswaId===s.id && t.periode===periode && t.komponen===komponenNama)){ sudahAda++; return; }
    if(komponenDigantikan(s, komponen, periode)){ digantikan++; return; }
    const ob = kewajibanSatuBaris(s, komponen, periode); // snapshot dari nilai computed saat ini
    if(ob.hariBelumDiisi){ hariKosong++; return; }
    if(!(ob.bruto>0)){ tanpaTarif++; return; }
    const row = tagihanSnapshotRow_(ob, s); row.jatuhTempo = jt;
    existing.push(row);
    dibuat++;
  });
  Store.saveTagihan(existing);
  auditTrailPush('TERBITKAN_TAGIHAN_SNAPSHOT', null, {periode,komponen:komponenNama,dibuat,sudahAda,tanpaTarif,hariKosong,digantikan}, 'manual');
  toast('Snapshot diterbitkan: '+dibuat+' baru, '+sudahAda+' sudah ada'+(tanpaTarif?(', '+tanpaTarif+' tanpa tarif dilewati'):'')+(hariKosong?(', '+hariKosong+' menunggu hari katering diisi'):'')+(digantikan?(', '+digantikan+' diganti kewajiban lump beku'):'')); renderContent();
}
/* Naik tahun ajaran / pindah tahun ajaran: kewajiban siswa tahun ajaran lama DIBEKUKAN dulu agar tidak dihitung ulang dengan kelas/tarif baru. */
function studentFreezeBeforeChange_(siswaId, nv){
  const cur = MasterAPI.students().find(s=>s.id===siswaId);
  if(!cur || !nv || !nv.tahunAjaran || String(nv.tahunAjaran) === String(cur.tahunAjaran || '')) return 0;
  const n = freezeObligationsFor_({siswaIds:[siswaId], onlyWithAllocations:true});
  const n2 = freezeObligationsFor_({siswaIds:[siswaId]}); // sisanya (belum dibayar) juga dibekukan: utang tahun lama tetap dengan tarif tahun lama
  if(n + n2) auditTrailPush('BEKU_KEWAJIBAN_SEBELUM_PINDAH_TA', {siswaId:siswaId, tahunAjaran:cur.tahunAjaran, kelas:cur.kelas}, {tahunAjaran:nv.tahunAjaran, dibekukan:n + n2}, 'otomatis');
  return n + n2;
}
function komponenExtraFields_(id){
  const cur = id ? (MasterAPI.components().find(x=>x.id === id) || {}) : {}, out = {};
  [['sasaran', 'kmf_sasaran'], ['basisTarif', 'kmf_basis'], ['menggantikan', 'kmf_ganti']].forEach(function(p){
    const v = String(val(p[1]) || '').trim();
    if(v !== '' || String(cur[p[0]] || '') !== '') out[p[0]] = v; // kolom hanya dikirim bila perlu (hindari galat sebelum migrasi aditif)
  });
  return out;
}
function renderAuthStatusBadge(){
  const el = document.getElementById('authStatusBadge');
  if(!el) return;
  if(!CentralAuth.checked){ el.innerHTML = '<span style="color:#888">&#9679; Memeriksa akses Google Account&hellip;</span>'; return; }
  if(typeof ServerBridge === 'undefined'){ el.innerHTML = '<span style="color:#888">&#9679; ServerBridge tidak termuat (mode lokal)</span>'; return; }
  if(CentralAuth.code === 'NOT_IN_APPS_SCRIPT'){ el.innerHTML = '<span style="color:#888">&#9679; Bukan Apps Script HTML Service (mode lokal)</span>'; return; }
  if(CentralAuth.authorized){
    const label = esc(CentralAuth.email) + ' &middot; ' + esc(CentralAuth.role||'-') + (CentralAuth.unit?(' &middot; '+esc(CentralAuth.unit)):'') +
      (CentralMasterData.ready ? ' &middot; Master Data server OK' : ' &middot; memuat Master Data&hellip;') + centralStatusSuffix();
    el.innerHTML = '<span style="color:#2e7d32">&#9679; Terautentikasi</span> &nbsp;' + label;
    return;
  }
  const MSG = {
    AUTH_REQUIRED: 'Sesi Google tidak terdeteksi - login/akses diperlukan.',
    USER_NOT_FOUND: 'Akun Google ini belum diberi akses (belum terdaftar).',
    USER_INACTIVE: 'Akses akun ini tidak aktif.',
    ROLE_NOT_ALLOWED: 'Role akun ini tidak sesuai untuk akses ini.',
    SERVER_ERROR: 'Gagal menghubungi server.'
  };
  el.innerHTML = '<span style="color:#c62828">&#9679; Tidak terautentikasi</span> &nbsp;<span class="small-muted">' + esc(MSG[CentralAuth.code] || CentralAuth.message || CentralAuth.code || '') + '</span>';
}

/* Master Data HANYA dimuat kalau authorization PASS (Tugas 9: authorization
   gagal -> server data TIDAK PERNAH dianggap berhasil dimuat). Semua 10
   panggilan READ-ONLY, tidak ada satu pun yang menulis. */
function loadCentralMasterData(opts){
  opts = opts || {};
  if(!CentralAuth.authorized || typeof ServerBridge === 'undefined') return Promise.resolve(false);
  const keys = ['students','guardians','components','tariffs','accounts','incomeCategories','expenseCategories','subcategories','academicYears','settings'];
  return Promise.all([
    ServerBridge.getStudents(), ServerBridge.getGuardians(), ServerBridge.getComponents(),
    ServerBridge.getTariffs(), ServerBridge.getAccounts(), ServerBridge.getIncomeCategories(),
    ServerBridge.getExpenseCategories(), ServerBridge.getSubcategories(), ServerBridge.getAcademicYears(),
    ServerBridge.getSettings()
  ]).then(function(results){
    let allOk = true;
    results.forEach(function(r){ if(!(r && r.ok && r.code==='SUCCESS')) allOk = false; });
    if(allOk){
      results.forEach(function(r, i){ CentralMasterData[keys[i]] = r.data; });
      CentralMasterData.ready = true;
      CentralMasterData.loadedAt = new Date().toISOString();
      try{ lsSet(lsKey('centralMasterDataCache'), CentralMasterData); }catch(e){ console.error('centralMasterDataCache gagal disimpan (non-fatal):', e); }
    }
    renderAuthStatusBadge();
    if(allOk && !opts.skipOperational){
      return loadOperationalData().then(function(){ centralRerenderIfIdle(); centralScheduleSync(); return true; });
    }
    return allOk;
  });
}

/* TIDAK blocking - renderShell()/init() lama tetap jalan identik dulu,
   bootstrap ini menyusul async dan HANYA mengubah #authStatusBadge +
   CentralMasterData runtime, tidak pernah menyentuh render lain. */
function bootstrapCentralAuth(){
  globalThis.__appBooted = true; // [P0-B] setelah titik ini, tulis koleksi tanpa server ditolak
  renderAuthStatusBadge();
  if(typeof ServerBridge === 'undefined'){ CentralAuth.checked = true; renderAuthStatusBadge(); return; }
  ServerBridge.getCurrentUserIdentity().then(function(result){
    CentralAuth.checked = true;
    CentralAuth.authorized = !!(result && result.authorized);
    CentralAuth.email = (result && result.email) || '';
    CentralAuth.role = (result && result.role) || null;
    CentralAuth.unit = (result && result.unit) || null;
    CentralAuth.code = (result && result.code) || null;
    CentralAuth.message = (result && result.message) || '';
    renderAuthStatusBadge();
    if(CentralAuth.authorized) loadCentralMasterData();
  });
}
