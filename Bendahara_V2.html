<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bendahara V2 - Darul Arifin</title>
<style>
:root{
  --bg:#f4f6f8; --panel:#ffffff; --border:#dde3ea; --text:#1f2937; --muted:#6b7280;
  --primary:#1d4ed8; --primary-dark:#1e3a8a; --green:#15803d; --red:#b91c1c; --amber:#b45309;
  --green-bg:#ecfdf5; --red-bg:#fef2f2; --amber-bg:#fffbeb; --blue-bg:#eff6ff;
  --radius:8px; --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;}
#app{display:flex;min-height:100vh;}
#sidebar{width:220px;background:var(--primary-dark);color:#fff;flex-shrink:0;display:flex;flex-direction:column;}
#sidebar .brand{padding:16px;font-weight:700;font-size:15px;border-bottom:1px solid rgba(255,255,255,.15);}
#sidebar .brand small{display:block;font-weight:400;font-size:11px;opacity:.7;margin-top:2px;}
#navlist{list-style:none;margin:0;padding:8px 0;flex:1;overflow-y:auto;}
#navlist li{padding:10px 16px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;opacity:.85;}
#navlist li:hover{background:rgba(255,255,255,.08);}
#navlist li.active{background:var(--primary);opacity:1;font-weight:600;}
#main{flex:1;display:flex;flex-direction:column;min-width:0;}
#topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;justify-content:space-between;align-items:center;}
#topbar .title{font-size:16px;font-weight:700;}
#topbar .sub{font-size:12px;color:var(--muted);}
#content{flex:1;padding:18px 20px;overflow-y:auto;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
.card h3{margin:0 0 10px;font-size:14px;}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.tile{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;}
.tile .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}
.tile .value{font-size:19px;font-weight:700;margin-top:4px;}
.tile.warn{background:var(--amber-bg);border-color:#fde68a;}
.tile.bad{background:var(--red-bg);border-color:#fecaca;}
.tile.good{background:var(--green-bg);border-color:#bbf7d0;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:12px;flex-wrap:wrap;}
.tabs button{background:none;border:none;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;}
.tabs button.active{color:var(--primary);border-color:var(--primary);font-weight:600;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap;}
th{background:#f8fafc;font-weight:600;color:var(--muted);position:sticky;top:0;}
tr:hover td{background:#f8fafc;}
.tablewrap{overflow-x:auto;max-height:60vh;overflow-y:auto;}
.btn{display:inline-block;padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12.5px;color:var(--text);}
.btn:hover{background:#f1f5f9;}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.btn.primary:hover{background:var(--primary-dark);}
.btn.danger{color:var(--red);border-color:#fecaca;}
.btn.sm{padding:3px 8px;font-size:11.5px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;}
.badge.gray{background:#f1f5f9;color:#475569;}
.badge.green{background:var(--green-bg);color:var(--green);}
.badge.red{background:var(--red-bg);color:var(--red);}
.badge.amber{background:var(--amber-bg);color:var(--amber);}
.badge.blue{background:var(--blue-bg);color:var(--primary);}
.filterbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;align-items:flex-end;}
.filterbar-visible{background:var(--blue-bg);border:1px solid #bfdbfe;border-radius:var(--radius);padding:10px 12px;margin-bottom:12px;position:sticky;top:0;z-index:5;}
.filter-status-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid var(--primary);color:var(--primary);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;}
.chip a{cursor:pointer;color:var(--primary);font-weight:700;text-decoration:none;}
.field{display:flex;flex-direction:column;gap:3px;}
.field label{font-size:11px;color:var(--muted);}
.field input,.field select,.field textarea{padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:inherit;}
.field textarea{resize:vertical;}
.grid{display:grid;gap:10px;}
.grid.cols-2{grid-template-columns:1fr 1fr;}
.grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
#modalOverlay{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:100;}
#modalOverlay.open{display:flex;}
.modal{background:#fff;border-radius:10px;max-width:640px;width:100%;padding:20px;}
.modal.wide{max-width:980px;}
.modal h3{margin-top:0;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.kv{display:grid;grid-template-columns:160px 1fr;gap:4px 10px;font-size:12.5px;}
.kv div:nth-child(odd){color:var(--muted);}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;margin:14px 0 6px;}
.pill-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pill-nav button{border:1px solid var(--border);background:#fff;padding:4px 10px;border-radius:20px;font-size:11.5px;cursor:pointer;}
.pill-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
.empty{color:var(--muted);font-style:italic;padding:16px;text-align:center;}
.actionqueue-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.actionqueue-item:last-child{border-bottom:none;}
.right{text-align:right;}
a.link{color:var(--primary);cursor:pointer;text-decoration:none;}
a.link:hover{text-decoration:underline;}
#toast{position:fixed;bottom:20px;right:20px;background:#1f2937;color:#fff;padding:10px 16px;border-radius:8px;font-size:12.5px;display:none;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.2);}
.small-muted{font-size:11.5px;color:var(--muted);}
.print-header-block{display:none;}

/* PATCH MASTER section 34/35: Print layout khusus - HANYA laporan yang
   tercetak (tidak ada sidebar/menu/tombol/filter/navigasi/kontrol UI),
   A4, orientasi otomatis (landscape untuk tabel lebar lewat class
   .print-landscape yang ditambahkan render laporan bila kolom banyak),
   header tabel berulang tiap halaman, page number di footer. */
@media print{
  @page{ size:A4 portrait; margin:14mm 12mm; }
  @page landscape{ size:A4 landscape; margin:12mm 14mm; }
  body{ background:#fff !important; font-size:11px; }
  #sidebar, #topbar, #toast, .no-print, .filterbar, .pill-nav, .tabs, .modal-actions, button, .btn, a.link{ display:none !important; }
  #modalOverlay{ position:static; background:none; padding:0; display:none; }
  #app{ display:block; }
  #main{ display:block; }
  #content{ padding:0; overflow:visible; }
  .card{ box-shadow:none; border:none; padding:0; margin-bottom:10px; page-break-inside:avoid; }
  .tablewrap{ max-height:none; overflow:visible; }
  table{ page-break-inside:auto; width:100%; }
  tr{ page-break-inside:avoid; }
  thead{ display:table-header-group; } /* repeat header tabel tiap halaman */
  tfoot{ display:table-footer-group; }
  /* Cetak DARI DALAM MODAL (mis. Resi/Detail Penerimaan) - modal ITU laporan
     yang dicetak, halaman di belakangnya (termasuk #app) disembunyikan.
     Ditandai lewat body.printing-modal (lihat markPrintTarget() di JS). */
  body.printing-modal > #app{ display:none !important; }
  body:not(.printing-modal) #modalOverlay{ display:none !important; }
  body.printing-modal #modalOverlay{ display:block !important; position:static; }
  body.printing-modal .modal{ max-width:none; box-shadow:none; padding:0; }
  .print-landscape{ page:landscape; }
  .print-footer{ position:fixed; bottom:0; left:0; right:0; text-align:center; font-size:9px; color:#6b7280; }
  .print-header-block{ display:block; text-align:center; margin-bottom:10px; }
  .print-header-block .yayasan{ font-weight:700; font-size:13px; }
  .print-header-block .unit{ font-size:11px; }
  .print-header-block .judul{ font-weight:700; font-size:13px; margin-top:4px; }
}
</style>
</head>

<script>
/* ============================================================

   Arsitektur: ACTUAL -> IDENTIFY -> ALLOCATE -> RECONCILE -> REPORT -> KPI
   One ledger (Transaksi+Alokasi), 8 halaman utama, KPI read-only.
   ============================================================ */

/* ---------- 0. CORE HELPERS ---------- */
const APP_PREFIX = 'draBendaharaV2_';
function lsKey(name){ return APP_PREFIX + name; }
function lsGet(key, fallback){ try{ const v = localStorage.getItem(key); return v===null ? fallback : JSON.parse(v); }catch(e){ return fallback; } }
function lsSet(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){ console.error('lsSet failed', key, e); throw new Error('Penyimpanan browser gagal (' + key + '): ' + ((e && e.message) || e)); } } /* [P0-B] galat tidak ditelan */
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtRp(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID',{maximumFractionDigits:0}); }
function fmtDate(iso){ if(!iso) return '-'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function BULAN_ID_LIST(){ return ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember']; }
function currentPeriodeLabel(){ const d=new Date(); return BULAN_ID_LIST()[d.getMonth()]+' '+d.getFullYear(); }
function tahunAjaranForDate(d){ d=d||new Date(); const y=d.getFullYear(), m=d.getMonth(); return (m>=6? y : y-1)+'/'+(m>=6? y+1 : y); }
/* [P0-B] Selama ada penulisan yang belum dikonfirmasi server, pesan sukses tidak boleh menyatakan "tersimpan". */
function centralToastText_(msg){
  try{
    const s = String(msg == null ? '' : msg);
    if(!globalThis.__centralAwaitConfirm) return s;
    if(/gagal|tidak |menunggu konfirmasi|server/i.test(s)) return s;
    return s.replace(/\btersimpan\b/gi, 'dikirim').replace(/berhasil dicatat/gi, 'dikirim') + ' \u2014 menunggu konfirmasi server\u2026';
  }catch(e){ return msg; }
}
function toast(msg){ msg = centralToastText_(msg); const t=document.getElementById('toast'); t.textContent=msg; t.style.display='block'; clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>{t.style.display='none';},2400); }
function auditTrailPush(aksi, dataSebelum, dataSesudah, sumber){
  const arr = Store.loadAuditTrail();
  arr.push({id:uid('audit'), tanggal:new Date().toISOString(), user:Store.loadSettings().namaBendahara||'Bendahara', aksi, dataSebelum:dataSebelum||null, dataSesudah:dataSesudah||null, sumber:sumber||'manual'});
  Store.saveAuditTrail(arr);
  ccAuditEnqueue_(aksi, dataSebelum, dataSesudah, sumber);
}

/* ---------- 2b. SEED INITIALIZATION (section 43/44: idempotent, additive-
   only, ID stabil - tidak pernah menduplikasi ataupun menghidupkan lagi
   baris yang sengaja dihapus/dinonaktifkan user). Dipanggil sekali per
   koleksi per ID seed: begitu satu ID pernah "diproses" (baik akhirnya
   tetap ada atau sudah dihapus user), ID itu tidak pernah dicek ulang -
   sehingga hapus/nonaktifkan oleh user bersifat PERMANEN, sementara seed
   BARU yang ditambahkan pada patch berikutnya (ID belum pernah diproses)
   tetap otomatis masuk sekali. ---------- */
function applySeedOnce(collectionName, seedList, loadFn, saveFn){
  const appliedAll = Store.loadSeedApplied();
  const applied = new Set(appliedAll[collectionName]||[]);
  const existing = loadFn();
  const existingIds = new Set(existing.map(x=>x.id));
  let changed = false;
  seedList.forEach(seed=>{
    if(applied.has(seed.id)) return;
    applied.add(seed.id);
    if(!existingIds.has(seed.id)){ existing.push(deepClone(seed)); changed = true; }
  });
  if(changed) saveFn(existing);
  appliedAll[collectionName] = Array.from(applied);
  Store.saveSeedApplied(appliedAll);
}
/* Kategori LAMA (string bebas di Settings, dari versi sebelum patch ini atau
   sudah dipakai transaksi histori) dilebur satu kali sebagai record LEGACY
   ke master terstruktur supaya tidak pernah hilang dari pilihan (section 18:
   "jangan hard delete kategori yang sudah dipakai transaksi"). */
function legacyMergeKategoriOnce(collectionName, existingNames, loadFn, saveFn, idPrefix){
  const appliedAll = Store.loadSeedApplied();
  const key = collectionName+'_legacy';
  if(appliedAll[key]) return;
  const master = loadFn();
  const knownLower = new Set(master.map(k=>String(k.kategori||'').toLowerCase()));
  let changed = false;
  (existingNames||[]).forEach(nama=>{
    const n = String(nama||'').trim();
    if(!n || knownLower.has(n.toLowerCase())) return;
    master.push({id:idPrefix+'_'+n.replace(/[^a-zA-Z0-9]+/g,'_').toUpperCase(), kode:'', kategori:n, status:'Aktif'});
    knownLower.add(n.toLowerCase());
    changed = true;
  });
  if(changed) saveFn(master);
  appliedAll[key] = true;
  Store.saveSeedApplied(appliedAll);
}

    _migratedFromV1Id: s.id||null
  }));
  Store.saveSiswa(siswaOut);
  report.siswa = siswaOut.length;
  const findSiswaId = (name, kelas) => { const f = siswaOut.find(x=>x.nama===name && (!kelas||x.kelas===kelas)); return f?f.id:null; };

  const tagihanOut = v1Spp.map(s=>{
    const sid = s.siswaId || findSiswaId(s.namaSiswa, s.kelas);
    return {
      id: s.id||uid('tagihan'), siswaId:sid, siswaNamaSnapshot:s.namaSiswa||'', komponen:s.komponen||'SPP',

    };

  Store.saveTagihan(tagihanOut);
  report.tagihan = tagihanOut.length;

  const transaksiOut = [];
  const alokasiOut = [];
  const akunDefault = Store.loadSettings().akunKasBankList[0].id;

  v1Pembayaran.forEach(p=>{
    const tId = uid('trx');
    transaksiOut.push({
      id:tId, jenis:'PENERIMAAN', tanggal:p.tanggal||p.tglBayar||todayISO(), noTransaksi:p.noResi||p.id||'',
      sumber:'Pembayaran Siswa', akunId:akunDefault, nominal:Number(p.nominal||0), metode:p.metode||'Tunai',
      status: (p.alokasi&&p.alokasi.length)? 'SELESAI':'TERIDENTIFIKASI', buktiId:p.buktiId?[p.buktiId]:[],
      catatan:p.catatan||'', _migratedFromV1:'pembayaran'
    });
    (p.alokasi||[]).forEach(al=>{
      alokasiOut.push({id:uid('alk'), transaksiId:tId, siswaId:al.studentId||al.siswaId||null, tagihanId:al.tagihanId||null, komponenId:null, nominal:Number(al.nominal||0), createdAt:p.tanggal||todayISO()});
    });
  });
  v1Pemasukan.forEach(p=>{
    transaksiOut.push({
      id:uid('trx'), jenis:'PENERIMAAN', tanggal:p.tanggal||todayISO(), noTransaksi:p.referensi||'',
      sumber:p.kategori||'Penerimaan Lain', akunId:akunDefault, nominal:Number(p.nominal||p.penerimaan||0),
      metode:p.metode||'Tunai', status:'TERCATAT', buktiId:p.bukti?[p.bukti]:[], catatan:p.uraian||'',
      _migratedFromV1:'pemasukan'
    });
  });
  v1Pengeluaran.forEach(p=>{
    transaksiOut.push({
      id:uid('trx'), jenis:'PENGELUARAN', tanggal:p.tanggal||todayISO(), noTransaksi:p.noBukti||'',
      kategori:p.kategori||'Lainnya', subkategori:p.subkategori||'', penerima:p.penerima||'',
      akunId:akunDefault, nominal:Number(p.nominal||0), metode:p.metodePembayaran||'Tunai',
      status:(p.buktiId? 'SELESAI':'TERCATAT'), buktiId:p.buktiId?[p.buktiId]:[], catatan:p.keterangan||'',
      _migratedFromV1:'pengeluaran'
    });
  });
  Store.saveTransaksi(transaksiOut);
  Store.saveAlokasi(alokasiOut);
  report.penerimaan = transaksiOut.filter(t=>t.jenis==='PENERIMAAN').length;
  report.pengeluaran = transaksiOut.filter(t=>t.jenis==='PENGELUARAN').length;

  Store.saveMutasiBank(v1MutasiBank.map(m=>({id:m.id||uid('mut'), tanggal:m.tanggal||'', nominal:Number(m.nominal||0), keterangan:m.keterangan||'', status:m.status||'BELUM_DIPROSES', transaksiId:m.transaksiId||null})));
  report.mutasiBank = v1MutasiBank.length;

  Store.saveObligasi(v1Obligasi.map(o=>({id:o.id||uid('oblg'), uraian:o.uraian||o.deskripsi||'', nominal:Number(o.nominal||0), status:o.status||'EXPECTED', rabId:o.rabId||null, transaksiId:o.transaksiId||null, tanggal:o.tanggal||''})));
  report.obligasi = v1Obligasi.length;

  Store.saveDokumen(v1Documents.map(d=>({id:d.id||uid('dok'), kategori:d.kategori||d.tipe||'Lainnya', transaksiId:d.transaksiId||d.pembayaranId||null, fileRef:d.fileRef||'', judul:d.judul||d.nomor||'', tanggal:d.tanggal||''})));
  report.dokumen = v1Documents.length;

  const s2 = Store.loadSettings();
  if(v1Settings.sekolah) s2.sekolah = v1Settings.sekolah;
  if(v1Settings.yayasan) s2.yayasan = v1Settings.yayasan;
  if(v1Settings.namaBendahara) s2.namaBendahara = v1Settings.namaBendahara;
  if(v1Settings.kepalaSekolah) s2.namaKepalaSekolah = v1Settings.kepalaSekolah;
  if(v1Settings.tahunAjaranAktif) s2.tahunAjaranAktif = v1Settings.tahunAjaranAktif;
  if(Array.isArray(v1Settings.kategoriPengeluaranList)) s2.kategoriPengeluaranList = v1Settings.kategoriPengeluaranList;
  if(Array.isArray(v1Settings.rekeningList)){
    s2.akunKasBankList = v1Settings.rekeningList.map((nm,i)=>({id:'akun_'+i, nama:nm, jenis:/bank/i.test(nm)?'Bank':'Kas', saldoAwal:0}));
  }
  s2.keringananPolicyList = (v1ReliefPolicies||[]).map(p=>({id:p.id||uid('krg'), nama:p.nama||'', labelDokumen:p.labelDokumen||p.nama||'', tipe:p.tipe||'FIXED', nilai:Number(p.nilai||0), stackable:!!p.stackable}));
  report.keringanan = s2.keringananPolicyList.length;
  Store.saveSettings(s2);

  lsSet(lsKey('migratedFromV1'), true);
  auditTrailPush('MIGRASI_V1_KE_V2', null, report, 'migrateV1ToV2');
  return report;
}

   4. LEDGER ENGINE (LAYER 1/2 - satu-satunya sumber kebenaran)

/* [P0-B] Baris lokal yang belum dikonfirmasi server (antre/gagal) BUKAN transaksi resmi: tidak masuk total, saldo, laporan, KPI.
   transaksiById() tetap menemukannya agar alur alokasi berjalan sampai server mengonfirmasi. */
function centralIsUnconfirmedTrx_(t){ return !!(t && t._pendingSync && !t._synced); }
function allTransaksi(){ return OperationalAPI.transaksi().filter(t=>!t.archivedAt && !centralIsUnconfirmedTrx_(t)); }
function transaksiById(id){ const sid = centralResolveTrxId(id); return OperationalAPI.transaksi().find(t=>t.id===sid)||null; }
function penerimaanList(){ return allTransaksi().filter(t=>t.jenis==='PENERIMAAN'); }
function pengeluaranList(){ return allTransaksi().filter(t=>t.jenis==='PENGELUARAN'); }
function transferList(){ return allTransaksi().filter(t=>t.jenis==='TRANSFER'); }
function alokasiForTransaksi(trxId){ const sid = centralResolveTrxId(trxId); return OperationalAPI.alokasi().filter(a=>a.transaksiId===sid); }
function alokasiForTagihan(tagihanId){ return OperationalAPI.alokasi().filter(a=>a.tagihanId===tagihanId); }

function akunList(){ return MasterAPI.accounts(); }
function akunSaldo(akunId, asOf){
  const akun = akunList().find(a=>a.id===akunId);
  if(!akun) return 0;
  let saldo = Number(akun.saldoAwal||0);
  allTransaksi().forEach(t=>{
    if(asOf && t.tanggal>asOf) return;
    if(t.jenis==='PENERIMAAN' && t.akunId===akunId) saldo += Number(t.nominal||0);
    else if(t.jenis==='PENGELUARAN' && t.akunId===akunId) saldo -= Number(t.nominal||0);
    else if(t.jenis==='TRANSFER'){
      if(t.akunId===akunId) saldo -= Number(t.nominal||0);
      if(t.akunTujuanId===akunId) saldo += Number(t.nominal||0);
    }
  });
  return saldo;
}
function totalSaldoKas(asOf){ return akunList().filter(a=>a.jenis==='Kas').reduce((s,a)=>s+akunSaldo(a.id,asOf),0); }
function totalSaldoBank(asOf){ return akunList().filter(a=>a.jenis==='Bank').reduce((s,a)=>s+akunSaldo(a.id,asOf),0); }
function totalSaldoAktual(asOf){ return totalSaldoKas(asOf)+totalSaldoBank(asOf); }

/* Patch: Rp0 = migration artifact, TIDAK BOLEH masuk hitungan aktif manapun
   (KPI, total, rekonsiliasi, antrian kerja) - tapi TIDAK dihapus, hanya
   disingkirkan dari perhitungan sampai di-Archive lewat AuditTrail. */
function isMigrationArtifact(t){ return Number(t.nominal||0)===0; }
function penerimaanListReal(){ return penerimaanList().filter(t=>!isMigrationArtifact(t)); }
function pengeluaranListReal(){ return pengeluaranList().filter(t=>!isMigrationArtifact(t)); }
function totalPemasukan(periodeFilter){ return penerimaanListReal().filter(t=>!periodeFilter||periodeOfDate(t.tanggal)===periodeFilter).reduce((s,t)=>s+Number(t.nominal||0),0); }
function totalPengeluaran(periodeFilter){ return pengeluaranListReal().filter(t=>!periodeFilter||periodeOfDate(t.tanggal)===periodeFilter).reduce((s,t)=>s+Number(t.nominal||0),0); }
function periodeOfDate(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return ''; return BULAN_ID_LIST()[d.getMonth()]+' '+d.getFullYear(); }

/* --- Status alokasi computed (Patch: 1 transaksi = banyak siswa/komponen/
   sebagian/kelebihan bayar - status TIDAK boleh biner "identified=allocated").
   TERCATAT: siswa/sumber belum diketahui sama sekali.
   TERIDENTIFIKASI: sumber sudah diketahui, belum ada alokasi sama sekali.
   SEBAGIAN_TERALOKASI: sudah ada alokasi tapi < nominal, DAN siswa terkait
     masih punya kewajiban lain yang bisa dialokasikan lebih lanjut.
   OVERPAYMENT_CREDIT: sisa belum dialokasi TAPI siswa terkait sudah tidak
     punya kewajiban tersisa - sisa adalah kredit/kelebihan bayar nyata,
     BUKAN pekerjaan yang belum selesai.
   TERALOKASI: seluruh nominal sudah dialokasikan (sisa<=0). --- */
function computeTransaksiAllocationStatus(trxId){
  const t = transaksiById(trxId);
  if(!t) return 'TERCATAT';
  const alok = alokasiForTransaksi(trxId);
  const sudah = alok.reduce((s,a)=>s+Number(a.nominal||0),0);
  const sisa = Number(t.nominal||0)-sudah;
  if(!t.siswaId && !alok.length) return 'TERCATAT';
  if(sudah<=0.5) return 'TERIDENTIFIKASI';
  if(sisa<=0.5) return 'TERALOKASI';
  const siswaIds = Array.from(new Set(alok.map(a=>a.siswaId).concat(t.siswaId?[t.siswaId]:[]).filter(Boolean)));
  const masihAdaKewajiban = siswaIds.some(sid=>kewajibanForSiswa(sid).some(o=>sisaObligation(o)>0));
  return masihAdaKewajiban ? 'SEBAGIAN_TERALOKASI' : 'OVERPAYMENT_CREDIT';
}

/* --- Belum Diproses / work-queue primitives (Layer 4 reads Layer 1/2 only) --- */
function penerimaanBelumTeridentifikasi(){ return penerimaanListReal().filter(t=>t.status==='TERCATAT'); }
function penerimaanSebagianTeralokasi(){ return penerimaanListReal().filter(t=>t.status==='SEBAGIAN_TERALOKASI'); }
function penerimaanBelumDialokasi(){ return penerimaanListReal().filter(t=>t.status==='TERIDENTIFIKASI'); }
function penerimaanKelebihanBayar(){ return penerimaanListReal().filter(t=>t.status==='OVERPAYMENT_CREDIT'); }
function pembayaranBelumDialokasi(){ return penerimaanListReal().filter(t=>['TERIDENTIFIKASI','SEBAGIAN_TERALOKASI'].includes(t.status)); }
function transaksiBelumDirekonsiliasi(){ return allTransaksi().filter(t=>!isMigrationArtifact(t) && t.status!=='SELESAI'); }
function migrationArtifactTransaksi(){ return allTransaksi().filter(isMigrationArtifact); }
function mutasiBankBelumDiproses(){ return Store.loadMutasiBank().filter(m=>m.status==='BELUM_DIPROSES'); }
function pengeluaranTanpaBukti(){ return pengeluaranListReal().filter(t=>!(t.buktiId&&t.buktiId.length)); }
function transaksiTanpaBukti(){ return allTransaksi().filter(t=>!isMigrationArtifact(t) && t.jenis!=='TRANSFER' && !(t.buktiId&&t.buktiId.length)); }
function transaksiBelumDiverifikasi(){ return allTransaksi().filter(t=>!isMigrationArtifact(t) && (t.status==='TERCATAT'||t.status==='TERIDENTIFIKASI')); }

/* --- KEWAJIBAN COMPUTED (Patch01): Siswa x Komponen x Tarif x Periode - Keringanan.
   TagihanSnapshot (Store.loadTagihan) HANYA dokumen resmi opsional, tidak pernah jadi syarat. --- */
function komponenById(id){ return MasterAPI.components().find(k=>k.id===id); }
function komponenByNama(nama){ return MasterAPI.components().find(k=>k.nama===nama); }
/* PENTING: TIDAK difilter oleh status Nonaktif di sini - dipakai juga oleh
   kewajibanForSiswa untuk enumerasi SELURUH kewajiban (termasuk histori).
   Menonaktifkan komponen tidak boleh membuat tunggakan lama dari komponen
   itu tiba-tiba hilang dari perhitungan (section 42: histori tetap aman).
   Untuk UI pemilihan komponen BARU (checklist Catat Penerimaan, form Tarif,
   Terbitkan Tagihan), pakai komponenSelectableForUnit() di bawah. */
function komponenApplicableForUnit(unit){ return MasterAPI.components().filter(k=>!k.unit||k.unit===unit); }
function komponenSelectableForUnit(unit){ return komponenApplicableForUnit(unit).filter(k=>k.status!=='Nonaktif'); }
/* Nama rombel siswa (mis. "3 Syeikh Abdul Shomad Jambi") selalu diawali angka
   tingkat/kelasnya di data sekolah ini - dipakai sebagai kunci tarif berjenjang
   tanpa memaksa admin mendaftarkan tarif per NAMA ROMBEL satu-satu (belasan
   nama berbeda per tingkat). Rombel TK (mis. "Madinah") tidak diawali angka -
   hasilnya '' (kosong), otomatis jatuh ke tarif wildcard (tanpa kelas). */
function tingkatFromKelas(kelas){
  const m = String(kelas||'').trim().match(/^(\d+)/);
  return m ? m[1] : '';
}
/* kelas OPSIONAL pada baris Tarif (Patch: SPP MI bertingkat per kelas, mis.
   kelas 1=350rb, kelas 2=300rb, kelas lain=250rb - tarif flat per unit saja
   tidak cukup). Baris tanpa kelas/unit/tahunAjaran = wildcard (berlaku untuk
   semua). Kalau ada beberapa baris yang cocok, pilih yang PALING SPESIFIK
   (kelas > unit > tahunAjaran), bukan sekadar baris pertama ditemukan. */
function tarifRowFor(komponenId, unit, kelas, tahunAjaran){
  const rows = MasterAPI.tariffs().filter(t=>t.komponenId===komponenId && t.status!=='Nonaktif' && (!t.unit||t.unit===unit) && (!t.kelas||t.kelas===kelas) && (!t.tahunAjaran||t.tahunAjaran===tahunAjaran));
  if(!rows.length) return null;
  const scored = rows.map(t=>({t, score:(t.kelas?4:0)+(t.unit?2:0)+(t.tahunAjaran?1:0)}));
  scored.sort((a,b)=>b.score-a.score);
  return scored[0].t;
}
function tarifFor(komponenId, unit, kelas, tahunAjaran){
  const t = tarifRowFor(komponenId, unit, kelas, tahunAjaran);
  return t ? Number(t.nominal||0) : 0;
}
/* Jumlah hari katering TERJADWAL per unit+periode (diisi manual oleh Bendahara; tagihan TIDAK bergantung kehadiran siswa).
   null = belum diisi -> kewajiban katering periode itu belum bisa dihitung (tidak ada nilai bawaan). */
function cateringHariFor(unit, periode){
  const m = Store.loadCateringHari() || {};
  const v = m[unit+'|'+periode];
  if(v===undefined || v===null || v==='') return null;
  const n = Number(v);
  return (isFinite(n) && n>=0) ? n : null;
}
/* Klasifikasi pendaftaran siswa per tahun ajaran: 'BARU' | 'DAFTAR_ULANG' | '' (belum/tidak diklasifikasi). Selalu eksplisit, tidak pernah ditebak. */
function pendaftaranStatusFor(siswaId, tahunAjaran){
  const r = (Store.loadPendaftaranStatus()||[]).find(x=>x.siswaId===siswaId && x.tahunAjaran===tahunAjaran);
  return r ? String(r.jenis||'') : '';
}
function komponenSasaranOk(siswa, k){
  const s = k.sasaran||'';
  if(!s || s==='SEMUA') return true;
  return pendaftaranStatusFor(siswa.id, siswa.tahunAjaran||Store.loadSettings().tahunAjaranAktif)===s;
}
/* Komponen rincian "menggantikan" komponen lump lama. Jika siswa sudah punya kewajiban BEKU (snapshot) atas komponen lump itu
   (artinya pembayaran historis menempel ke sana), rincian TIDAK ditagihkan lagi supaya tidak terjadi tagihan ganda. */
function komponenDigantikan(siswa, k, periode){
  const ids = String(k.menggantikan||'').split(',').map(s=>s.trim()).filter(Boolean);
  if(!ids.length) return false;
  const comps = MasterAPI.components();
  const ta = String(siswa.tahunAjaran||Store.loadSettings().tahunAjaranAktif);
  const monthly = k.frekuensi==='Bulanan';
  return Store.loadTagihan().some(t=>{
    if(t.siswaId!==siswa.id) return false;
    const kk = comps.find(c=>c.nama===t.komponen);
    if(!kk || ids.indexOf(kk.id)===-1) return false;
    return monthly ? t.periode===periode : String(t.tahunAjaran||'')===ta;
  });
}
function kewajibanSatuBaris(siswa, komponen, periode){
  const tingkat = tingkatFromKelas(siswa.kelas);
  const tr = tarifRowFor(komponen.id, siswa.unit, tingkat, siswa.tahunAjaran);
  const satuan = tr ? Number(tr.nominal||0) : 0;
  const perHari = komponen.basisTarif==='PER_HARI_TERJADWAL';
  const hari = perHari ? cateringHariFor(siswa.unit, periode) : null;
  const bruto = perHari ? (hari===null ? 0 : satuan*hari) : satuan;
  const {potongan, perluReview} = keringananPotonganFor(siswa.id, komponen.id, bruto);
  const totalPotongan = potongan.reduce((s,p)=>s+p.nominal,0);
  const nettoComputed = Math.max(0, bruto-totalPotongan);
  const snap = Store.loadTagihan().find(t=>t.siswaId===siswa.id && t.komponen===komponen.nama && t.periode===periode);
  return {
    key: siswa.id+'|'+komponen.id+'|'+periode, siswaId:siswa.id, komponenId:komponen.id, komponenNama:komponen.nama, periode,
    bruto: snap? Number(snap.tagihanBruto!=null?snap.tagihanBruto:bruto) : bruto,
    potongan: snap? (snap.potongan&&snap.potongan.length?snap.potongan:potongan) : potongan,
    netto: snap? Number(snap.tagihanNetto!=null?snap.tagihanNetto:nettoComputed) : nettoComputed,
    tagihanId: snap? snap.id : null, jatuhTempo: snap? snap.jatuhTempo : '', perluReview: !!perluReview,
    _legacyPembayaran: snap? Number(snap._legacyPembayaran||0) : 0,
    /* tarif + jumlah hari yang DIPAKAI disimpan pada kewajiban beku; snapshot lama tanpa field ini -> null (tidak diketahui, tidak ditebak) */
    tarifId: snap? (snap.tarifId||'') : (tr? tr.id : ''),
    tarifSatuan: snap? ((snap.tarifSatuan!==undefined && snap.tarifSatuan!==null && snap.tarifSatuan!=='') ? Number(snap.tarifSatuan) : null) : satuan,
    jumlahHari: snap? ((snap.jumlahHari!==undefined && snap.jumlahHari!==null && snap.jumlahHari!=='') ? Number(snap.jumlahHari) : null) : hari,
    hariBelumDiisi: !snap && perHari && hari===null
  };
}
function kewajibanForSiswa(siswaId, periodeFilter){
  const siswa = MasterAPI.students().find(s=>s.id===siswaId);
  if(!siswa) return [];
  const out = [], seen = new Set();
  const push = ob=>{ if(seen.has(ob.key)) return; seen.add(ob.key); out.push(ob); };
  komponenApplicableForUnit(siswa.unit).forEach(k=>{
    if(!komponenSasaranOk(siswa, k)) return;
    if(k.frekuensi==='Bulanan'){
      enumeratePeriodesBulanan(siswa).forEach(p=>{
        if(komponenDigantikan(siswa, k, p)) return;
        const ob = kewajibanSatuBaris(siswa, k, p);
        if(ob.bruto>0 || ob.tagihanId) push(ob);
      });
    } else {
      if(komponenDigantikan(siswa, k, '')) return;
      const p = k.frekuensi==='Tahunan' ? ('Tahun Ajaran '+(siswa.tahunAjaran||Store.loadSettings().tahunAjaranAktif)) : 'SekaliBayar';
      const ob = kewajibanSatuBaris(siswa, k, p);
      if(ob.bruto>0 || ob.tagihanId) push(ob);
    }
  });
  /* Riwayat: kewajiban BEKU milik siswa ini yang tidak lagi tercakup enumerasi (naik kelas / pindah tahun ajaran / komponen nonaktif / klasifikasi berubah)
     tetap ditampilkan apa adanya, supaya pembayaran historis tidak menjadi yatim. */
  const komps = MasterAPI.components();
  Store.loadTagihan().filter(t=>t.siswaId===siswaId).forEach(t=>{
    const k = komps.find(c=>c.nama===t.komponen);
    if(!k || seen.has(siswaId+'|'+k.id+'|'+t.periode)) return;
    push(kewajibanSatuBaris(siswa, k, t.periode));
  });
  return periodeFilter ? out.filter(o=>o.periode===periodeFilter) : out;
}
/* Identitas kewajiban = siswa + komponen + periode (kunci yang sama untuk satu kewajiban). tagihanId hanya mempercepat bila keduanya ada.
   Alokasi yang dibuat SEBELUM kewajiban dibekukan (tanpa tagihanId) tetap terhitung setelah pembekuan; nominal yang sama pada komponen lain TIDAK pernah cocok. */
function resolveObligationMatch(alokasi, ob){
  if(alokasi.tagihanId && ob.tagihanId && alokasi.tagihanId===ob.tagihanId) return true;
  return alokasi.siswaId===ob.siswaId && alokasi.komponenId===ob.komponenId && alokasi.periode===ob.periode;
}
function keringananPotonganFor(siswaId, komponenId, bruto){
  const now = todayISO();
  const assigns = Store.loadKeringananAssignment().filter(a=>a.siswaId===siswaId && (!a.komponenId||a.komponenId===komponenId) && (!a.berlakuMulai||a.berlakuMulai<=now) && (!a.berlakuSampai||a.berlakuSampai>=now));
  if(!assigns.length) return {potongan:[], perluReview:false};
  const policies = Store.loadSettings().keringananPolicyList||[];
  const resolved = assigns.map(a=>({assign:a, policy:policies.find(p=>p.id===a.policyId)})).filter(x=>x.policy);
  const nonStackable = resolved.filter(x=>!x.policy.stackable);
  if(nonStackable.length>1) return {potongan:[], perluReview:true};
  const list = nonStackable.length ? nonStackable : resolved;
  const potongan = list.map(x=>{
    const nominal = x.policy.tipe==='PERCENTAGE' ? Math.round(bruto*Number(x.policy.nilai||0)/100) : Number(x.policy.nilai||0);
    return {policyId:x.policy.id, label:x.policy.labelDokumen||x.policy.nama, nominal:Math.min(nominal,bruto)};
  });
  return {potongan, perluReview:false};
}
function parsePeriodeLabel(label){ const parts=String(label||'').split(' '); return {monthIdx: BULAN_ID_LIST().indexOf(parts[0]), year: parseInt(parts[1],10)}; }
function periodeLabelFromYM(y, mi){ return BULAN_ID_LIST()[mi]+' '+y; }
function tahunAjaranStartYear(ta){ return parseInt(String(ta||'').split('/')[0],10)||new Date().getFullYear(); }
function enumeratePeriodesBulanan(siswa){
  const ta = siswa.tahunAjaran || Store.loadSettings().tahunAjaranAktif;
  let startY = tahunAjaranStartYear(ta), startM = 6; // Juli
  if(siswa.tanggalMasuk){ const d=new Date(siswa.tanggalMasuk+'T00:00:00'); if(!isNaN(d) && (d.getFullYear()>startY || (d.getFullYear()===startY&&d.getMonth()>startM))){ startY=d.getFullYear(); startM=d.getMonth(); } }
  const aktif = parsePeriodeLabel(Store.loadSettings().periodeAktif);
  let endY = aktif.year, endM = aktif.monthIdx;
  if(isNaN(endM)){ const t=new Date(); endY=t.getFullYear(); endM=t.getMonth(); }
  if(siswa.tanggalKeluar){ const dk=new Date(siswa.tanggalKeluar+'T00:00:00'); if(!isNaN(dk) && (dk.getFullYear()<endY || (dk.getFullYear()===endY&&dk.getMonth()<endM))){ endY=dk.getFullYear(); endM=dk.getMonth(); } }
  const out=[]; let y=startY, m=startM, guard=0;
  while((y<endY || (y===endY && m<=endM)) && guard<240){ out.push(periodeLabelFromYM(y,m)); m++; if(m>11){m=0;y++;} guard++; }
  return out;
}
function periodeAdvance(label, n){
  const ym = periodeToYearMonth(label);
  if(!ym) return label;
  let y=ym.y, m=ym.m+n;
  while(m>11){ m-=12; y++; }
  while(m<0){ m+=12; y--; }
  return periodeLabelFromYM(y,m);
}
/* enumeratePeriodesBulanan() SENGAJA berhenti di periodeAktif (bulan berjalan
   nyata) - dipakai luas oleh Perlu Tindakan/Laporan/KPI, tidak boleh tiba-tiba
   menampilkan tunggakan bulan-bulan masa depan yang belum jatuh tempo. Untuk
   pembayaran DI MUKA (Rentang Periode - mis. bayar Agustus 2026 s/d Juli 2027
   sekaligus), Allocation Planner butuh jendela periode yang lebih jauh HANYA
   di fitur itu sendiri - fungsi ini memperpanjang daftar periode dasar sampai
   sampaiLabel tanpa mengubah enumeratePeriodesBulanan yang dipakai di mana-mana. */
function enumeratePeriodesBulananExtended(siswa, sampaiLabel){
  const base = enumeratePeriodesBulanan(siswa);
  const ymSampai = sampaiLabel ? periodeToYearMonth(sampaiLabel) : null;
  if(!ymSampai || !base.length) return base;
  const out = base.slice();
  let last = periodeToYearMonth(base[base.length-1]);
  let y=last.y, m=last.m;
  while(y<ymSampai.y || (y===ymSampai.y && m<ymSampai.m)){
    m++; if(m>11){ m=0; y++; }
    out.push(periodeLabelFromYM(y,m));
  }
  return out;
}
/* Kewajiban satu komponen bulanan sampai periode tertentu (termasuk periode
   MASA DEPAN, di luar cakupan kewajibanForSiswa biasa) - dipakai KHUSUS oleh
   mode Rentang Periode/Lunas Sampai. Tetap memanggil kewajibanSatuBaris yang
   SAMA (Tarif/Keringanan/snapshot berlaku identik), hanya jendela periodenya
   yang diperluas - bukan mesin perhitungan baru. */
function kewajibanForSiswaSampai(siswaId, komponenNama, periodeSampai){
  const siswa = MasterAPI.students().find(s=>s.id===siswaId);
  if(!siswa) return [];
  const komp = komponenByNama(komponenNama);
  if(!komp || komp.frekuensi!=='Bulanan') return kewajibanForSiswa(siswaId).filter(o=>o.komponenNama===komponenNama);
  return enumeratePeriodesBulananExtended(siswa, periodeSampai).map(p=>kewajibanSatuBaris(siswa, komp, p));
}
function allObligationsAllSiswa(periodeFilter){
  const out = [];
  MasterAPI.students().filter(s=>(s.status||'Aktif')==='Aktif').forEach(s=>{ out.push.apply(out, kewajibanForSiswa(s.id, periodeFilter)); });
  return out;
}
function alokasiTerbayar(ob){
  const lewatAlokasi = OperationalAPI.alokasi().filter(a=>resolveObligationMatch(a,ob)).reduce((s,a)=>s+Number(a.nominal||0),0);
  return lewatAlokasi + Number(ob._legacyPembayaran||0);
}
function overAllocated(ob){ return alokasiTerbayar(ob) > Number(ob.netto||0) + 0.5; }
function sisaObligation(ob){ return Math.max(0, Number(ob.netto||0) - alokasiTerbayar(ob)); }
function statusObligation(ob){
  const bayar = alokasiTerbayar(ob), netto = Number(ob.netto||0);
  if(bayar > netto+0.5) return 'KELEBIHAN BAYAR';
  if(bayar>0 && bayar>=netto-0.5) return 'LUNAS';
  if(bayar>0) return 'CICILAN';
  return 'BELUM BAYAR';
}
function obligationOverdue(ob){ return !!(ob.jatuhTempo && ob.jatuhTempo<todayISO() && sisaObligation(ob)>0); }
/* ============================================================
   PATCH MASTER "UI Pembayaran" - Bagian 11: HASIL PEMBAYARAN
   (KURANG_BAYAR/LUNAS/LEBIH_BAYAR) adalah konsep TRANSAKSI-level,
   terpisah dari Status Transaksi (TERCATAT/.../SELESAI) dan juga
   terpisah dari statusObligation di atas (yang per-KEWAJIBAN). Tidak
   ada field baru disimpan - selalu dihitung ulang dari Alokasi +
   kewajibanSatuBaris yang sudah ada (Bagian 18/28: tidak ada engine
   atau ledger baru). ============================================ */
function hasilPembayaranTransaksi(trxId){
  const t = transaksiById(trxId);
  if(!t || t.jenis!=='PENERIMAAN' || isMigrationArtifact(t)) return null;
  const alok = alokasiForTransaksi(trxId);
  if(!alok.length) return null;
  if(sisaBelumDialokasikan(trxId) > 0.5) return 'LEBIH_BAYAR';
  const touched = Array.from(new Set(alok.map(a=>a.siswaId+'|'+a.komponenId+'|'+a.periode)));
  const kurangBayarAda = touched.some(key=>{
    const parts = key.split('|'); const siswaId=parts[0], komponenId=parts[1], periode=parts.slice(2).join('|');
    const siswa = MasterAPI.students().find(s=>s.id===siswaId);
    const komponen = komponenById(komponenId);
    if(!siswa||!komponen) return false;
    return sisaObligation(kewajibanSatuBaris(siswa, komponen, periode)) > 0.5;
  });
  return kurangBayarAda ? 'KURANG_BAYAR' : 'LUNAS';
}
/* Versi preview (belum disimpan) dari fungsi di atas - dipakai form Input
   Penerimaan sebelum Konfirmasi & Simpan. planList: [{ob, nominal}]. */
function hasilPembayaranDariPlan(totalNominal, planList){
  const dialokasikan = planList.reduce((s,p)=>s+Number(p.nominal||0),0);
  if(Math.max(0,totalNominal-dialokasikan) > 0.5) return 'LEBIH_BAYAR';
  const kurangBayarAda = planList.some(p=>Math.max(0, sisaObligation(p.ob)-Number(p.nominal||0)) > 0.5);
  return kurangBayarAda ? 'KURANG_BAYAR' : 'LUNAS';
}
function hasilPembayaranBadge(hasil){
  const map = {KURANG_BAYAR:{cls:'amber', dot:'&#128992;', label:'KURANG BAYAR'}, LUNAS:{cls:'green', dot:'&#128994;', label:'LUNAS'}, LEBIH_BAYAR:{cls:'blue', dot:'&#128996;', label:'LEBIH BAYAR / KREDIT'}};
  const m = map[hasil];
  return m ? '<span class="badge '+m.cls+'">'+m.dot+' '+m.label+'</span>' : '';
}
/* Kredit siswa = akumulasi sisa BELUM DIALOKASIKAN dari transaksi Penerimaan
   siswa itu yang Hasil Pembayarannya LEBIH_BAYAR - dihitung on-the-fly dari
   Transaksi+Alokasi yang SUDAH ADA (Bagian 16: "gunakan struktur data yang
   sudah ada", bukan ledger kredit baru). "sumber" diurutkan tanggal terlama
   dulu supaya pemakaian kredit konsisten dengan prinsip FIFO Allocation
   Planner yang lain. */
function siswaKreditInfo(siswaId){
  const sumber = penerimaanListReal().filter(t=>t.siswaId===siswaId && hasilPembayaranTransaksi(t.id)==='LEBIH_BAYAR')
    .map(t=>({trxId:t.id, tanggal:t.tanggal, sisa:sisaBelumDialokasikan(t.id)}))
    .filter(x=>x.sisa>0.5)
    .sort((a,b)=>(a.tanggal||'').localeCompare(b.tanggal||''));
  return {total: sumber.reduce((s,x)=>s+x.sisa,0), sumber};
}
// Kompatibilitas nama lama dipakai di banyak tempat (Laporan/Profil/KPI) - sekarang beroperasi atas obligation computed.
function tagihanTerbayar(ob){ return alokasiTerbayar(ob); }
function tagihanSisa(ob){ return sisaObligation(ob); }
function tagihanOverAllocated(ob){ return overAllocated(ob); }
function tagihanStatus(ob){ return statusObligation(ob); }
function tagihanForSiswa(siswaId, periodeFilter){ return kewajibanForSiswa(siswaId, periodeFilter); }
function classifyStudentArrears(siswaId, periodeFilter){
  const rows = kewajibanForSiswa(siswaId, periodeFilter);
  if(!rows.length) return 'BELUM ADA KEWAJIBAN';
  const statuses = rows.map(statusObligation);
  if(statuses.every(s=>s==='LUNAS'||s==='KELEBIHAN BAYAR')) return 'SEMUA LUNAS';
  if(statuses.every(s=>s==='BELUM BAYAR')) return 'BELUM BAYAR';
  if(rows.some(obligationOverdue)) return 'OVERDUE';
  if(statuses.some(s=>s==='LUNAS'||s==='KELEBIHAN BAYAR') && statuses.some(s=>s==='BELUM BAYAR'||s==='CICILAN')) return 'ADA TUNGGAKAN';
  return 'SEBAGIAN TAGIHAN';
}
function totalTunggakan(periodeFilter){ return allObligationsAllSiswa(periodeFilter).reduce((s,o)=>s+sisaObligation(o),0); }
function validateObligationAllocation(ob, tambahanNominal){
  const sisa = sisaObligation(ob);
  if(tambahanNominal > sisa + 0.5) return {ok:false, msg:'Alokasi (' + fmtRp(tambahanNominal) + ') melebihi sisa kewajiban ' + esc(ob.komponenNama) + ' ' + esc(ob.periode) + ' (' + fmtRp(sisa) + ')'};
  return {ok:true};
}

/* --- Financial Completeness (section 17 master prompt: bukan surplus sederhana) --- */
function financialCompletenessChecklist(periode){
  const cats = ['Penerimaan','Pengeluaran','Anggaran/RAB','Rekonsiliasi','Obligasi'];
  const hasEver = {
    'Penerimaan': penerimaanList().length>0, 'Pengeluaran': pengeluaranList().length>0,
    'Anggaran/RAB': Store.loadAnggaran().length>0, 'Rekonsiliasi': Store.loadAuditTrail().some(a=>a.aksi==='REKONSILIASI'),
    'Obligasi': Store.loadObligasi().length>0
  };
  const hasThisPeriode = {
    'Penerimaan': penerimaanList().some(t=>periodeOfDate(t.tanggal)===periode),
    'Pengeluaran': pengeluaranList().some(t=>periodeOfDate(t.tanggal)===periode),
    'Anggaran/RAB': Store.loadAnggaran().some(a=>a.periode===periode),
    'Rekonsiliasi': Store.loadAuditTrail().some(a=>a.aksi==='REKONSILIASI' && (a.dataSesudah||{}).periode===periode),
    'Obligasi': Store.loadObligasi().some(o=>periodeOfDate(o.tanggal)===periode)
  };
  return cats.map(c=>({kategori:c, status: hasThisPeriode[c] ? 'LENGKAP' : (hasEver[c] ? 'BELUM TERCATAT' : 'DATA BELUM TERSEDIA')}));
}
function financialCompletenessPct(periode){
  const rows = financialCompletenessChecklist(periode);
  return Math.round(rows.filter(r=>r.status==='LENGKAP').length/rows.length*100);
}
function adjustedAvailableCashLabel(periode){
  const pct = financialCompletenessPct(periode);
  if(pct<100) return 'Actual Cash Position - Data ' + pct + '% Lengkap (belum lengkap, bukan surplus)';
  return 'Actual Cash Position (Lengkap)';
}

/* --- Mutation actions (writes to Layer 1, always through here + audit trail) --- */
/* Patch Master "Kontrol Anti Kebocoran": postTransaksi adalah SATU-SATUNYA
   pintu tulis Transaksi (manual, import, mutasi bank semua lewat sini) -
   maka guard di sini otomatis berlaku ke semua jalur tanpa duplikasi kode. */
function postTransaksi(t){
  if(!(Number(t.nominal)>0)) throw new Error('Nominal harus lebih dari 0');
  if((t.jenis==='PENERIMAAN'||t.jenis==='PENGELUARAN') && !t.akunId) throw new Error('Akun Kas/Bank wajib diisi');
  /* Fase 3B-3A: unit (TK/MI) WAJIB eksplisit untuk PENERIMAAN/PENGELUARAN -
     dicek di SINI (satu-satunya pintu tulis) supaya tidak ada satu jalur pun
     yang bisa membuat baris localStorage baru tanpa unit, TERMASUK jalur yang
     lupa ditambahkan form-nya di masa depan. TRANSFER sengaja dikecualikan -
     tidak disentuh Fase 3B-3A (lihat audit desain: TRANSFER belum didukung
     write-door server sama sekali). Unit TIDAK PERNAH ditebak di sini -
     kalau kosong, ditolak, titik. */
  if((t.jenis==='PENERIMAAN'||t.jenis==='PENGELUARAN') && (!t.unit || (t.unit!=='TK'&&t.unit!=='MI'))) throw new Error('Unit (TK/MI) wajib diisi');
  if(t.siswaId && !MasterAPI.students().some(s=>s.id===t.siswaId)) throw new Error('Siswa tidak ditemukan (data siswa tidak valid)');
  /* [P0-B] Transaksi resmi HANYA lewat server (Google Sheets). Tidak ada lagi penyimpanan lokal yang tampak berhasil
     saat server tidak siap/tidak terotorisasi. TRANSFER belum punya jalur server -> ditolak dengan pesan jelas. */
  if(t.jenis==='TRANSFER') throw new Error('Transfer antar-akun belum didukung server - TIDAK disimpan.');
  if((t.jenis==='PENERIMAAN'||t.jenis==='PENGELUARAN') && !centralTxWriteActive()) throw new Error(centralNotReadyText_());
  const arr = Store.loadTransaksi();
  t.id = t.id || uid('trx');
  t.createdAt = new Date().toISOString();
  t.buktiId = t.buktiId||[];
  if(centralTxWriteActive() && (t.jenis==='PENERIMAAN'||t.jenis==='PENGELUARAN')) t._pendingSync = true;
  arr.push(t);
  Store.saveTransaksi(arr);
  auditTrailPush('TAMBAH_TRANSAKSI_'+t.jenis, null, t, 'input-manual');
  if(t._pendingSync) globalThis.__centralAwaitConfirm = true; // [P0-B] sukses baru setelah server mengonfirmasi
  /* Fase 3B-3A: enqueue ke sync queue cloud SETELAH localStorage-write sukses
     - localStorage TETAP primary/sudah selesai di atas baris ini, ini murni
     tambahan pengiriman di belakang layar (tidak pernah blocking, tidak
     pernah bisa menggagalkan penyimpanan lokal). TRANSFER sengaja TIDAK
     di-bridge (lihat audit desain: jenis TRANSFER belum didukung
     TransactionEngine.gs sama sekali). buktiId SENGAJA tidak ikut dikirim -
     tetap lokal saja (10_BUKTI belum punya write-door), TIDAK dibuang. */
  if((t.jenis==='PENERIMAAN'||t.jenis==='PENGELUARAN') && typeof BridgeClient!=='undefined' && !centralTxWriteActive()){
    try{
      const bridgeAction = t.jenis==='PENERIMAAN' ? 'createIncome' : 'createExpense';
      BridgeClient.enqueue(bridgeAction, t.id, buildBridgePayloadFromTransaksi_(t), t.id);
    }catch(bridgeErr){ console.error('BridgeClient enqueue gagal (transaksi TETAP tersimpan lokal):', bridgeErr); }
  }
  centralScheduleSync();
  return t;
}
/* Payload untuk bridge HANYA field yang dikenal TRX_HEADERS di
   TransactionEngine.gs - field lokal-saja (buktiId, _extra,
   _migratedFromV1, noTransaksi, id, createdAt) SENGAJA tidak diikutkan;
   server generate id & createdAt sendiri (server-side, lihat
   createTransactionWithAllocations_). */
function buildBridgePayloadFromTransaksi_(t){
  return {
    jenis:t.jenis, tanggal:t.tanggal, unit:t.unit, nominal:t.nominal, akunId:t.akunId,
    metode:t.metode, status:t.status, catatan:t.catatan, sumber:t.sumber, siswaId:t.siswaId||undefined,
    resiNo:t.resiNo||undefined, kategori:t.kategori||undefined, subkategori:t.subkategori||undefined,
    penerima:t.penerima||undefined, ftNumber:t.ftNumber||undefined, namaPengirim:t.namaPengirim||undefined
  };
}
function updateTransaksiStatus(trxId, status){
  const cur = transaksiById(trxId);
  if(!cur) return;
  if(centralIsServerTrx(trxId) && cur.status===status) return;
  let r; try{ r = centralPatchTransaksi(trxId, {status:status}); }catch(e){ return; }
  auditTrailPush('UBAH_STATUS_TRANSAKSI', r.before, r.after, 'manual');
}
/* Patch04: satu transaksi -> N alokasi, bebas beda siswa & komponen. list = [{ob, nominal}]
   ob = obligation object dari kewajibanForSiswa/kewajibanSatuBaris (punya siswaId/komponenId/periode/tagihanId). */
function createAlokasi(transaksiId, list){
  transaksiId = centralResolveTrxId(transaksiId);
  const trx = transaksiById(transaksiId);
  if(!trx) throw new Error('Transaksi tidak ditemukan');
  if(!centralTxWriteActive()) throw new Error(centralNotReadyText_()); // [P0-B] alokasi resmi hanya lewat server
  const sudahAda = alokasiForTransaksi(transaksiId).reduce((s,a)=>s+Number(a.nominal||0),0);
  const totalBaru = list.reduce((s,l)=>s+Number(l.nominal||0),0);
  if(sudahAda + totalBaru > Number(trx.nominal||0) + 0.5) throw new Error('Total alokasi (' + fmtRp(sudahAda+totalBaru) + ') melebihi nominal transaksi (' + fmtRp(trx.nominal) + ')');
  list.forEach(l=>{
    if(!l.nominal || l.nominal<=0) return;
    if(!l.ob || !l.ob.siswaId || !komponenById(l.ob.komponenId)) throw new Error('Komponen alokasi tidak valid');
    const chk = validateObligationAllocation(l.ob, l.nominal);
    if(!chk.ok) throw new Error(chk.msg);
  });
  const chkBatch = validateAllocationBatch(list);
  if(!chkBatch.ok) throw new Error(chkBatch.msg);
  const arr = Store.loadAlokasi();
  const savedNow = [];
  list.forEach(l=>{
    if(!l.nominal || l.nominal<=0) return;
    const row = {id:uid('alk'), transaksiId, siswaId:l.ob.siswaId, komponenId:l.ob.komponenId, periode:l.ob.periode, tagihanId:l.ob.tagihanId||null, nominal:Number(l.nominal), caraBayar:l.caraBayar||null, createdAt:new Date().toISOString()};
    if(centralTxWriteActive()) row._pendingSync = true;
    arr.push(row);
    savedNow.push(row);
  });
  Store.saveAlokasi(arr);
  if(savedNow.some(r=>r._pendingSync)) globalThis.__centralAwaitConfirm = true; // [P0-B]
  centralScheduleSync();
  /* Fase 3B-3A: enqueue createAllocation SATU per baris alokasi, dengan
     transaksiId yang SAMA dengan transaksi induknya sebagai kunci FIFO -
     sync queue TIDAK PERNAH mengirim alokasi ini mendahului transaksi
     induknya (lihat FIFO per transaksiId di BridgeClient.js), walau
     urutan enqueue di sini memang selalu SESUDAH postTransaksi(). */
  if(typeof BridgeClient!=='undefined' && !centralTxWriteActive()){
    savedNow.forEach(row=>{
      try{
        BridgeClient.enqueue('createAllocation', transaksiId, {
          transaksiId:row.transaksiId, siswaId:row.siswaId, komponenId:row.komponenId,
          periode:row.periode||undefined, nominal:row.nominal, caraBayar:row.caraBayar||undefined,
          tagihanId:row.tagihanId||undefined
        }, row.id);
      }catch(bridgeErr){ console.error('BridgeClient enqueue alokasi gagal (alokasi TETAP tersimpan lokal):', bridgeErr); }
    });
  }
  // Jika transaksi belum punya siswaId (belum "diidentifikasi"), alokasi pertama
  // sekaligus mengidentifikasi ke siswa dari baris pertama - tanpa langkah terpisah.
  if(!trx.siswaId && list.length && !centralIsServerTrx(transaksiId)){
    const arr2 = Store.loadTransaksi(); const idx2 = arr2.findIndex(t=>t.id===transaksiId);
    if(idx2>=0 && !arr2[idx2].siswaId){ arr2[idx2].siswaId = list[0].ob.siswaId; Store.saveTransaksi(arr2); }
  }
  updateTransaksiStatus(transaksiId, computeTransaksiAllocationStatus(transaksiId));
  auditTrailPush('ALOKASI_PEMBAYARAN', null, {transaksiId, list:list.map(l=>({siswaId:l.ob.siswaId,komponenId:l.ob.komponenId,periode:l.ob.periode,nominal:l.nominal}))}, 'manual');
}
function hapusAlokasi(transaksiId, alokasiId){
  if(OperationalAPI.isServerAlokasi(alokasiId)){ centralArchiveAlokasi(alokasiId, 'dihapus dari editor alokasi'); auditTrailPush('HAPUS_ALOKASI', {id:alokasiId}, null, 'manual'); updateTransaksiStatus(transaksiId, computeTransaksiAllocationStatus(transaksiId)); toast('Alokasi diarsipkan (reversal, data tidak dihapus)'); openModal(alokasiEditorHtml(transaksiId), true); return; }
  const arr = Store.loadAlokasi();
  const idx = arr.findIndex(a=>a.id===alokasiId);
  if(idx<0) return;
  const before = deepClone(arr[idx]);
  arr.splice(idx,1);
  Store.saveAlokasi(arr);
  auditTrailPush('HAPUS_ALOKASI', before, null, 'manual');
  updateTransaksiStatus(transaksiId, computeTransaksiAllocationStatus(transaksiId));
  toast('Alokasi dihapus');
  openModal(alokasiEditorHtml(transaksiId), true);
}
function sisaBelumDialokasikan(trxId){
  const trx = transaksiById(trxId);
  if(!trx) return 0;
  const sudah = alokasiForTransaksi(trxId).reduce((s,a)=>s+Number(a.nominal||0),0);
  return Math.max(0, Number(trx.nominal||0)-sudah);
}
/* Edit nominal transaksi asli (Patch: hanya untuk koreksi data salah input/
   migrasi - WAJIB alasan + tercatat before/after di AuditTrail, TIDAK

/* Archive (soft-delete) - Rp0/migration artifact, TIDAK PERNAH hard-delete. */
function archiveTransaksi(trxId, alasan){
  if(centralIsServerTrx(trxId)){ centralArchiveTrx(trxId, alasan); auditTrailPush('ARCHIVE_TRANSAKSI', {id:centralResolveTrxId(trxId)}, {_alasan:alasan}, 'manual'); return; }
  const arr = Store.loadTransaksi();
  const idx = arr.findIndex(t=>t.id===trxId);
  if(idx<0) return;
  const before = deepClone(arr[idx]);
  arr[idx].archivedAt = new Date().toISOString();
  Store.saveTransaksi(arr);
  auditTrailPush('ARCHIVE_TRANSAKSI', before, Object.assign(deepClone(arr[idx]), {_alasan:alasan}), 'manual');
}

/* ============================================================
   5. UNIFIED KPI ENGINE - engine yang SAMA dengan Kepala Sekolah &
   Waka Kurikulum (KPI->Indikator->Aktivitas->Checklist->Evidence->
   Verification->Realisasi->Score->Report). Bendahara TIDAK punya
   engine sendiri - fungsi di 5a diporting apa adanya dari Kepala
   Sekolah v5.1 / Waka Kurikulum. Satu-satunya bagian baru adalah
   5c FINANCIAL ACTIVITY ADAPTER (menerjemahkan data keuangan jadi
   Aktivitas yang bisa dibaca engine ini) dan 5b INDICATOR_MASTER
   (data BDS01-06, bukan logic baru).
   ============================================================ */

/* ---- 5a. GENERIC ENGINE CORE (ported verbatim) ---- */
function round1(n){ return Math.round(n*10)/10; }
function round2(n){ return Math.round(n*100)/100; }
function sum(arr){ return arr.reduce((a,b)=>a+Number(b||0),0); }
function avg(arr){ return arr.length ? sum(arr)/arr.length : 0; }
const BULAN_ID = BULAN_ID_LIST();
function periodeToYearMonth(periode){
  const parts=(periode||'').split(' '); const mIdx=BULAN_ID.indexOf(parts[0]); const year=Number(parts[1]);
  if(mIdx<0||!year) return null;
  return {y:year,m:mIdx};
}
function dateToISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function semesterStartDateForMonth(y,mIdx){ return mIdx>=6 ? new Date(y,6,1) : new Date(y,0,1); }
function semesterEndDateForMonth(y,mIdx){ return mIdx>=6 ? new Date(y,11,31) : new Date(y,5,30); }
function schoolYearStartDateForMonth(y,mIdx){ return mIdx>=6 ? new Date(y,6,1) : new Date(y-1,6,1); }
function schoolYearEndDateForMonth(y,mIdx){ return mIdx>=6 ? new Date(y+1,5,30) : new Date(y,5,30); }
function getMeasurementWindow(kpiDef, periode){
  const ym = periodeToYearMonth(periode);
  if(!ym) return null;
  const freq = String((kpiDef&&(kpiDef.frekuensi||kpiDef.frequency))||'').toLowerCase();
  if(freq==='semester') return {type:'Semester', start:semesterStartDateForMonth(ym.y,ym.m), end:semesterEndDateForMonth(ym.y,ym.m)};
  if(freq==='tahunan') return {type:'Tahunan', start:schoolYearStartDateForMonth(ym.y,ym.m), end:schoolYearEndDateForMonth(ym.y,ym.m)};
  return {type:'Bulanan', start:new Date(ym.y,ym.m,1), end:new Date(ym.y,ym.m+1,0)};
}
/* Measurement Type standar (section 3): PERCENTAGE/RATIO/SCORE dan alias
   finansial RECONCILIATION/DOCUMENT_COMPLETENESS semuanya diperlakukan
   sebagai satu measurement (rata-rata nilaiLangsung), BUKAN engine baru -
   persis instruksi "perlakukan sebagai adapter/measurement". */
function isPercentageIndicator(kpiDef){
  const t = String((kpiDef&&kpiDef.measurementType)||'').toUpperCase();
  return t==='PERCENTAGE'||t==='RATIO'||t==='SCORE'||t==='RECONCILIATION'||t==='DOCUMENT_COMPLETENESS';
}
function isCompletionIndicator(kpiDef){
  const t = String((kpiDef&&kpiDef.measurementType)||'').toUpperCase();
  return t==='COMPLETION'||t==='DEADLINE';
}
function getIndicatorRealization(kpiDef, periode){
  if(!kpiDef) return '';
  const win = getMeasurementWindow(kpiDef, periode);
  if(!win) return '';
  const startISO=dateToISO(win.start), endISO=dateToISO(win.end);
  const akt = financialAktivitasFeed().filter(a=>a.kodeKpi===kpiDef.kode && a.tanggal && a.tanggal>=startISO && a.tanggal<=endISO);
  if(isPercentageIndicator(kpiDef)){
    const withNilai = akt.filter(a=>a.nilaiLangsung!==null && a.nilaiLangsung!=='' && a.nilaiLangsung!==undefined && !isNaN(a.nilaiLangsung));
    return withNilai.length ? round1(avg(withNilai.map(a=>Number(a.nilaiLangsung)))) : '';
  }
  if(isCompletionIndicator(kpiDef)){
    const done = akt.filter(a=>!!a.completionDate);
    return done.length ? done.length : '';
  }
  return akt.length ? akt.length : '';
}
function kpiTargetKey(kode, periode){ return kode+'|'+periode; }
function getKpiTarget(kode, periode){
  const targets = Store.loadKpiTarget();
  const key = kpiTargetKey(kode, periode);
  const kpiDef = INDICATOR_MASTER.find(k=>k.kode===kode);
  return targets[key]!==undefined ? targets[key] : (kpiDef?kpiDef.target:'');
}
function computeIndicatorQuantityScore(kpiDef, periode, realisasi){
  if(realisasi==='') return null;
  if(isPercentageIndicator(kpiDef)) return Math.min(100, Math.max(0, Number(realisasi)));
  const targetP = getKpiTarget(kpiDef.kode, periode);
  if(targetP!==''&&targetP!==null&&Number(targetP)>0) return Math.min(100, round2(Number(realisasi)/Number(targetP)*100));
  return 0;
}
function checklistItemSkor(item, value){
  if(value===undefined||value===null||value==='') return null;
  const t = item.answerType||'yatidak';
  if(t==='yatidak') return value==='Ya' ? 100 : 0;
  if(t==='adatidak') return value==='Ada' ? 100 : 0;
  if(t==='status3'){ const map={'Selesai':100,'Dalam Proses':50,'Belum':0}; return map[value]!==undefined?map[value]:null; }
  if(t==='angka'){ const n=Number(value); if(isNaN(n)||!item.targetAngka) return null; return Math.min(100, round1(n/Number(item.targetAngka)*100)); }
  return null;
}
function computeChecklistInstanceScore(tpl, inst){
  const checked = inst.checkedItems||{};
  const scored = tpl.items.map(it=>checklistItemSkor(it, checked[it.id])).filter(s=>s!==null);
  const capaian = scored.length ? round1(avg(scored)) : '';
  return {totalItem:tpl.items.length, terisi:scored.length, capaian};
}
/* Quality gate per Aktivitas: sama persis dengan Kepala Sekolah/Waka -
   Checklist bila ada, kalau tidak deskripsi+bukti(+nomorSurat bila
   kedinasan). Untuk Aktivitas hasil FinancialActivityAdapter, "bukti"
   SELALU berisi referensi ke record sumber asli (lihat 5c), sehingga
   dimensi ini jujur mengukur "apakah butuh Bukti_unggah_asli (mis.
   BDS05) dan itu benar ada", bukan fabrikasi. */
function computeIndicatorQuality(kpiDef, periode, akt){
  if(!akt.length) return null;
  const scores = akt.map(a=>{
    if(a.checklistInstId){
      const inst = Store.loadChecklistInstances().find(i=>i.id===a.checklistInstId);
      const tpl = inst ? Store.loadChecklistTemplates().find(t=>t.id===inst.templateId) : null;
      if(inst && tpl){ const cs=computeChecklistInstanceScore(tpl, inst); if(cs.capaian!=='') return cs.capaian; }
    }
    const checks = [!!(a.deskripsi && a.deskripsi.trim())];
    checks.push(!!(a.bukti && a.bukti.length));
    if(a.berdasarkanSurat) checks.push(!!a.nomorSurat);
    const passed = checks.filter(Boolean).length;
    return checks.length ? round1(passed/checks.length*100) : 100;
  });
  return round1(avg(scores));
}
function classifyDeadlineSpec(deadlineText){
  const t=(deadlineText||'').trim();
  if(!t) return {type:'none'};
  let m;
  if((m=t.match(/tanggal\s+(\d{1,2})/i))) return {type:'dayOfMonth', day:Number(m[1])};
  if(/akhir\s+bulan\s+berjalan/i.test(t)) return {type:'endOfMonth'};
  if(/akhir\s+semester\s+berjalan/i.test(t)) return {type:'endOfSemester'};
  if(/akhir\s+tahun\s+ajaran/i.test(t)) return {type:'endOfSchoolYear'};
  return {type:'periodBased', text:t};
}
function resolveDeadlineDateForPeriode(deadlineText, periode){
  const ym=periodeToYearMonth(periode);
  if(!ym) return null;
  const spec=classifyDeadlineSpec(deadlineText);
  const daysInMonth=new Date(ym.y,ym.m+1,0).getDate();
  if(spec.type==='dayOfMonth') return new Date(ym.y,ym.m,Math.min(spec.day,daysInMonth));
  if(spec.type==='endOfMonth') return new Date(ym.y,ym.m,daysInMonth);
  if(spec.type==='endOfSemester') return semesterEndDateForMonth(ym.y,ym.m);
  if(spec.type==='endOfSchoolYear') return schoolYearEndDateForMonth(ym.y,ym.m);
  return null;
}
/* Timeliness HARUS pakai completionDate (kapan aktivitas benar-benar
   selesai), bukan tanggal pencatatan - sama persis aturan v5.1. */
function computeIndicatorTimeliness(kpiDef, periode, akt){
  const deadlineDate = resolveDeadlineDateForPeriode(kpiDef.deadline, periode);
  if(!deadlineDate) return null;
  const deadlineISO = dateToISO(deadlineDate);
  const withCompletion = akt.filter(a=>a.completionDate);
  if(!withCompletion.length) return null;
  return round1(avg(withCompletion.map(a=> a.completionDate<=deadlineISO ? 100 : 0)));
}
function kendalaPeriodeInWindow(periodeStr, win){
  if(!win) return false;
  const ym=periodeToYearMonth(periodeStr);
  if(!ym) return false;
  const monthStart=new Date(ym.y,ym.m,1), monthEnd=new Date(ym.y,ym.m+1,0);
  return monthStart<=win.end && monthEnd>=win.start;
}
function computeIndicatorFollowUp(kpiDef, periode){
  const win = getMeasurementWindow(kpiDef, periode);
  const kendala = Store.loadKendala().filter(k=>k.indicatorId===kpiDef.kode && kendalaPeriodeInWindow(k.periode, win));
  if(!kendala.length) return 100;
  const map = {'Belum Ditindaklanjuti':0,'Dalam Proses':50,'Selesai':100,'Diverifikasi':100};
  return round1(avg(kendala.map(k=>map[k.status]!==undefined?map[k.status]:50)));
}
/* Bendahara tidak memakai jalur Inovasi (allowsInnovation selalu false) -
   Improvement jadi proksi Follow-up, persis perilaku indikator rutin
   non-inovasi di Kepala Sekolah/Waka. */
function computeIndicatorImprovement(kpiDef, periode, akt){
  if(!akt.length) return null;
  return computeIndicatorFollowUp(kpiDef, periode);
}
const ACTIVITY_STATUS_LABEL = {NOT_STARTED:'Belum Dimulai', IN_PROGRESS:'Sedang Berjalan', MEASURED:'Terukur', NOT_APPLICABLE:'Tidak Berlaku', NOT_DUE:'Belum Jatuh Tempo'};
function computeIndicatorActivityStatus(kpiDef, periode, dims){
  if(kpiDef.active===false) return 'NOT_APPLICABLE';
  if(dims.realisasi!=='') return (dims.dimsUsed && dims.dimsUsed.length>=3) ? 'MEASURED' : 'IN_PROGRESS';
  const deadlineDate = resolveDeadlineDateForPeriode(kpiDef.deadline, periode);
  if(deadlineDate){ const today=new Date(); today.setHours(0,0,0,0); if(today<deadlineDate) return 'NOT_DUE'; }
  return 'NOT_STARTED';
}
function computeIndicatorDimensions(kpiDef, periode){
  const win = getMeasurementWindow(kpiDef, periode);
  const akt = win ? financialAktivitasFeed().filter(a=>a.kodeKpi===kpiDef.kode && a.tanggal && a.tanggal>=dateToISO(win.start) && a.tanggal<=dateToISO(win.end)) : [];
  const realisasi = getIndicatorRealization(kpiDef, periode);
  const quantity = computeIndicatorQuantityScore(kpiDef, periode, realisasi);
  const quality = computeIndicatorQuality(kpiDef, periode, akt);
  const timeliness = computeIndicatorTimeliness(kpiDef, periode, akt);
  const followUp = kpiDef.requiresFollowUp ? computeIndicatorFollowUp(kpiDef, periode) : null;
  const improvement = computeIndicatorImprovement(kpiDef, periode, akt);
  const dims = [
    {key:'quantity', value:quantity, weight:30}, {key:'quality', value:quality, weight:25},
    {key:'timeliness', value:timeliness, weight:15}, {key:'followUp', value:followUp, weight:20},
    {key:'improvement', value:improvement, weight:10}
  ];
  const usable = dims.filter(d=>d.value!==null && d.value!==undefined);
  let finalScore = '';
  if(realisasi!=='' && usable.length){
    const totalW = usable.reduce((a,d)=>a+d.weight,0)||1;
    finalScore = Math.min(100, Math.max(0, round2(usable.reduce((a,d)=>a+d.value*d.weight,0)/totalW)));
  }
  return {realisasi, quantity, quality, timeliness, followUp, improvement, dimsUsed: usable.map(d=>d.key), finalScore, akt};
}
/* Status pakai label Bendahara (section 17: Sangat Baik/Baik/Perlu
   Perhatian/Perlu Perbaikan) - angka & threshold (90/80/70) identik
   dengan Unified Engine, hanya penamaan yang mengikuti spesifikasi ini. */
function kpiStatusFromScore(score){
  if(score==null||score==='') return 'N/A';
  if(score>=90) return 'Sangat Baik';
  if(score>=80) return 'Baik';
  if(score>=70) return 'Perlu Perhatian';
  return 'Perlu Perbaikan';
}
function computeKpiRow(kpiDef, periode){
  const dims = computeIndicatorDimensions(kpiDef, periode);
  const capaian = dims.finalScore;
  const activityStatus = computeIndicatorActivityStatus(kpiDef, periode, dims);
  const status = dims.realisasi==='' ? (activityStatus==='NOT_DUE'?'BELUM JATUH TEMPO':(activityStatus==='NOT_APPLICABLE'?'TIDAK BERLAKU':'BELUM ADA AKTIVITAS')) : kpiStatusFromScore(capaian);
  return Object.assign({}, kpiDef, {realisasi:dims.realisasi, capaian, status, activityStatus,
    dimQuantity:dims.quantity, dimQuality:dims.quality, dimTimeliness:dims.timeliness, dimFollowUp:dims.followUp, dimImprovement:dims.improvement, dimsUsed:dims.dimsUsed});
}
/* Roll-up ke KPI Induk (BDS01-06) - Zero Activity Rule: NOT_DUE/NOT_APPLICABLE
   dikeluarkan dari denominator; NOT_STARTED tetap masuk dengan kontribusi 0
   (tidak ada "lolos gratis" karena baru sebagian indikator dikerjakan). */
function kpiIndukRow(kpiMaster, periode){
  const indicators = INDICATOR_MASTER.filter(k=>k.parentKpi===kpiMaster.kode).map(k=>computeKpiRow(k, periode));
  const counted = indicators.filter(r=>r.activityStatus!=='NOT_DUE' && r.activityStatus!=='NOT_APPLICABLE');
  const filledWeight = round2(sum(counted.map(r=>r.bobot)));
  const skor = filledWeight ? round1(sum(counted.map(r=>(r.capaian===''?0:r.capaian)*r.bobot))/filledWeight) : null;
  const jumlahMasalah = indicators.reduce((s,r)=>s+indicatorProblemRows(r, periode).length, 0);
  return Object.assign({}, kpiMaster, {indicators, skor, status:kpiStatusFromScore(skor), jumlahMasalah});
}
function kpiIndukSummaryCompute_(periode){
  periode = periode || Store.loadSettings().periodeAktif;
  const rows = KPI_MASTER.map(k=>kpiIndukRow(k, periode));
  const filled = rows.filter(r=>r.skor!=null);
  const bobotDiisi = round2(sum(filled.map(r=>r.bobot)));
  const overall = bobotDiisi ? round1(sum(filled.map(r=>r.skor*r.bobot))/bobotDiisi) : null;
  return {periode, rows, overall, overallStatus:kpiStatusFromScore(overall)};
}
/* [P0-D] Sumber data KPI wajib berasal dari server dan termuat lengkap. Bila tidak, KPI berstatus
   "DATA TIDAK TERSEDIA" (skor null), BUKAN skor 0 "Perlu Perbaikan". Alasan dicatat tanpa data sensitif. */
const KPI_DATA_UNAVAILABLE_ = 'DATA TIDAK TERSEDIA';
const KPI_SOURCE_KEYS_ = ['transaksi', 'alokasi', 'kewajiban', 'anggaran', 'komitmen', 'bukti', 'mutasiBank', 'rekonsiliasi', 'laporan'];
function kpiDataStatus_(){
  const alasan = [];
  try{
    if(typeof ServerBridge === 'undefined' || !ServerBridge) alasan.push('server tidak terhubung');
    else if(!centralReady_()) alasan.push('pengguna belum terotorisasi');
    else {
      if(!CentralMasterData.ready) alasan.push('data master belum termuat');
      const st = OperationalCache.states;
      KPI_SOURCE_KEYS_.forEach(function(k){ const s = st[k]; if(!s || !s.loaded || s.error) alasan.push(OP_SHEETS[k] + (s && s.error ? ' gagal dimuat' : ' belum termuat')); });
    }
  }catch(e){ alasan.push('status sumber data tidak dapat diperiksa'); }
  if(alasan.length) console.warn('[KPI] ' + KPI_DATA_UNAVAILABLE_ + ': ' + alasan.join('; '));
  return {ok: !alasan.length, alasan: alasan};
}
function kpiUnavailableRow_(k, ds){ return Object.assign({}, k, {indicators: [], skor: null, status: KPI_DATA_UNAVAILABLE_, jumlahMasalah: 0, dataUnavailable: true, alasan: ds.alasan}); }
function kpiIndukSummary(periode){
  periode = periode || Store.loadSettings().periodeAktif;
  const ds = kpiDataStatus_();
  if(!ds.ok) return {periode: periode, rows: KPI_MASTER.map(function(k){ return kpiUnavailableRow_(k, ds); }), overall: null, overallStatus: KPI_DATA_UNAVAILABLE_ + ' (' + ds.alasan.join('; ') + ')', dataUnavailable: true, alasan: ds.alasan};
  return kpiIndukSummaryCompute_(periode);
}
/* Kompatibilitas nama lama dipakai UI (Beranda/Laporan) */
function kpiRow(kode, periode){ const ds = kpiDataStatus_(); if(!ds.ok) return kpiUnavailableRow_(KPI_MASTER.find(k=>k.kode===kode), ds); return kpiIndukRow(KPI_MASTER.find(k=>k.kode===kode), periode); } // [P0-D]
function kpiSummary(periode){ return kpiIndukSummary(periode); }
