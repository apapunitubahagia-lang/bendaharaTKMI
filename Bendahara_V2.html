/* ============================================================
   ALLOCATION PLANNER (redesign - rentang periode + cicilan + pelunasan).
   Dibangun DI ATAS engine yang sudah ada: kewajibanForSiswa/sisaObligation/
   statusObligation/createAlokasi (Patch01/Phase 4) - tidak ada sistem
   transaksi atau kewajiban baru. State.alokEditor menampung "keranjang"
   alokasi yang BELUM disimpan (siswa aktif, mode, filter, hasil preview);
   setiap aksi me-render ulang modal secara penuh dari string HTML, pola yang
   sama dipakai di seluruh app ini (bukan pendekatan baru).
   ============================================================ */
function initAlokEditorState(trxId){
  const t = transaksiById(trxId);
  State.alokEditor = {
    trxId, mode:'tabel', activeSiswaId:(t&&t.siswaId)||null,
    cart:[], filter:{komponen:'', status:'', periode:''}, selectedPeriode:null,
    rentang:{komponen:'', dari:'', sampai:'', nominal:0},
    lunasSampaiHasil:null, rentangHasil:null, otomatisHasil:null
  };
  window.__obligationLookup = window.__obligationLookup || {};
}
function openAlokasiEditor(trxId){
  initAlokEditorState(trxId);
  openModal(alokasiEditorHtml(trxId), true);
}
function rerenderAlokEditor(){ openModal(alokasiEditorHtml(State.alokEditor.trxId), true); }

/* ---- Primitif bersama (dipakai oleh mode Otomatis, Rentang Periode, DAN
   Engine 3 lama recommendAllocation/allocPlanForKomponenGreedy di Bagian 16 -
   satu implementasi urutan-kronologis + greedy-fill, tidak diduplikasi). ---- */
function sortObligationsChronological(obs){
  return obs.slice().sort((a,b)=>{
    const pa = periodeToYearMonth(a.periode), pb = periodeToYearMonth(b.periode);
    if(pa && pb) return (pa.y*12+pa.m)-(pb.y*12+pb.m);
    if(pa && !pb) return -1;
    if(!pa && pb) return 1;
    return 0;
  });
}
function cartPendingFor(obKey){
  const ed = State.alokEditor;
  if(!ed) return 0;
  return (ed.cart||[]).filter(c=>c.obKey===obKey).reduce((s,c)=>s+Number(c.nominal||0),0);
}
function greedyFillSorted(obligations, amount){
  const sorted = sortObligationsChronological(obligations);
  let remaining = amount;
  const plan = [];
  sorted.forEach(ob=>{
    if(remaining<=0.5) return;
    const sisaTersedia = Math.max(0, sisaObligation(ob)-cartPendingFor(ob.key));
    const take = Math.min(remaining, sisaTersedia);
    if(take>0){ plan.push({ob, nominal:take}); remaining -= take; }
  });
  return {plan, sisa:Math.max(0,remaining)};
}
/* ---- Engine 3: SMART ALLOCATION - rekomendasi alokasi kewajiban tertua
   dulu. HANYA rekomendasi - tidak pernah membuat tagihan/transaksi baru,
   tidak mengubah kewajiban, sampai user menekan Simpan Alokasi. ---- */
function recommendAllocation(siswaId, availableAmount){
  const outstanding = kewajibanForSiswa(siswaId).filter(ob=>sisaObligation(ob)-cartPendingFor(ob.key)>0);
  return greedyFillSorted(outstanding, availableAmount);
}

function cartTotal(){ return ((State.alokEditor&&State.alokEditor.cart)||[]).reduce((s,c)=>s+Number(c.nominal||0),0); }
function alokEditorSisaTransaksi(trxId){
  const t = transaksiById(trxId);
  if(!t) return 0;
  const existingSum = alokasiForTransaksi(trxId).reduce((s,a)=>s+Number(a.nominal||0),0);
  return Math.max(0, Number(t.nominal||0) - existingSum - cartTotal());
}
function setAlokMode(mode){ State.alokEditor.mode = mode; rerenderAlokEditor(); }
function setAlokSiswa(siswaId){ State.alokEditor.activeSiswaId = siswaId||null; State.alokEditor.filter={komponen:'',status:'',periode:''}; State.alokEditor.selectedPeriode=null; State.alokEditor.rentang={komponen:'',dari:'',sampai:'',nominal:0}; State.alokEditor.lunasSampaiHasil=null; State.alokEditor.rentangHasil=null; State.alokEditor.otomatisHasil=null; rerenderAlokEditor(); }
function filterAlokSiswaPicker(query){

  if(!sel) return;
  sel.innerHTML = [{value:'',label:'- Pilih Siswa -'}].concat(siswaSearchOptions(query)).map(o=>'<option value="'+esc(o.value)+'">'+esc(o.label)+'</option>').join('');
}
function setAlokFilter(){ State.alokEditor.filter = {komponen:val('alokf_komponen'), status:val('alokf_status'), periode:val('alokf_periode')}; rerenderAlokEditor(); }
function resetAlokFilter(){ State.alokEditor.filter = {komponen:'',status:'',periode:''}; rerenderAlokEditor(); }

/* ---- section 5: status kewajiban (BELUM BAYAR/CICILAN/LUNAS/KELEBIHAN
   BAYAR) sudah dihitung statusObligation() - di sini hanya menampilkan +
   memperhitungkan apa yang SUDAH ada di keranjang (belum tersimpan) supaya
   tidak bisa dipilih dobel melebihi sisa yang sebenarnya tersedia. ---- */
function kewajibanTableRows(siswaId, filter){
  let rows = kewajibanForSiswa(siswaId);
  rows.forEach(ob=>{ window.__obligationLookup[ob.key]=ob; });
  if(filter.komponen) rows = rows.filter(o=>o.komponenNama===filter.komponen);
  if(filter.periode) rows = rows.filter(o=>o.periode===filter.periode);
  if(filter.status) rows = rows.filter(o=>{
    const sisaTampil = Math.max(0, sisaObligation(o)-cartPendingFor(o.key));
    const st = cartPendingFor(o.key)>0.5 && sisaTampil<=0.5 ? 'DI KERANJANG' : statusObligation(o);
    return st===filter.status;
  });
  return sortObligationsChronological(rows);
}
/* Patch "UI Pemula - Alokasi per Tagihan": satu obligation = satu baris
   input yang bisa diketik ulang (upsert), bukan tombol "+Tambah" yang
   menumpuk baris - mengganti nilai lama untuk obKey yang sama, dan otomatis
   dibatasi (clamp, bukan ditolak) supaya tidak pernah melebihi sisa
   kewajiban ATAU sisa pembayaran transaksi ini. Dipakai oleh tampilan
   "Detail Tagihan" (alokTagihanDetailHtml) - primitif cart/createAlokasi di
   baliknya SAMA PERSIS, tidak ada engine baru. */
function alokTabelMaxUntuk(obKey){
  const ob = window.__obligationLookup[obKey];
  if(!ob) return 0;
  const ed = State.alokEditor;
  const t = transaksiById(ed.trxId);
  if(!t) return 0;
  const existingSaved = alokasiForTransaksi(ed.trxId).reduce((s,a)=>s+Number(a.nominal||0),0);
  const cartOthers = (ed.cart||[]).filter(c=>c.obKey!==obKey).reduce((s,c)=>s+Number(c.nominal||0),0);
  const trxSisaExcluding = Math.max(0, Number(t.nominal||0) - existingSaved - cartOthers);
  return Math.max(0, Math.min(sisaObligation(ob), trxSisaExcluding));
}
function alokTabelSetNominal(obKey, rawValue){
  const ed = State.alokEditor;
  const ob = window.__obligationLookup[obKey];
  if(!ob){ toast('Kewajiban tidak ditemukan, muat ulang'); return; }
  let nominal = Number(rawValue)||0;
  if(nominal<0) nominal = 0;
  const maxAllowed = alokTabelMaxUntuk(obKey);
  if(nominal > maxAllowed + 0.5){
    toast('Nominal disesuaikan ke maksimum yang tersedia ('+fmtRp(maxAllowed)+')');
    nominal = maxAllowed;
  }
  const idx = ed.cart.findIndex(c=>c.obKey===obKey);
  if(nominal<=0.5){ if(idx>=0) ed.cart.splice(idx,1); }
  else if(idx>=0) ed.cart[idx].nominal = nominal;
  else ed.cart.push({obKey, nominal});
  rerenderAlokEditor();
}
function alokTabelMax(obKey){ alokTabelSetNominal(obKey, alokTabelMaxUntuk(obKey)); }
function removeFromCart(idx){ State.alokEditor.cart.splice(idx,1); rerenderAlokEditor(); }

/* ---- section 2/3/7: Rentang Periode + shortcut "Lunas Sampai". Tidak
   membuat 1 alokasi yang kehilangan detail periode - setiap periode dalam
   rentang tetap jadi baris alokasi tersendiri (siswaId/komponenId/periode),
   semuanya terhubung ke SATU transaksi lewat createAlokasi (Phase 4). ---- */
function obligationsInWindow(siswaId, komponenNama, periodeDari, periodeSampai){
  /* Guard defensif: fungsi ini sekarang juga dipanggil dari preview Form
     Penerimaan (Bagian 1/2 Patch Master) SEBELUM Alok Editor/Quick Alokasi
     pernah dibuka di sesi ini - tanpa guard ini window.__obligationLookup
     bisa undefined dan menyebabkan crash saat baris di bawah menulis ke sana. */
  window.__obligationLookup = window.__obligationLookup || {};
  const ymD = periodeDari?periodeToYearMonth(periodeDari):null;
  const ymS = periodeSampai?periodeToYearMonth(periodeSampai):null;
  const obsAll = kewajibanForSiswaSampai(siswaId, komponenNama, periodeSampai);
  obsAll.forEach(ob=>{ window.__obligationLookup[ob.key]=ob; });
  return sortObligationsChronological(obsAll.filter(ob=>{
    const ym = periodeToYearMonth(ob.periode);
    if(!ym) return false;
    const v = ym.y*12+ym.m;
    if(ymD && v < ymD.y*12+ymD.m) return false;
    if(ymS && v > ymS.y*12+ymS.m) return false;
    return true;
  }));
}
/* ---- "Lunas Sampai" (satu target, bukan Dari+Sampai+Nominal manual): bendahara
   cukup pilih Komponen + periode target ("Lunas Sampai Juni 2027"), sistem
   mencari SENDIRI semua periode yang belum lunas dari yang tertua sampai target
   itu - termasuk periode MASA DEPAN yang belum pernah jadi record apapun
   (kewajibanForSiswaSampai/enumeratePeriodesBulananExtended) - lalu mengisi
   nominal dari SISA PEMBAYARAN transaksi ini secara otomatis. Tidak ada
   "Tambah" per bulan; satu tombol menghasilkan seluruh rencana alokasi
   sekaligus, tetap lewat preview wajib sebelum masuk keranjang. ---- */
function hitungLunasSampaiOtomatis(){
  const ed = State.alokEditor;
  const komponen = val('aloks_komponen');
  const sampai = val('aloks_sampai');
  if(!komponen || !sampai){ toast('Pilih komponen dan periode target ("Lunas Sampai") dulu'); return; }
  /* SEDERHANA: satu klik langsung menghitung DAN memasukkan ke keranjang -
     tidak ada langkah "Terima" terpisah yang mudah terlewat (sumber keluhan
     bendahara: "sudah klik Hitung tapi pas Simpan selalu 'belum ada alokasi
     baru'" - ternyata karena lupa/tidak sadar harus klik Terima dulu).
     "Preview wajib" tetap terpenuhi lewat kartu ringkasan di bawah tombol
     Simpan Alokasi (Total/Sisa/Status) yang selalu tampil sebelum data
     benar-benar tersimpan - dan setiap baris di keranjang tetap bisa dihapus
     satu-satu sebelum Simpan kalau ada yang salah. */
  try{
    const obsOutstanding = obligationsInWindow(ed.activeSiswaId, komponen, '', sampai).filter(o=>sisaObligation(o)-cartPendingFor(o.key)>0.5);
    const totalKebutuhan = obsOutstanding.reduce((s,o)=>s+Math.max(0,sisaObligation(o)-cartPendingFor(o.key)),0);
    const nominalTersedia = alokEditorSisaTransaksi(ed.trxId);
    if(nominalTersedia<=0.5){ toast('Tidak ada sisa pembayaran yang bisa dialokasikan'); return; }
    const fill = greedyFillSorted(obsOutstanding, nominalTersedia);
    if(!fill.plan.length){ toast('Semua periode SPP sampai '+sampai+' sudah lunas - tidak ada yang perlu dialokasikan'); return; }
    fill.plan.forEach(x=>{ State.alokEditor.cart.push({obKey:x.ob.key, nominal:x.nominal}); });
    const dialokasikan = nominalTersedia - fill.sisa;
    const kekurangan = Math.max(0, totalKebutuhan - dialokasikan);
    ed.lunasSampaiHasil = {komponen, sampai, totalKebutuhan, jumlahPeriode:fill.plan.length, dialokasikan, kelebihan:fill.sisa, kekurangan};
    toast(fill.plan.length+' periode langsung ditambahkan ke alokasi (sampai '+sampai+')'+(kekurangan>0.5?('. Kekurangan: '+fmtRp(kekurangan)):'')+(fill.sisa>0.5?('. Kelebihan pembayaran (kredit, tidak hilang): '+fmtRp(fill.sisa)):''));
    rerenderAlokEditor();
  }catch(e){ toast('Gagal menghitung Lunas Sampai: '+e.message); }
}

function setAlokRentangVals(){
  return {komponen:val('alokr_komponen'), dari:val('alokr_dari'), sampai:val('alokr_sampai'), nominal:numval('alokr_nominal')};
}
function hitungRentang(){
  const ed = State.alokEditor;
  const r = setAlokRentangVals();
  State.alokEditor.rentang = Object.assign({}, r, {preview:null});
  if(!r.komponen || !r.dari || !r.sampai){ toast('Lengkapi Komponen, Dari, dan Sampai'); rerenderAlokEditor(); return; }
  if(!r.nominal || r.nominal<=0){ toast('Isi nominal pembayaran'); rerenderAlokEditor(); return; }
  try{
    const obs = obligationsInWindow(ed.activeSiswaId, r.komponen, r.dari, r.sampai);
    const totalSisaSebelum = obs.reduce((s,o)=>s+Math.max(0,sisaObligation(o)-cartPendingFor(o.key)),0);
    const fill = greedyFillSorted(obs, r.nominal);
    if(!fill.plan.length){ toast('Tidak ada periode pada rentang ini yang bisa dialokasikan (sudah lunas semua)'); rerenderAlokEditor(); return; }
    fill.plan.forEach(x=>{ State.alokEditor.cart.push({obKey:x.ob.key, nominal:x.nominal}); });
    const dialokasikan = r.nominal - fill.sisa;
    const kekurangan = Math.max(0, totalSisaSebelum - dialokasikan);
    ed.rentangHasil = {komponen:r.komponen, dari:r.dari, sampai:r.sampai, jumlahPeriode:fill.plan.length, dialokasikan, sisaPembayaran:fill.sisa, kekurangan};
    toast(fill.plan.length+' periode langsung ditambahkan ke alokasi'+(kekurangan>0.5?('. Kekurangan: '+fmtRp(kekurangan)):'')+(fill.sisa>0.5?('. Sisa di luar rentang ini: '+fmtRp(fill.sisa)):''));
    rerenderAlokEditor();
  }catch(e){ toast('Gagal menghitung rentang periode: '+e.message); }
}

/* ---- section 6: mode Otomatis - satu klik langsung menghitung DAN
   menambah ke keranjang (lihat catatan di hitungLunasSampaiOtomatis di atas),
   dipakai bersama Engine 3 (recommendAllocation) yang sama dengan tombol
   "Alokasikan Otomatis" versi lama & One-Click Complete (Engine 4). ---- */
function hitungOtomatis(){
  const siswaId = State.alokEditor.activeSiswaId;
  if(!siswaId){ toast('Pilih siswa dulu'); return; }
  try{
    const sisaTrx = alokEditorSisaTransaksi(State.alokEditor.trxId);
    if(sisaTrx<=0.5){ toast('Tidak ada sisa pembayaran untuk dialokasikan'); return; }
    const rec = recommendAllocation(siswaId, sisaTrx);
    if(!rec.plan.length){ toast('Tidak ada kewajiban aktif untuk direkomendasikan'); return; }
    rec.plan.forEach(p=>{ State.alokEditor.cart.push({obKey:p.ob.key, nominal:p.nominal}); });
    State.alokEditor.otomatisHasil = {jumlahPeriode:rec.plan.length, sisa:rec.sisa};
    toast(rec.plan.length+' kewajiban langsung ditambahkan ke alokasi (tertua dulu)'+(rec.sisa>0.5?('. Sisa: '+fmtRp(rec.sisa)):''));
    rerenderAlokEditor();
  }catch(e){ toast('Gagal menghitung alokasi otomatis: '+e.message); }
}

/* Patch "UI Pemula - Alokasi per Tagihan": mode tabel dipecah jadi 2 langkah
   yang jelas urutannya - (A) pilih "Tagihan" (bundel kewajiban per Periode,
   mis. September 2026 bisa berisi SPP+Catering+Ketering sekaligus), lalu
   (B) baru masuk rincian komponen di tagihan itu untuk diisi nominalnya.
   Data & validasi di baliknya 100% pakai kewajibanTableRows/cartPendingFor/
   createAlokasi yang sama - ini murni penataan ulang tampilan supaya alur
   dipahami bendahara baru tanpa perlu paham istilah "obligation"/"cart". */
function alokTagihanGroups(siswaId, filter){
  const rows = kewajibanTableRows(siswaId, filter);
  const byPeriode = {};
  rows.forEach(ob=>{
    if(!byPeriode[ob.periode]) byPeriode[ob.periode] = [];
    byPeriode[ob.periode].push(ob);
  });
  const groups = Object.keys(byPeriode).map(periode=>{
    const obs = byPeriode[periode];
    const totalNetto = obs.reduce((s,o)=>s+Number(o.netto||0),0);
    const totalTerbayar = obs.reduce((s,o)=>s+alokasiTerbayar(o),0);
    const totalSisaTampil = obs.reduce((s,o)=>s+Math.max(0,sisaObligation(o)-cartPendingFor(o.key)),0);
    const adaDiKeranjang = obs.some(o=>cartPendingFor(o.key)>0.5);
    return {periode, obs, totalNetto, totalTerbayar, totalSisaTampil, adaDiKeranjang};
  });
  return sortObligationsChronological(groups);
}

function guessKomponenFromCatatan(catatan){
  if(!catatan) return null;
  const s = String(catatan).toLowerCase();
  const komponenList = Store.loadSettings().komponenBiayaList||[];
  const matches = komponenList.filter(k=>s.indexOf(k.nama.toLowerCase())>=0);
  matches.sort((a,b)=>b.nama.length-a.nama.length);
  return matches.length ? matches[0].nama : null;
}

  State.quickAlok = {trxId, komponen: komponenList.some(k=>k.nama===guessed)?guessed:komponenList[0].nama};

/* Patch Master "Smart Allocation - Preview Wajib": satu fungsi preview
   dipakai bersama oleh Quick Alokasi (Lunas Sampai) dan Form Penerimaan
   (Lunas Sampai) - dihitung dengan greedyFillSorted/obligationsInWindow
   yang SAMA dipakai saat commit, TANPA menulis apapun (murni simulasi). */
function previewLunasSampaiAlokasi(siswaId, komponenNama, sampaiLabel, nominalTersedia){
  if(!sampaiLabel || !(nominalTersedia>0)) return null;
  const obsOutstanding = obligationsInWindow(siswaId, komponenNama, '', sampaiLabel).filter(o=>sisaObligation(o)>0.5);
  const fill = greedyFillSorted(obsOutstanding, nominalTersedia);
  const dialokasikan = nominalTersedia - fill.sisa;
  return {jumlahPeriode: fill.plan.length, dialokasikan, sisaKredit: fill.sisa, totalPembayaran: nominalTersedia};
}

function simpanQuickLunasSampai(){
  const qa = State.quickAlok;
  const sampai = val('qa_sampai');
  if(!sampai){ toast('Pilih periode "Lunas Sampai" dulu'); return; }
  const t = transaksiById(qa.trxId);
  try{
    const obsOutstanding = obligationsInWindow(t.siswaId, qa.komponen, '', sampai).filter(o=>sisaObligation(o)>0.5);
    const nominalTersedia = sisaBelumDialokasikan(qa.trxId);
    if(nominalTersedia<=0.5){ toast('Tidak ada sisa pembayaran untuk dialokasikan'); return; }
    const totalKebutuhan = obsOutstanding.reduce((s,o)=>s+sisaObligation(o),0);
    const fill = greedyFillSorted(obsOutstanding, nominalTersedia);
    if(!fill.plan.length){ toast('Semua periode '+qa.komponen+' sampai '+sampai+' sudah lunas'); return; }
    createAlokasi(qa.trxId, fill.plan);
    const dialokasikan = nominalTersedia - fill.sisa;
    const kekurangan = Math.max(0, totalKebutuhan - dialokasikan);
    toast(fill.plan.length+' periode '+qa.komponen+' dialokasikan sampai '+sampai+(kekurangan>0.5?('. Kekurangan: '+fmtRp(kekurangan)):'')+(fill.sisa>0.5?('. Kelebihan pembayaran (kredit, tidak hilang): '+fmtRp(fill.sisa)):''));
    closeModal();
    renderContent();
  }catch(e){ toast('Gagal menyimpan: '+e.message); }
}

function submitBukti(trxId){
  /* [P1-E] Bukti WAJIB berfile. [TC-FAIL-05 / GAP-024] Untuk transaksi server, file diunggah SINKRON ke server

  const fileInput = document.getElementById('bk_file');

  reader.onload = ()=>{

    if(ccIsLegacyLocalTrx_(trxId)){ // baris lokal lama (pra-cutover): perilaku lama tanpa perubahan status
      const dok = Store.loadDokumen();
      const d = {id:uid('dok'), kategori:meta.kategori, transaksiId:trxId, fileRef:reader.result||'', judul:meta.judul, tanggal:todayISO()};
      dok.push(d); Store.saveDokumen(dok);
      const arr = Store.loadTransaksi(); const idx = arr.findIndex(t=>t.id===trxId);
      if(idx>=0){ arr[idx].buktiId = (arr[idx].buktiId||[]).concat([d.id]); Store.saveTransaksi(arr); }
      auditTrailPush('LAMPIRKAN_BUKTI', null, d, 'manual');
      closeModal(); toast('Bukti tersimpan (data lokal lama). Status transaksi TIDAK diubah otomatis.'); renderContent();
      return;
    }
    closeModal();
    buktiUploadNow_(trxId, meta, reader.result);
  };
  reader.readAsDataURL(fileInput.files[0]);
}
/* [P1-E] Transaksi lokal lama yang tidak pernah dikirim ke server (bukan antrean baru). */
function ccIsLegacyLocalTrx_(id){ return !!id && !centralIsServerTrx(centralResolveTrxId(id)) && Store.loadTransaksi().some(t=>t.id===id && !t._pendingSync); }
/* [P1-E / TC-FAIL-05] Unggah bukti langsung ke server; hasil (berhasil/gagal) selalu ditampilkan. Selama unggahan
   berjalan, menutup halaman memunculkan peringatan browser. trxId kosong = dokumen tanpa transaksi. */
function buktiUploadNow_(trxId, meta, dataUrl){
  meta = meta || {};
  const parts = ccDataUrlParts_(dataUrl);
  if(!parts){ toast('File bukti tidak terbaca - bukti TIDAK disimpan.'); return Promise.resolve({ok:false, code:'VALIDATION_ERROR'}); }
  if(!(centralReady_() && ServerBridge.opUploadBukti)){ toast('Gagal menyimpan bukti: ' + centralNotReadyText_()); return Promise.resolve({ok:false, code:'NOT_READY'}); }
  const sid = trxId ? centralResolveTrxId(trxId) : '';
  if(sid && !centralIsServerTrx(sid)){ toast('Transaksi belum dikonfirmasi server - lampirkan bukti setelah transaksi tersimpan. Bukti TIDAK disimpan.'); return Promise.resolve({ok:false, code:'TRX_NOT_CONFIRMED'}); }
  const ext = {'application/pdf':'.pdf','image/png':'.png','image/jpeg':'.jpg','image/webp':'.webp','image/gif':'.gif'}[parts.mime] || '';
  const judul = ccStr_(meta.judul) || ('Bukti ' + (sid || 'dokumen'));
  globalThis.__buktiUploading = (globalThis.__buktiUploading || 0) + 1; ccBuktiUnloadGuard_();
  toast('Mengunggah bukti ke server - jangan tutup halaman...');
  const done = function(){ globalThis.__buktiUploading = Math.max(0, (globalThis.__buktiUploading || 1) - 1); };
  return ServerBridge.opUploadBukti(JSON.parse(JSON.stringify({id:uid('dok'), mimeType:parts.mime, base64:parts.b64, fileName:judul + ext, transaksiId:sid, kategori:meta.kategori || 'Bukti', judul:judul, tanggal:todayISO()}))).then(function(res){
    done();
    if(!res || !res.ok){ toast('GAGAL mengunggah bukti: ' + centralErrText(res) + ' - bukti TIDAK tersimpan, silakan ulangi.'); return res || {ok:false, code:'SERVER_ERROR'}; }
    auditTrailPush(meta.aksi || 'LAMPIRKAN_BUKTI', null, res.data, 'manual');
    toast('Bukti tersimpan di server (Drive). Status transaksi TIDAK diubah otomatis.');
    return loadOperationalData(['bukti']).then(function(){ renderContent(); return res; });
  }, function(e){ done(); toast('GAGAL mengunggah bukti: ' + ((e && e.message) || e) + ' - bukti TIDAK tersimpan, silakan ulangi.'); return {ok:false, code:'NETWORK_ERROR'}; });
}
function ccBuktiUnloadGuard_(){
  if(globalThis.__buktiUnloadGuard) return; globalThis.__buktiUnloadGuard = true;
  try{ window.addEventListener('beforeunload', function(ev){ if((globalThis.__buktiUploading || 0) > 0){ ev.preventDefault(); ev.returnValue = 'Unggahan bukti belum selesai'; return ev.returnValue; } }); }catch(e){ /* lingkungan tanpa window */ }
}

/* ============================================================
   ENGINE 2 - SMART MATCHING (mutasi/transaksi -> siswa, siswa
   pengganti pencarian manual dgn skor+alasan). Engine 5 -
   RECONCILIATION ASSISTANT (mutasi <-> transaksi, cegah double
   counting). Keduanya HANYA memberi SUGGESTION - tidak pernah
   menulis data tanpa klik konfirmasi eksplisit dari user.
   ============================================================ */
function scoreSiswaMatch(siswa, params){
  let score = 0; const reasons = [];
  if(params.nisn && ((siswa.nis&&siswa.nis===params.nisn)||(siswa.nisn&&siswa.nisn===params.nisn))){ score+=60; reasons.push('NIS/NISN cocok'); }
  if(params.nama){
    const sim = stringSimilarity((siswa.nama||'').toLowerCase(), String(params.nama).toLowerCase());
    if(sim>=0.98){ score+=40; reasons.push('Nama cocok persis'); }
    else if(sim>=0.6){ score+=Math.round(sim*35); reasons.push('Nama mirip ('+Math.round(sim*100)+'%)'); }
  }
  if(params.nominal){
    const ob = kewajibanForSiswa(siswa.id).filter(o=>sisaObligation(o)>0);
    if(ob.some(o=>Math.abs(sisaObligation(o)-Number(params.nominal))<1)){ score+=20; reasons.push('Nominal cocok dengan salah satu kewajiban aktif'); }
    else if(ob.length){ score+=5; reasons.push('Ada kewajiban aktif (nominal tidak persis cocok)'); }
  }
  return {siswa, score:Math.min(100,score), reasons};
}
function findSiswaCandidates(params){
  return MasterAPI.students().filter(s=>(s.status||'Aktif')==='Aktif').map(s=>scoreSiswaMatch(s,params)).filter(r=>r.score>=30).sort((a,b)=>b.score-a.score).slice(0,5);
}
function matchStatusLabel(score){
  if(score>=90) return {label:'MATCH PASTI', cls:'green'};
  if(score>=50) return {label:'MATCH KEMUNGKINAN', cls:'amber'};
  return {label:'TIDAK DITEMUKAN', cls:'red'};
}

/* ---- Reconciliation Assistant: cegah transaksi ganda dari Mutasi Bank ---- */
function scoreTransaksiMatch(t, m){
  let score=0; const reasons=[];
  if(Math.abs(Number(t.nominal||0)-Number(m.nominal||0))<1){ score+=50; reasons.push('Nominal sama'); }
  else return {t, score:0, reasons:[]};
  const dayDiff = Math.abs((new Date(t.tanggal)-new Date(m.tanggal))/86400000);
  if(dayDiff===0){ score+=30; reasons.push('Tanggal sama persis'); }
  else if(dayDiff<=1){ score+=20; reasons.push('Tanggal berselisih maks 1 hari'); }
  if(m.ftNumber && t.ftNumber && m.ftNumber===t.ftNumber){ score+=20; reasons.push('Nomor referensi (FT) sama'); }
  if(m.namaPengirim && t.namaPengirim && m.namaPengirim.toLowerCase()===t.namaPengirim.toLowerCase()){ score+=15; reasons.push('Nama pengirim sama'); }
  return {t, score:Math.min(100,score), reasons};
}
function findTransaksiCandidatesForMutasi(m){
  const linkedIds = new Set(Store.loadMutasiBank().filter(x=>x.transaksiId).map(x=>x.transaksiId));
  return penerimaanList().filter(t=>!linkedIds.has(t.id)).map(t=>scoreTransaksiMatch(t,m)).filter(r=>r.score>=40).sort((a,b)=>b.score-a.score).slice(0,5);
}

function linkMutasiToTransaksi(mutId, trxId){
  /* [P1-C] Mutasi yang tersimpan di server dicocokkan lewat opMatchMutasi (nominal sama, transaksi aktif, tanpa
     pencocokan ganda - divalidasi server). Baris lokal lama (belum dimigrasi) memakai jalur lama. */
  if(ccMutasiOnServer_(mutId)){
    if(!ServerBridge.opMatchMutasi){ toast('Server belum mendukung pencocokan mutasi - data TIDAK diubah.'); return; }
    const tid = centralResolveTrxId(trxId);
    if(tid === trxId && ccIsLocalPendingTrx_(trxId)){ toast('Transaksi belum dikonfirmasi server - cocokkan setelah transaksi tersimpan.'); return; }
    const before = deepClone(Store.loadMutasiBank().find(x=>x.id===mutId) || {id:mutId});
    toast('Mencocokkan mutasi di server - menunggu konfirmasi...');
    return ServerBridge.opMatchMutasi({mutasiId:mutId, transaksiId:tid}).then(function(res){
      if(!res || !res.ok){ toast('GAGAL mencocokkan mutasi: ' + centralErrText(res)); return false; }
      if(!(res.data && res.data.unchanged)) auditTrailPush('COCOKKAN_MUTASI_TRANSAKSI', before, res.data, 'reconciliation-assistant');
      closeModal(); toast('Mutasi dicocokkan ke transaksi yang sudah ada - TIDAK ada transaksi baru dibuat (dikonfirmasi server)');
      return loadOperationalData(['mutasiBank']).then(function(){ renderContent(); return true; });
    });
  }
  const arr = Store.loadMutasiBank();
  const idx = arr.findIndex(m=>m.id===mutId);
  const before = deepClone(arr[idx]);
  arr[idx].status='DIPROSES'; arr[idx].transaksiId=trxId;
  Store.saveMutasiBank(arr);
  auditTrailPush('COCOKKAN_MUTASI_TRANSAKSI', before, arr[idx], 'reconciliation-assistant');
  closeModal(); toast('Mutasi dicocokkan ke transaksi yang sudah ada - TIDAK ada transaksi baru dibuat'); renderContent();
}
/* [P1-C] Mutasi ini sudah ada di 11_MUTASI_BANK server (bukan baris lokal lama). */
function ccMutasiOnServer_(mutId){ return ccWriteActive_() && ccActive_('mutasiBank') && ccSrv_('mutasiBank').byId.has(mutId); }
function createTransaksiFromMutasi(mutId){
  const unit = val('mtu_unit');
  if(!unit){ toast('Unit (TK/MI) wajib dipilih'); return; }
  const arr = Store.loadMutasiBank();
  const idx = arr.findIndex(m=>m.id===mutId);
  const m = arr[idx];
  const onServer = ccMutasiOnServer_(mutId); // [P1-C]
  if(onServer && !ServerBridge.opMatchMutasi){ toast('Gagal memproses mutasi: server belum mendukung pencocokan mutasi - TIDAK disimpan.'); return; }
  let trx;
  try{
    trx = postTransaksi({jenis:'PENERIMAAN', tanggal:m.tanggal, sumber:'Mutasi Bank', akunId:akunList().find(a=>a.jenis==='Bank')?.id||akunList()[0].id, unit, nominal:m.nominal, metode:'Transfer Bank', status:'TERCATAT', catatan:m.keterangan, namaPengirim:m.namaPengirim||undefined, ftNumber:m.ftNumber||undefined});
  }catch(e){ toast('Gagal memproses mutasi: '+e.message); return; }
  if(onServer){
    /* [P1-C] Mutasi dicocokkan (opMatchMutasi) SETELAH transaksi barunya dikonfirmasi server - lihat ccMutMatchJobs_. */
    const pp = ccMutMatchPend_(); pp[mutId] = {trxId:trx.id, attempts:0}; lsSet(lsKey('central_pending_mutmatch'), pp);
    auditTrailPush('PROSES_MUTASI_BANK', null, Object.assign({}, m, {transaksiId:trx.id}), 'manual');
    closeModal(); toast('Transaksi penerimaan dikirim ke server - mutasi dicocokkan setelah transaksi dikonfirmasi'); centralScheduleSync(); renderContent();
    return;
  }
  arr[idx].status='DIPROSES'; arr[idx].transaksiId=trx.id;
  Store.saveMutasiBank(arr);
  auditTrailPush('PROSES_MUTASI_BANK', null, arr[idx], 'manual');
  closeModal(); toast('Mutasi diproses menjadi transaksi penerimaan baru'); renderContent();
}

/* ---- Engine 4: ONE-CLICK ALLOCATE & COMPLETE ----
   Hanya berjalan bila confidence TINGGI dan tidak ada konflik. Selain itu
   fallback ke editor manual (openAlokasiEditor) - tidak pernah memaksa. */
function evaluateOneClickReadiness(trxId){
  const t = transaksiById(trxId);
  if(!t || t.jenis!=='PENERIMAAN' || isMigrationArtifact(t)) return {ready:false, reason:'Bukan transaksi penerimaan yang berlaku'};
  const sisa = sisaBelumDialokasikan(trxId);
  if(sisa<=0.5) return {ready:false, reason:'Sudah teralokasi penuh'};
  let siswaId = t.siswaId, candidate = null;
  if(!siswaId){
    const candidates = findSiswaCandidates({nama:t.namaPengirim||t.sumber, nominal:sisa});
    if(candidates.length && candidates[0].score>=90 && (candidates.length===1 || candidates[0].score-candidates[1].score>=15)){
      candidate = candidates[0]; siswaId = candidate.siswa.id;
    } else return {ready:false, reason:'Kandidat siswa belum pasti (confidence rendah/ambigu) - perlu konfirmasi manual'};
  }
  const rec = recommendAllocation(siswaId, sisa);
  if(!rec.plan.length) return {ready:false, reason:'Tidak ada kewajiban aktif untuk dialokasikan'};
  const conflict = allTransaksi().some(o=>o.id!==trxId && o.jenis==='PENERIMAAN' && o.tanggal===t.tanggal && Math.abs(Number(o.nominal||0)-Number(t.nominal||0))<1 && o.siswaId===siswaId);
  if(conflict) return {ready:false, reason:'Berpotensi duplikat dengan transaksi lain bernominal sama'};
  return {ready:true, siswaId, candidate, plan:rec.plan, sisaSetelah:rec.sisa};
}
function oneClickComplete(trxId){
  const ev = evaluateOneClickReadiness(trxId);
  if(!ev.ready){ toast('Belum siap diselesaikan otomatis: '+(ev.reason||'-')+'. Dialihkan ke Atur Alokasi manual.'); openAlokasiEditor(trxId); return; }
  const t = transaksiById(trxId);
  if(!t.siswaId){
    const r = centralPatchTransaksi(trxId, {siswaId:ev.siswaId, status:'TERIDENTIFIKASI'});
    auditTrailPush('MATCH_STUDENT', r.before, r.after, 'one-click');
  }
  try{ createAlokasi(trxId, ev.plan); }catch(e){ toast('Gagal alokasi otomatis: '+e.message); openAlokasiEditor(trxId); return; }
  auditTrailPush('ONE_CLICK_COMPLETE', null, {transaksiId:trxId, siswaId:ev.siswaId, jumlahAlokasi:ev.plan.length, sisaSetelah:ev.sisaSetelah}, 'one-click');
  toast('Transaksi diselesaikan otomatis (1 klik)'+(ev.sisaSetelah>0.5?('. Sisa tetap unallocated: '+fmtRp(ev.sisaSetelah)):'')); renderContent();
}

function realisasiForProgram(program, periode){
  return pengeluaranList().filter(t=>t.kategori===program && (!periode||periodeOfDate(t.tanggal)===periode)).reduce((s,t)=>s+Number(t.nominal||0),0);
}
function komitmenForRab(rabId){
  return Store.loadObligasi().filter(o=>o.rabId===rabId && (o.status==='COMMITTED'||o.status==='INCURRED')).reduce((s,o)=>s+Number(o.nominal||0),0);
}
function renderAnggaranKomitmen(){
  let html = '<div class="tabs">'+
    ['anggaran','rab','komitmen','realisasi','sisa','banding'].map(t=>{
      const labels={anggaran:'Anggaran', rab:'RAB', komitmen:'Komitmen', realisasi:'Realisasi', sisa:'Sisa', banding:'Anggaran vs Aktual'};
      return '<button class="'+(State.anggaranTab===t?'active':'')+'" onclick="State.anggaranTab=\''+t+'\';renderContent()">'+labels[t]+'</button>';
    }).join('')+'</div>';
  const anggaran = Store.loadAnggaran();
  if(State.anggaranTab==='anggaran' || State.anggaranTab==='rab'){
    const base = State.anggaranTab==='rab' ? anggaran.filter(a=>a.status) : anggaran;
    const key = State.anggaranTab==='rab' ? 'rabTab' : 'anggaranTab';
    const cfg = {searchLabel:'Cari program', searchFields:['program'], selects:[{field:'status', label:'Status', options:['Diajukan','Disetujui']}],
      periodeExact:'periode', periodeOptions:Array.from(new Set(base.map(a=>a.periode)))};
    const rows = tblApply(base, key, cfg);
    html += '<div style="margin-bottom:8px"><button class="btn primary" onclick="openAnggaranForm()">+ Tambah '+ (State.anggaranTab==='rab'?'RAB':'Anggaran') +'</button></div>';
    html += tblFilterBar(key, cfg, base.length, rows.length);
    html += '<div class="tablewrap"><table><thead><tr>'+sortableTh(key,'program','Program')+'<th>Periode</th>'+sortableTh(key,'nominal','Nominal')+'<th>Status</th><th>Jenis</th></tr></thead><tbody>';
    if(!rows.length) html += '<tr><td colspan="5" class="empty">Tidak ada data sesuai filter.</td></tr>';
    rows.forEach(a=>{ html += '<tr><td>'+esc(a.program)+(a.jenis==='PEMASUKAN'?' <span class="badge green">PEMASUKAN</span>':'')+'</td><td>'+esc(a.periode)+'</td><td>'+fmtRp(a.nominal)+'</td><td><span class="badge blue">'+esc(a.status||'Diajukan')+'</span></td><td><span class="badge gray">PLANNED</span></td></tr>'; });
    html += '</tbody></table></div>';
  } else if(State.anggaranTab==='komitmen'){
    const oblig = Store.loadObligasi();
    const cfg = {searchLabel:'Cari uraian', searchFields:['uraian'], selects:[{field:'status', label:'Status', options:['EXPECTED','COMMITTED','INCURRED','PAID']}]};
    const rows = tblApply(oblig, 'komitmenTab', cfg);
    html += '<div style="margin-bottom:8px"><button class="btn primary" onclick="openObligasiForm()">+ Tambah Komitmen</button></div>';
    html += tblFilterBar('komitmenTab', cfg, oblig.length, rows.length);
    html += '<div class="tablewrap"><table><thead><tr>'+sortableTh('komitmenTab','uraian','Uraian')+sortableTh('komitmenTab','nominal','Nominal')+'<th>Status</th><th>RAB Terkait</th><th>Ubah Status</th></tr></thead><tbody>';
    if(!rows.length) html += '<tr><td colspan="5" class="empty">Tidak ada data sesuai filter.</td></tr>';
    rows.forEach(o=>{
      const rab = anggaran.find(a=>a.id===o.rabId);
      const cls = {EXPECTED:'gray',COMMITTED:'amber',INCURRED:'red',PAID:'green'}[o.status]||'gray';
      html += '<tr><td>'+esc(o.uraian)+'</td><td>'+fmtRp(o.nominal)+'</td><td><span class="badge '+cls+'">'+esc(o.status)+'</span></td><td>'+(rab?esc(rab.program):'-')+'</td>'+
        '<td><select onchange="updateObligasiStatus(\''+o.id+'\',this.value)"><option>-</option>'+['EXPECTED','COMMITTED','INCURRED','PAID'].map(s=>'<option value="'+s+'">'+s+'</option>').join('')+'</select></td></tr>';
    });
    html += '</tbody></table></div>';
  } else if(State.anggaranTab==='realisasi'){
    html += '<div class="tablewrap"><table><thead><tr><th>Program</th><th>Anggaran</th><th>Realisasi (Actual)</th><th>%</th></tr></thead><tbody>';
    if(!anggaran.length) html += '<tr><td colspan="4" class="empty">Belum ada data</td></tr>';
    anggaran.forEach(a=>{ const real = realisasiForProgram(a.program, a.periode); html += '<tr><td>'+esc(a.program)+'</td><td>'+fmtRp(a.nominal)+'</td><td>'+fmtRp(real)+'</td><td>'+(a.nominal? Math.round(real/a.nominal*100):0)+'%</td></tr>'; });
    html += '</tbody></table></div>';
  } else if(State.anggaranTab==='banding'){
    html += renderAnggaranBanding();
  } else {
    html += '<div class="tablewrap"><table><thead><tr><th>Program</th><th>Anggaran</th><th>Realisasi</th><th>Komitmen</th><th>Sisa</th></tr></thead><tbody>';
    if(!anggaran.length) html += '<tr><td colspan="5" class="empty">Belum ada data</td></tr>';
    anggaran.forEach(a=>{ const real=realisasiForProgram(a.program,a.periode); const kom=komitmenForRab(a.id); const sisa=Number(a.nominal||0)-real-kom; html += '<tr><td>'+esc(a.program)+'</td><td>'+fmtRp(a.nominal)+'</td><td>'+fmtRp(real)+'</td><td>'+fmtRp(kom)+'</td><td>'+fmtRp(sisa)+'</td></tr>'; });
    html += '</tbody></table></div>';
  }
  return html;
}

  if(!status || status==='-') return;
  const arr = Store.loadObligasi();

  arr[idx].status = status;
  Store.saveObligasi(arr);
  auditTrailPush('UBAH_STATUS_OBLIGASI', before, arr[idx], 'manual');
  toast('Status komitmen diperbarui'); renderContent();
}

function downloadCSV(filename, headers, rows){
  const esc2 = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv = [headers.map(esc2).join(',')].concat(rows.map(r=>r.map(esc2).join(','))).join('\r\n');

/* ============================================================
   19. XLSX / DOCX EXPORT ENGINE (PATCH MASTER section 32/36-38).
   Ditanam LANGSUNG di file ini (bukan CDN/library pihak ketiga) supaya
   HTML tetap satu file offline - tapi menghasilkan .xlsx/.docx BINER ASLI
   (ZIP + OOXML standar), bukan CSV yang diberi nama .xlsx. ZIP ditulis
   metode STORED (tanpa kompresi) - tetap file ZIP yang sah dan dibuka
   normal oleh Excel/Word, hanya lebih besar ukurannya.
   ============================================================ */
const CRC32_TABLE = (function(){
  const t = new Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1);
    t[n] = c>>>0;
  }
  return t;
})();
function crc32Bytes(bytes){
  let c = 0xFFFFFFFF;
  for(let i=0;i<bytes.length;i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c>>>8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function utf8Bytes(str){ return new TextEncoder().encode(String(str)); }
function zipDosDateTime(d){
  d = d || new Date();
  const time = ((d.getHours()&0x1F)<<11) | ((d.getMinutes()&0x3F)<<5) | (Math.floor(d.getSeconds()/2)&0x1F);
  const date = (((d.getFullYear()-1980)&0x7F)<<9) | (((d.getMonth()+1)&0xF)<<5) | (d.getDate()&0x1F);
  return {time, date};
}
function pushU16(arr,v){ arr.push(v&0xFF,(v>>>8)&0xFF); }
function pushU32(arr,v){ arr.push(v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF); }
/* files: [{name, data:(string|Uint8Array)}]. Mengembalikan Uint8Array ZIP
   lengkap (local headers + central directory + EOCD) - format minimal yang
   dipahami SEMUA pembaca ZIP/XLSX/DOCX standar (Word/Excel/7-Zip/dst). */
function buildZipArchive(files){
  const {time, date} = zipDosDateTime();
  const localChunks = [], centralChunks = [];
  let offset = 0;
  files.forEach(f=>{
    const nameBytes = utf8Bytes(f.name);
    const data = typeof f.data==='string' ? utf8Bytes(f.data) : f.data;
    const crc = crc32Bytes(data);
    const lh = [];
    pushU32(lh,0x04034b50); pushU16(lh,20); pushU16(lh,0x0800); pushU16(lh,0);
    pushU16(lh,time); pushU16(lh,date); pushU32(lh,crc); pushU32(lh,data.length); pushU32(lh,data.length);
    pushU16(lh,nameBytes.length); pushU16(lh,0);
    const lhBytes = new Uint8Array(lh);
    localChunks.push(lhBytes, nameBytes, data);

    const ch = [];
    pushU32(ch,0x02014b50); pushU16(ch,20); pushU16(ch,20); pushU16(ch,0x0800); pushU16(ch,0);
    pushU16(ch,time); pushU16(ch,date); pushU32(ch,crc); pushU32(ch,data.length); pushU32(ch,data.length);
    pushU16(ch,nameBytes.length); pushU16(ch,0); pushU16(ch,0); pushU16(ch,0); pushU16(ch,0); pushU32(ch,0);
    pushU32(ch,offset);
    centralChunks.push(new Uint8Array(ch), nameBytes);

    offset += lhBytes.length + nameBytes.length + data.length;
  });
  const centralStart = offset;
  let centralSize = 0; centralChunks.forEach(p=>{ centralSize += p.length; });
  const eocd = [];
  pushU32(eocd,0x06054b50); pushU16(eocd,0); pushU16(eocd,0);
  pushU16(eocd,files.length); pushU16(eocd,files.length);
  pushU32(eocd,centralSize); pushU32(eocd,centralStart); pushU16(eocd,0);
  const all = localChunks.concat(centralChunks, [new Uint8Array(eocd)]);
  let total = 0; all.forEach(p=>total+=p.length);
  const out = new Uint8Array(total);
  let pos = 0; all.forEach(p=>{ out.set(p,pos); pos+=p.length; });
  return out;
}
function xmlEsc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;'); }
function xlsxColLetter(n){ let s=''; while(n>0){ const rem=(n-1)%26; s=String.fromCharCode(65+rem)+s; n=Math.floor((n-1)/26); } return s; }
/* Blok header laporan profesional (section 32/37): Yayasan/Unit/Judul/
   Periode/Tanggal Cetak - dipakai SAMA di XLSX dan DOCX supaya konsisten. */

}
/* ---- XLSX ---- */
function buildXlsxSheetXml(meta, headers, rows, currencyCols){
  let rowsXml = '', rIdx = 1;
  meta.forEach(line=>{ rowsXml += '<row r="'+rIdx+'"><c r="A'+rIdx+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(line)+'</t></is></c></row>'; rIdx++; });
  rIdx++;
  const headerRow = rIdx;
  rowsXml += '<row r="'+rIdx+'">'+headers.map((h,i)=>'<c r="'+xlsxColLetter(i+1)+rIdx+'" s="1" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(h)+'</t></is></c>').join('')+'</row>';
  rIdx++;
  rows.forEach(r=>{
    rowsXml += '<row r="'+rIdx+'">'+r.map((v,i)=>{
      const ref = xlsxColLetter(i+1)+rIdx;
      const isCurrency = currencyCols && currencyCols.indexOf(i)>=0;
      const numeric = typeof v==='number' || (isCurrency && v!=='' && v!=null && !isNaN(Number(v)));
      if(numeric) return '<c r="'+ref+'" s="'+(isCurrency?'2':'0')+'"><v>'+(Number(v)||0)+'</v></c>';
      return '<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(v)+'</t></is></c>';
    }).join('')+'</row>';
    rIdx++;
  });
  const lastRow = Math.max(rIdx-1,1), lastCol = xlsxColLetter(Math.max(headers.length,1));
  const wide = headers.length>6;
  return '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>'+
    '<dimension ref="A1:'+lastCol+lastRow+'"/>'+
    '<sheetViews><sheetView tabSelected="1" workbookViewId="0"><pane ySplit="'+headerRow+'" topLeftCell="A'+(headerRow+1)+'" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>'+
    '<cols>'+headers.map((h,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+Math.max(12,Math.min(40,String(h).length+6))+'" customWidth="1"/>').join('')+'</cols>'+
    '<sheetData>'+rowsXml+'</sheetData>'+
    '<autoFilter ref="A'+headerRow+':'+lastCol+lastRow+'"/>'+
    '<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>'+
    '<pageSetup paperSize="9" orientation="'+(wide?'landscape':'portrait')+'" fitToWidth="1" fitToHeight="0" scale="100"/>'+
    '<headerFooter><oddFooter>&amp;C&amp;P of &amp;N&amp;R'+xmlEsc(Store.loadSettings().sekolah||'')+'</oddFooter></headerFooter>'+
    '</worksheet>';
}
/* Sheet "Laporan" (section 37) - Header Yayasan/Unit/Judul/Periode/Tanggal
   Cetak, tabel bold header + AutoFilter + freeze pane + format Rupiah kolom
   nominal + kolom lebar otomatis + print area A4/fit-to-width/repeat header
   (section 38) - semua dalam SATU pemanggilan generik. */
function buildXlsxWorkbook(title, meta, headers, rows, currencyCols){
  const headerRowNum = meta.length + 2;
  const contentTypes = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
    '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
    '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '</Types>';
  const rootRels = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '</Relationships>';
  const coreProps = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/">'+
    '<dc:title>'+xmlEsc(title)+'</dc:title><dc:creator>Bendahara V2</dc:creator></cp:coreProperties>';
  const workbookXml = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
    '<sheets><sheet name="Laporan" sheetId="1" r:id="rId1"/></sheets>'+
    '<definedNames><definedName name="_xlnm.Print_Titles" localSheetId="0">Laporan!$'+headerRowNum+':$'+headerRowNum+'</definedName></definedNames>'+
    '</workbook>';
  const workbookRels = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
    '</Relationships>';
  const stylesXml = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;Rp&quot;#,##0"/></numFmts>'+
    '<fonts count="2"><font><sz val="10"/><name val="Calibri"/></font><font><b/><sz val="10"/><name val="Calibri"/></font></fonts>'+
    '<fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills>'+
    '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
    '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'+
    '<cellXfs count="3">'+
    '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
    '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
    '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
    '</cellXfs></styleSheet>';
  const sheetXml = buildXlsxSheetXml(meta, headers, rows, currencyCols);
  return buildZipArchive([
    {name:'[Content_Types].xml', data:contentTypes},
    {name:'_rels/.rels', data:rootRels},
    {name:'docProps/core.xml', data:coreProps},
    {name:'xl/workbook.xml', data:workbookXml},

function triggerBinaryDownload(filename, bytes, mime){
  const blob = new Blob([bytes], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
/* API generik dipakai seluruh halaman Laporan (signature sama dengan
   downloadCSV lama supaya retrofit tiap tombol export minimal perubahan). */
function downloadXLSX(filename, title, headers, rows, opts){
  opts = opts||{};
  const meta = reportMetaLines(title, opts.periodeLabel);
  const bytes = buildXlsxWorkbook(title, meta, headers, rows, opts.currencyCols||[]);
  triggerBinaryDownload(filename, bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}
/* ---- DOCX ---- */
function docxTableXml(headers, rows){
  const gridCols = headers.map(()=>'<w:gridCol w:w="2000"/>').join('');
  const headerRow = '<w:tr>'+headers.map(h=>'<w:tc><w:tcPr><w:shd w:val="clear" w:fill="E5E7EB"/></w:tcPr><w:p><w:r><w:rPr><w:b/></w:rPr><w:t xml:space="preserve">'+xmlEsc(h)+'</w:t></w:r></w:p></w:tc>').join('')+'</w:tr>';
  const dataRows = rows.map(r=>'<w:tr>'+r.map(v=>'<w:tc><w:p><w:r><w:t xml:space="preserve">'+xmlEsc(v)+'</w:t></w:r></w:p></w:tc>').join('')+'</w:tr>').join('');
  return '<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders>'+
    ['top','left','bottom','right','insideH','insideV'].map(b=>'<w:'+b+' w:val="single" w:sz="4" w:space="0" w:color="D1D5DB"/>').join('')+
    '</w:tblBorders></w:tblPr><w:tblGrid>'+gridCols+'</w:tblGrid>'+headerRow+dataRows+'</w:tbl>';
}
/* Dokumen Word profesional (section 36): Header/Judul/Unit/Periode/
   Ringkasan/Tabel/Total/Footer, editable, landscape otomatis untuk tabel
   lebar - dibangun dari headers/rows YANG SAMA dengan versi Excel supaya
   isinya identik, hanya bentuk dokumennya berbeda. */
function buildDocxDocument(title, meta, headers, rows){
  const wide = headers.length>6;
  const metaParagraphs = meta.map((line,i)=>'<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r>'+(i===2?'<w:rPr><w:b/><w:sz w:val="28"/></w:rPr>':'<w:rPr><w:sz w:val="20"/></w:rPr>')+'<w:t xml:space="preserve">'+xmlEsc(line)+'</w:t></w:r></w:p>').join('');
  const sectPr = '<w:sectPr><w:pgSz w:w="'+(wide?'16838" w:h="11906" w:orient="landscape"':'11906" w:h="16838"')+'"/><w:pgMar w:top="720" w:right="720" w:bottom="720" w:left="720" w:header="360" w:footer="360"/></w:sectPr>';
  const body = metaParagraphs+'<w:p/>'+docxTableXml(headers, rows)+'<w:p/>'+
    '<w:p><w:pPr><w:jc w:val="right"/></w:pPr><w:r><w:rPr><w:i/><w:sz w:val="16"/></w:rPr><w:t xml:space="preserve">Dicetak dari Bendahara V2 - '+xmlEsc(fmtDate(todayISO()))+'</w:t></w:r></w:p>'+
    sectPr;
  const documentXml = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:body>'+body+'</w:body></w:document>';
  const contentTypes = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
    '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
    '<Default Extension="xml" ContentType="application/xml"/>'+
    '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
    '<Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/>'+
    '</Types>';
  const rootRels = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
    '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
    '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/>'+
    '</Relationships>';
  const coreProps = '<' + '?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/">'+
    '<dc:title>'+xmlEsc(title)+'</dc:title><dc:creator>Bendahara V2</dc:creator></cp:coreProperties>';
  return buildZipArchive([
    {name:'[Content_Types].xml', data:contentTypes},
    {name:'_rels/.rels', data:rootRels},
    {name:'docProps/core.xml', data:coreProps},
    {name:'word/document.xml', data:documentXml}
  ]);
}
function downloadDOCX(filename, title, headers, rows, opts){
  opts = opts||{};
  const meta = reportMetaLines(title, opts.periodeLabel);
  const bytes = buildDocxDocument(title, meta, headers, rows);
  triggerBinaryDownload(filename, bytes, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
}
/* Dipanggil oleh tiap tombol export laporan (format:'xlsx'|'docx') - satu
   titik pemanggilan supaya seluruh laporan konsisten (section 39: data yang
   diekspor = data hasil filter aktif, karena headers/rows datang dari fungsi
   yang SAMA dengan yang sudah menerapkan filter). */
function exportReport(format, baseFilename, title, headers, rows, opts){
  if(format==='docx') downloadDOCX(baseFilename+'.docx', title, headers, rows, opts);
  else downloadXLSX(baseFilename+'.xlsx', title, headers, rows, opts);
}

/* ---- Laporan Bulanan (Patch KPI Bendahara section 6/BDS06): snapshot
   metadata resmi untuk Kepala Sekolah/Bendahara Pusat - TIDAK membuat
   transaksi/kas apapun (sama prinsipnya dengan Terbitkan Tagihan Formal),
   hanya membekukan angka yang SUDAH computed dari ledger saat dikirim
   supaya BDS06 (Pelaporan Unit) punya data nyata untuk diukur, bukan
   permanently NOT_STARTED karena tidak ada penulis Laporan sama sekali. */
function buildLaporanSnapshot(periode){
  const asOf = anchorDateForPeriode(periode);
  const transaksiPeriode = allTransaksi().filter(t=>periodeOfDate(t.tanggal)===periode && !isMigrationArtifact(t));
  const anggaranPeriode = Store.loadAnggaran().filter(a=>a.periode===periode);
  return {
    totalPemasukan: totalPemasukan(periode),
    totalPengeluaran: totalPengeluaran(periode),
    saldoKas: totalSaldoKas(asOf),
    saldoBank: totalSaldoBank(asOf),
    saldoTotal: totalSaldoKas(asOf)+totalSaldoBank(asOf),
    tunggakan: totalTunggakan(periode),
    anggaranRealisasi: anggaranPeriode.map(a=>({program:a.program, periode:a.periode, anggaran:Number(a.nominal||0), realisasi:realisasiForProgram(a.program, a.periode)})),
    transaksiIds: transaksiPeriode.map(t=>t.id)
  };
}
function submitLaporanBulanan(){
  const periode = Store.loadSettings().periodeAktif;
  const arr = Store.loadLaporan();
  const idx = arr.findIndex(l=>l.periode===periode);
  const row = {
    id: idx>=0 ? arr[idx].id : uid('lap'),
    periode, tanggalDibuat: new Date().toISOString(),
    dibuatOleh: Store.loadSettings().namaBendahara||'Bendahara',
    snapshot: buildLaporanSnapshot(periode)
  };
  if(idx>=0) arr[idx]=row; else arr.push(row);
  Store.saveLaporan(arr);
  auditTrailPush('KIRIM_LAPORAN_BULANAN', null, row, 'manual');
  toast('Laporan periode '+periode+' dikirim (snapshot dibekukan dari ledger saat ini)');
  renderContent();
}

function submitRekonsiliasi(akunId){
  const saldoSistem = akunSaldo(akunId);
  const saldoAktual = numval('rk_aktual');
  const selisih = saldoAktual - saldoSistem;
  const catatan = val('rk_catatan');
  if(selisih!==0 && !catatan){ toast('Selisih ditemukan ('+fmtRp(selisih)+') - catatan penjelasan WAJIB diisi'); return; }
  /* [P1-C] Saldo sistem, selisih, dan status DIHITUNG SERVER (opReconcileAccount); nilai klien hanya pratinjau. */
  if(!(centralReady_() && ServerBridge.opReconcileAccount)){ toast('Gagal mencatat rekonsiliasi: ' + centralNotReadyText_()); return; }
  toast('Mencatat rekonsiliasi di server - menunggu konfirmasi...');
  return ServerBridge.opReconcileAccount({akunId:akunId, periode:Store.loadSettings().periodeAktif, saldoAktual:saldoAktual, catatan:catatan, clientRequestId:uid('rk')}).then(function(res){
    if(!res || !res.ok){ toast('GAGAL mencatat rekonsiliasi: ' + centralErrText(res)); return false; }
    const r = res.data || {};
    auditTrailPush('REKONSILIASI', null, r, 'manual');
    closeModal(); toast(Math.abs(Number(r.selisih||0))<0.5 ? 'Rekonsiliasi selesai, saldo sesuai (dihitung server)' : 'Rekonsiliasi dicatat dengan selisih '+fmtRp(r.selisih)+' terhadap saldo sistem server '+fmtRp(r.saldoSistem)+' (perlu penjelasan/tindak lanjut)');
    return loadOperationalData(['rekonsiliasi']).then(function(){ renderContent(); return true; });
  });
}

/* ---- KPI Report (traceable: Skor -> Indikator -> Rows -> Detail) ---- */
/* Rata-rata 5 dimensi tertimbang bobot indikator dalam satu KPI - HANYA
   untuk ringkasan tampilan; tidak menyentuh formula Score Engine (Score
   tetap dari kpiIndukRow/computeKpiRow apa adanya). */
function kpiDimensionSummary(row){
  const dims = ['dimQuantity','dimQuality','dimTimeliness','dimFollowUp','dimImprovement'];
  const out = {};
  dims.forEach(d=>{
    const usable = row.indicators.filter(i=>i[d]!=null);
    out[d] = usable.length ? round1(sum(usable.map(i=>i[d]*i.bobot))/sum(usable.map(i=>i.bobot))) : null;
  });
  return out;
}
function allIndicatorProblems(periode){
  const summary = kpiIndukSummary(periode);
  const out = [];
  summary.rows.forEach(row=>{ row.indicators.forEach(i=>{ const c=indicatorProblemRows(i,periode).length; if(c>0) out.push({kpiKode:row.kode, kpiNama:row.nama, indikator:i, count:c}); }); });
  return out.sort((a,b)=>b.count-a.count);
}
function renderKpiReport(){
  const periode = Store.loadSettings().periodeAktif;
  const summary = kpiIndukSummary(periode);
  const laporanMeta = Store.loadLaporan().find(l=>l.periode===periode);
  let html = '<div class="card"><h3>KPI Bendahara - '+esc(periode)+' <span class="small-muted">(Unified KPI Engine - sama dengan Kepala Sekolah &amp; Waka Kurikulum)</span></h3>'+
    '<div class="tiles"><div class="tile '+scoreClass(summary.overall)+'"><div class="label">Skor Keseluruhan (Total Score)</div><div class="value">'+(summary.overall==null?'N/A':summary.overall)+'</div><div class="small-muted">'+summary.overallStatus+'</div></div></div>'+
    '<div class="modal-actions" style="justify-content:flex-start;margin-top:8px">'+
    (laporanMeta ? ('<span class="badge green">Laporan periode ini sudah dikirim - '+fmtDate((laporanMeta.tanggalDibuat||'').slice(0,10))+'</span> <button class="btn sm" onclick="submitLaporanBulanan()">Kirim Ulang (Update Snapshot)</button>')
      : '<button class="btn primary" onclick="submitLaporanBulanan()">Kirim Laporan Bulanan (BDS06)</button>')+

  html += '<div class="card"><h3>BDS01-06</h3><div class="tablewrap"><table><thead><tr><th>Kode</th><th>Nama</th><th>Bobot</th><th>Skor</th><th>Status</th><th>Quantity</th><th>Quality</th><th>Timeliness</th><th>Follow-Up</th><th>Improvement</th><th>Masalah</th></tr></thead><tbody>'+
    summary.rows.map(r=>{

      return '<tr style="cursor:pointer" onclick="openKpiDetailModal(\''+r.kode+'\')"><td>'+r.kode+'</td><td>'+esc(r.nama)+'</td><td>'+r.bobot+'%</td><td>'+(r.skor==null?'N/A':r.skor)+'</td><td>'+r.status+'</td>'+
        '<td>'+dCell(d.dimQuantity)+'</td><td>'+dCell(d.dimQuality)+'</td><td>'+dCell(d.dimTimeliness)+'</td><td>'+dCell(d.dimFollowUp)+'</td><td>'+dCell(d.dimImprovement)+'</td>'+
        '<td>'+(r.jumlahMasalah? '<span class="badge red">'+r.jumlahMasalah+'</span>':'<span class="badge green">0</span>')+'</td></tr>';
    }).join('')+
    '</tbody></table></div><p class="small-muted">Klik baris untuk detail per-indikator (Kode/Target/Actual/5 Dimensi/Score/Status).</p></div>';

  const problems = allIndicatorProblems(periode);
  html += '<div class="card"><h3>Indikator Bermasalah ('+problems.length+')</h3>';
  html += problems.length ? '<div class="tablewrap"><table><thead><tr><th>KPI</th><th>Indikator</th><th>Jumlah Masalah</th><th>Aksi</th></tr></thead><tbody>'+
      problems.slice(0,15).map(p=>'<tr><td>'+p.kpiKode+'</td><td>'+esc(p.indikator.nama)+'</td><td><span class="badge red">'+p.count+'</span></td><td><a class="link" onclick="openKpiDetailModal(\''+p.kpiKode+'\')">Lihat</a></td></tr>').join('')+
      '</tbody></table></div>'
    : '<div class="empty">Tidak ada indikator bermasalah.</div>';

    '<div class="tiles">'+
    tile('Penerimaan Belum Teridentifikasi', penerimaanBelumTeridentifikasi().length, penerimaanBelumTeridentifikasi().length?'warn':'good')+
    tile('Pembayaran Belum Dialokasi', pembayaranBelumDialokasi().length, pembayaranBelumDialokasi().length?'warn':'good')+

function hapusDokumen(id){
  const arr = Store.loadDokumen();
  const idx = arr.findIndex(d=>d.id===id);
  if(idx<0) return;
  const before = deepClone(arr[idx]);
  arr.splice(idx,1);
  Store.saveDokumen(arr);
  auditTrailPush('HAPUS_DOKUMEN', before, null, 'manual');
  toast('Dokumen dihapus'); renderContent();
}

  return JSON.stringify(r).slice(0,100);

function submitTarif(id){
  if(!centralMasterWriteActive()){ toast('GAGAL: ' + centralNotReadyText_()); return; } // [P0-B] tanpa simpan lokal
  if(centralMasterWriteActive()){
    centralMasterSave('tarif', id, {komponenId:val('trf_komponen'), unit:val('trf_unit'), kelas:val('trf_kelas'), tahunAjaran:val('trf_ta'), nominal:numval('trf_nominal')}, 'Tarif tersimpan di Google Sheets'); return;
  }

  const data = {komponenId:val('trf_komponen'), unit:val('trf_unit'), kelas:val('trf_kelas'), tahunAjaran:val('trf_ta'), nominal:numval('trf_nominal'), status:val('trf_status')};
  if(id){ const idx=arr.findIndex(t=>t.id===id); if(idx<0){ toast('Tarif tidak ditemukan'); return; } const before=deepClone(arr[idx]); arr[idx]=Object.assign(arr[idx],data); auditTrailPush('EDIT_TARIF', before, arr[idx], 'manual'); }
  else{ data.id=uid('trf'); arr.push(data); auditTrailPush('TAMBAH_TARIF', null, data, 'manual'); }

/* Section 42: Tarif belum pernah dipakai (tidak ada Tagihan snapshot/Alokasi
   yang merujuk komponen ini secara historis) -> boleh Hapus. Sudah dipakai
   -> Nonaktifkan saja (tarifFor sudah mengecualikan status Nonaktif dari
   perhitungan Kewajiban Computed baru, histori/Alokasi lama tetap aman). */
function tarifUsedInHistory(t){
  return OperationalAPI.alokasi().some(a=>a.komponenId===t.komponenId) || Store.loadTagihan().some(tg=>tg.komponen===((komponenById(t.komponenId)||{}).nama));
}
function hapusAtauNonaktifkanTarif(id){
  if(!centralMasterWriteActive()){ toast('GAGAL: ' + centralNotReadyText_()); return; } // [P0-B] tanpa simpan lokal
  if(centralMasterWriteActive()){ toast(CENTRAL_MSG.noStatus); return; }
  const arr = Store.loadTarif();
  const idx = arr.findIndex(t=>t.id===id);
  if(idx<0) return;
  const row = arr[idx];
  if(row.status==='Nonaktif'){ row.status='Aktif'; Store.saveTarif(arr); auditTrailPush('AKTIFKAN_TARIF', null, row, 'manual'); toast('Tarif diaktifkan kembali'); renderContent(); return; }
  if(tarifUsedInHistory(row)){ row.status='Nonaktif'; Store.saveTarif(arr); auditTrailPush('NONAKTIFKAN_TARIF', null, row, 'manual'); toast('Tarif sudah dipakai histori - dinonaktifkan, bukan dihapus'); renderContent(); return; }
  const before = deepClone(row); arr.splice(idx,1); Store.saveTarif(arr);
  auditTrailPush('HAPUS_TARIF', before, null, 'manual'); toast('Tarif dihapus'); renderContent();
}

function closePeriode(periode){
  /* [P1-POLICY] Status closing = penanda administratif yang disimpan SERVER (opClosePeriod, beraudit). Pencatatan pada
     periode bertanda tetap diterima dan ditandai di audit. Tidak ada penulisan blob lokal; tanpa server -> galat eksplisit. */
  if(!(centralReady_() && ServerBridge.opClosePeriod)){ toast('Gagal menutup periode: ' + centralNotReadyText_()); return; }
  toast('Menutup periode ' + periode + ' di server - menunggu konfirmasi...');
  return ServerBridge.opClosePeriod(periode).then(function(res){
    if(!res || !res.ok){ toast('GAGAL menutup periode: ' + centralErrText(res)); return false; }
    if(!(res.data && res.data.unchanged)) auditTrailPush('CLOSING_PERIODE', null, res.data && res.data.entry, 'manual');
    toast(res.data && res.data.unchanged ? 'Periode sudah ditutup sebelumnya' : 'Periode ditutup (dikonfirmasi server)');
    return loadCentralMasterData({skipOperational:true}).then(function(){ renderContent(); return true; });
  });
}
function reopenPeriode(periode){
  /* [P1-A] Buka kembali periode WAJIB alasan (dicatat di audit server). [P1-POLICY] teks sesuai keputusan 17-10-2026. */
  openModal('<h3>Buka Kembali Periode '+esc(periode)+'</h3>'+
    '<p class="small-muted">Status periode bersifat penandaan administratif untuk pelaporan; pencatatan tetap dapat dilakukan dan tercatat di audit.</p>'+
    fieldTextarea('rp_alasan','Alasan membuka kembali (wajib, minimal 10 karakter)','')+
    '<div class="modal-actions"><button class="btn" onclick="closeModal()">Batal</button><button class="btn primary" onclick="submitReopenPeriode(\''+periode+'\')">Buka Kembali</button></div>');
}
function submitReopenPeriode(periode){
  const alasan = String(val('rp_alasan')||'').trim();
  if(alasan.length < 10){ toast('Alasan membuka kembali periode wajib diisi (minimal 10 karakter)'); return; }
  if(!(centralReady_() && ServerBridge.opReopenPeriod)){ toast('Gagal membuka kembali periode: ' + centralNotReadyText_()); return; }
  toast('Membuka kembali periode ' + periode + ' di server - menunggu konfirmasi...');
  return ServerBridge.opReopenPeriod(periode, alasan).then(function(res){
    if(!res || !res.ok){ toast('GAGAL membuka kembali periode: ' + centralErrText(res)); return false; }
    if(!(res.data && res.data.unchanged)) auditTrailPush('REOPEN_PERIODE', null, res.data && res.data.entry, 'manual');
    closeModal(); toast(res.data && res.data.unchanged ? 'Periode tidak dalam status CLOSED' : 'Periode dibuka kembali (dikonfirmasi server)');
    return loadCentralMasterData({skipOperational:true}).then(function(){ renderContent(); return true; });
  });
}

function hapusAtauNonaktifkanKomponen(id){

  const before = deepClone(row); s.komponenBiayaList.splice(idx,1); Store.saveSettings(s);

  if(centralMasterWriteActive()){ centralMasterToggle(type==='pengeluaran' ? 'kategoriPengeluaran' : 'kategoriPenerimaan', id, type==='pengeluaran' ? MasterAPI.expenseCategories() : MasterAPI.incomeCategories(), 'Kategori diaktifkan kembali', 'Kategori dinonaktifkan (tidak dihapus)'); return; }

/* ============================================================
   16. IMPORT ENGINE (Excel/CSV Standard)
   UPLOAD -> READ HEADER -> MAP HEADER -> VALIDATE -> PREVIEW -> CONFIRM -> IMPORT.
   Catatan format file: app ini 100% offline tanpa dependency eksternal
   (tidak ada parser .xlsx biner tanpa library pihak ketiga) - engine ini
   menerima CSV/TSV (hasil "Save As CSV" dari Excel, satu langkah biasa),
   dengan header alias/urutan bebas/kolom tambahan persis seperti diminta.
   ============================================================ */

/* ---- 16a. Parsing CSV/TSV (quote-aware) ---- */
/* Auto-detect delimiter (Patch: jangan asumsikan CSV selalu comma).
   Uji comma/semicolon/tab/pipe pada beberapa baris sample; delimiter yang
   benar adalah yang MUNCUL (min>0) dan JUMLAHNYA KONSISTEN di semua baris
   sample (baris data asli selalu punya jumlah kolom yang sama). */
function detectDelimiter(text){
  const sampleLines = text.split(/\r?\n/).filter(l=>l.trim()).slice(0,5);
  if(!sampleLines.length) return {delim:',', confident:false};
  const candidates = [',',';','\t','|'];
  let best=',', bestScore=-1, anyConfident=false;
  candidates.forEach(d=>{
    const counts = sampleLines.map(l=>l.split(d).length-1);
    const min = Math.min.apply(null, counts);
    const consistent = counts.every(c=>c===counts[0]);
    if(min>0 && consistent && min>bestScore){ bestScore=min; best=d; anyConfident=true; }
  });
  return {delim:best, confident:anyConfident};
}
/* Baris pertama dianggap HEADER hanya kalau minimal 2 selnya cocok dengan
   alias field yang dikenal (Patch: jangan anggap baris pertama SELALU
   header - file headerless seperti "1;HANA MADINAH;Madinah;TK;..." harus
   tetap diperlakukan sebagai baris DATA, bukan header). */
function looksLikeHeaderRow(cells){
  const knownTokens = {};
  Object.keys(HEADER_ALIASES).forEach(f=>HEADER_ALIASES[f].forEach(a=>{ knownTokens[normalizeHeader(a)]=true; }));
  const matches = cells.filter(c=>knownTokens[normalizeHeader(c)]).length;
  return matches>=2 || (cells.length<=3 && matches>=1);
}
function splitDelimitedLine(line, delim){
  const out=[]; let cur=''; let inQ=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQ){ if(c==='"'){ if(line[i+1]==='"'){cur+='"'; i++;} else inQ=false; } else cur+=c; }
    else{ if(c==='"') inQ=true; else if(c===delim){ out.push(cur); cur=''; } else cur+=c; }
  }
  out.push(cur);
  return out.map(s=>s.trim());
}
function parseDelimitedText(text, forceDelim){
  text = String(text||'').replace(/^\uFEFF/, '');
  const detection = forceDelim ? {delim:forceDelim, confident:true} : detectDelimiter(text);
  const delim = detection.delim;
  const lines = text.split(/\r?\n/).filter(l=>l.length>0);
  if(!lines.length) return {headers:[], rows:[], delim, confident:detection.confident, columnCount:0, headerless:false};
  const firstCells = splitDelimitedLine(lines[0], delim);
  const headerLike = looksLikeHeaderRow(firstCells);
  const headers = headerLike ? firstCells : firstCells.map((_,i)=>'Kolom '+(i+1));
  const dataLines = headerLike ? lines.slice(1) : lines;
  const rows = dataLines.map(line=>{
    const cells = splitDelimitedLine(line, delim);
    const obj = {};
    headers.forEach((h,i)=>{ obj[h] = cells[i]!==undefined? cells[i] : ''; });
    return obj;
  }).filter(r=>Object.values(r).some(v=>String(v).trim()!==''));
  return {headers, rows, delim, confident:detection.confident, columnCount:headers.length, headerless:!headerLike};
}
function numFromStr(v){
  if(v==null||v==='') return 0;
  const n = Number(String(v).replace(/[^\d.-]/g,'').replace(/(\..*)\./g,'$1'));
  return isNaN(n)?0:n;
}
function normalizeDateValue(v){
  if(!v) return '';
  v = String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(v)) return v;
  let m = v.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/); // DD/MM/YYYY
  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');
  m = v.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/); // YYYY-MM-DD variants
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  const d = new Date(v);
  if(!isNaN(d)) return dateToISO(d);
  return '';
}

function normalizeHeader(h){ return String(h||'').toLowerCase().trim().replace(/\s+/g,' ').replace(/\*/g,''); }

/* Kolom bernama sama dengan Komponen Biaya terdaftar (mis. "SPP", "Daftar Ulang")
   diperlakukan KHUSUS untuk Mutasi Bank: tiap kolom begitu, jika nilainya > 0,
   menjadi SATU baris Alokasi (Phase 5/6/7) - bukan field biasa. */
function komponenColumnCandidates(headers){
  const komponenList = Store.loadSettings().komponenBiayaList||[];
  const aliasMap = {'jumlah bulanan':'SPP'};
  /* Kolom alias (mis. "Jumlah Bulanan") HANYA dipakai kalau tidak ada kolom
     literal untuk komponen yang sama di baris ini - banyak file sumber (mis.
     mutasi bank) punya "SPP" dan "Jumlah Bulanan" berdampingan sebagai DUA
     LABEL untuk NILAI YANG SAMA, bukan dua tagihan terpisah. Tanpa penjagaan
     ini keduanya akan dihitung dua kali (2x alokasi untuk satu pembayaran). */
  const directNamesLower = headers.map(h=>{
    const n = normalizeHeader(h);
    const d = komponenList.find(k=>k.nama.toLowerCase()===n);
    return d ? d.nama.toLowerCase() : null;
  }).filter(Boolean);
  return headers.map(h=>{
    const n = normalizeHeader(h);
    const alias = aliasMap[n];
    const direct = komponenList.find(k=>k.nama.toLowerCase()===n);
    if(alias && directNamesLower.includes(alias.toLowerCase())) return null;
    const kompNama = alias || (direct?direct.nama:null);
    return kompNama ? {header:h, komponenNama:kompNama} : null;
  }).filter(Boolean);
}

/* Fase 3B-3A: resolusi unit untuk baris import Penerimaan/Pengeluaran/Mutasi
   Bank - urutan sumber (BUKAN tebakan, semua dari data yang sudah ada):
   1) kolom "Unit"/"Jenjang" eksplisit di file (HEADER_ALIASES.unit sudah ada

      dibiarkan lolos tanpa unit. */
function resolveUnitForImportRow(get, rawRow, siswaId){
  const units = Store.loadSettings().unitList||['TK','MI'];

    if(siswa && siswa.unit) return siswa.unit;
  }

}

/* ---- 16c. Kemiripan nama (untuk deteksi siswa mirip - Phase 2) ---- */
function levenshtein(a,b){
  const m=a.length,n=b.length; const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=0;i<=m;i++) dp[i][0]=i; for(let j=0;j<=n;j++) dp[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1] : 1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function stringSimilarity(a,b){ if(!a||!b) return 0; const dist=levenshtein(a,b); return 1-(dist/Math.max(a.length,b.length)); }

/* ---- 16d. Student matcher (Phase 10) - NIS/NISN dulu, lalu Nama+Kelas+Unit.
   TIDAK PERNAH auto-membuat siswa baru hanya karena mirip. ---- */
function matchSiswaByFields(nisRaw, namaRaw, kelasRaw, unitRaw){
  const nis=(nisRaw||'').trim(), nama=(namaRaw||'').trim(), kelas=(kelasRaw||'').trim(), unit=(unitRaw||'').trim();
  const all = MasterAPI.students();
  if(nis){
    const byNis = all.filter(s=>(s.nis&&s.nis===nis)||(s.nisn&&s.nisn===nis));
    if(byNis.length===1) return {status:'MATCH', siswaId:byNis[0].id};
    if(byNis.length>1) return {status:'AMBIGUOUS', candidates:byNis};
    /* NISN diberikan tapi TIDAK cocok siapapun - JANGAN lanjut auto-match by
       nama (patch: "Nama yang sama tetapi NISN berbeda JANGAN otomatis
       dianggap siswa yang sama"). Kalau nama tetap cocok ke suatu record,
       itu sinyal KONFLIK (NISN beda, nama sama) - serahkan ke manusia. */
    if(nama){
      const nameMatch = all.filter(s=>(s.nama||'').toLowerCase()===nama.toLowerCase() && (!kelas||s.kelas===kelas) && (!unit||s.unit===unit));
      if(nameMatch.length) return {status:'AMBIGUOUS', candidates:nameMatch};
    }
    return {status:'NEW', nama, kelas, unit};
  }
  if(nama){
    const exact = all.filter(s=>(s.nama||'').toLowerCase()===nama.toLowerCase() && (!kelas||s.kelas===kelas) && (!unit||s.unit===unit));
    if(exact.length===1) return {status:'MATCH', siswaId:exact[0].id};
    if(exact.length>1) return {status:'AMBIGUOUS', candidates:exact};
    const similar = all.filter(s=>stringSimilarity((s.nama||'').toLowerCase(), nama.toLowerCase())>=0.82);
    if(similar.length) return {status:'AMBIGUOUS', candidates:similar};
    return {status:'NEW', nama, kelas, unit};
  }
  return {status:'UNKNOWN'};
}

/* ---- 16e. Duplikasi transaksi via fingerprint (Phase 13) ---- */
/* sumber TIDAK diikutkan di fingerprint - t.sumber/t.kategori pada sisi
   tersimpan bisa berisi nilai DEFAULT hasil commit (bukan data mentah baris),
   yang tidak sebanding dengan field mentah di sisi query (bisa menyebabkan
   false-negative pada deteksi duplikat). tanggal+nominal+namaPengirim+
   ftNumber+uraian sudah cukup kuat dan keduanya SELALU nilai mentah asli. */
function rowFingerprint(tanggal, nominal, extra){
  return [tanggal, nominal, (extra.namaPengirim||'').toLowerCase(), (extra.ftNumber||'').toLowerCase(), (extra.uraian||'').toLowerCase()].join('|');
}
function transaksiFingerprint(t){ return rowFingerprint(t.tanggal, t.nominal, {namaPengirim:t.namaPengirim||'', ftNumber:t.ftNumber||'', uraian:t.catatan||t.uraian||''}); }
function findDuplicateTransaksi(tanggal, nominal, extra){
  const fp = rowFingerprint(tanggal, nominal, extra);
  return allTransaksi().find(t=>transaksiFingerprint(t)===fp);
}

/* PARSE -> MAP -> VALIDATE -> PREVIEW -> IMPORT (bukan READ -> IMPORT).
   Teks mentah tiap file disimpan (rawFiles) supaya delimiter bisa dipilih
   ULANG secara manual tanpa perlu upload ulang file. */
function buildImportSessionFromRawFiles(forceDelim){
  const s = State.importSession;
  let combinedHeaders = [], combinedRows = [], parseInfoFiles = [];
  s.rawFiles.forEach(f=>{
    const parsed = parseDelimitedText(f.text, forceDelim);
    parsed.rows.forEach(r=>{ r._sheetName = f.sheetName; });
    parsed.headers.forEach(h=>{ if(combinedHeaders.indexOf(h)<0) combinedHeaders.push(h); });
    combinedRows = combinedRows.concat(parsed.rows);
    parseInfoFiles.push({name:f.name, delim:parsed.delim, confident:parsed.confident, columnCount:parsed.columnCount, rowCount:parsed.rows.length, headerless:parsed.headerless, sample:parsed.rows.slice(0,3)});
  });
  s.headers = combinedHeaders;
  s.rows = combinedRows;
  s.headerMap = mapHeadersAuto(combinedHeaders);
  s.parseInfo = {files:parseInfoFiles, totalRows:combinedRows.length, columnCount:combinedHeaders.length,
    delim:parseInfoFiles[0]?parseInfoFiles[0].delim:',', confident:parseInfoFiles.every(f=>f.confident), headerless:parseInfoFiles.some(f=>f.headerless)};
  s.structurallyValid = combinedHeaders.length>1;
}
function reparseWithDelimiter(delim){
  buildImportSessionFromRawFiles(delim);
  toast('Diparse ulang dengan delimiter "'+(delim==='\t'?'Tab':delim)+'"');
  openModal(importWizardHtml(), true);
}

function importWizardReadFile(){
  const type = State.importSession.type;
  const input = document.getElementById('imp_wizard_file');
  const files = Array.from((input&&input.files)||[]);
  if(!files.length){ toast('Pilih file terlebih dahulu'); return; }
  auditTrailPush('IMPORT_START', null, {type, fileNames:files.map(f=>f.name)}, 'import-wizard');
  const rawFiles = []; let remaining = files.length;
  files.forEach(f=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      rawFiles.push({name:f.name, sheetName:f.name.replace(/\.[^.]+$/,''), text:String(reader.result)});
      remaining--;
      if(remaining===0){
        State.importSession.rawFiles = rawFiles;
        buildImportSessionFromRawFiles();
        if(!State.importSession.rows.length){ toast('File kosong atau format tidak dikenali'); return; }
        State.importSession.step = 'map';
        openModal(importWizardHtml(), true);
      }
    };
    reader.readAsText(f);
  });
